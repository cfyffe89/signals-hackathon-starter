<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signals Hackathon Starter</title>
<style>
  :root { --accent:#148087; --bg:#fff; --text:#333; --muted:#666; --border:#e3e3e3; --surface:#f6f8f8; }
  body { font-family: "Hanken Grotesk", system-ui, sans-serif; margin:0; color:var(--text); background:var(--bg); }
  header { padding:1rem 1.5rem; border-bottom:1px solid var(--border); display:flex; gap:1rem; align-items:center; flex-wrap:wrap }
  header h1 { font-size:1.2rem; margin:0; color:var(--accent) } .pill { font-size:.8rem; padding:.15rem .6rem; border-radius:30px; border:1px solid var(--border) }
  main { display:grid; grid-template-columns: minmax(260px,1fr) 2fr; gap:1rem; padding:1rem 1.5rem }
  @media (max-width:800px){ main{ grid-template-columns:1fr } }
  .card { border:1px solid var(--border); border-radius:8px; padding:1rem; background:var(--surface) }
  ul { list-style:none; padding:0; margin:0 } li { padding:.4rem; border-bottom:1px solid var(--border); cursor:pointer } li:hover, li.sel { background:#e8f3f3 }
  textarea, input { width:100%; box-sizing:border-box; font:inherit; padding:.5rem; border:1px solid var(--border); border-radius:6px }
  button { background:var(--accent); color:#fff; border:0; border-radius:30px; padding:.5rem 1.2rem; font:inherit; cursor:pointer }
  pre { white-space:pre-wrap; background:#fff; border:1px solid var(--border); padding:.8rem; border-radius:6px; max-height:50vh; overflow:auto }
  .muted { color:var(--muted); font-size:.85rem }
</style>
</head>
<body>
<header><h1>Signals Hackathon Starter · FastAPI</h1><span id="status" class="pill">checking…</span>
  <a href="/docs">API docs (/docs)</a><span class="muted">Streamlit app: port 8501</span></header>
<main>
  <section class="card"><h3>Recent experiments</h3><ul id="exps"><li class="muted">loading…</li></ul></section>
  <section class="card">
    <h3>Ask (grounded AI)</h3>
    <p class="muted" id="ctx">No experiment selected: answers use the Signals knowledge pack only.</p>
    <textarea id="q" rows="3">How do I create a sample in an experiment from a template?</textarea>
    <p><label><input type="checkbox" id="kn" checked style="width:auto"> include API / integration knowledge</label></p>
    <button id="go">Ask</button> <span id="busy" class="muted"></span>
    <pre id="out" hidden></pre>
  </section>
</main>
<script>
let eid = null;
const j = (u, o) => fetch(u, o).then(r => r.json());
j("/api/health").then(h => { document.getElementById("status").textContent =
  `Signals: ${h.signals.status} · AI: ${h.ai.provider}${h.ai.mockMode ? " (mock)" : ""}`; });
j("/api/experiments?limit=15").then(xs => {
  const ul = document.getElementById("exps"); ul.innerHTML = "";
  (xs.detail ? [] : xs).forEach(x => { const li = document.createElement("li"); li.textContent = x.name;
    li.onclick = () => { eid = x.eid; [...ul.children].forEach(c => c.classList.remove("sel")); li.classList.add("sel");
      document.getElementById("ctx").textContent = `Grounded in: ${x.name} (${x.eid})`;
      document.getElementById("q").value = "Summarise this experiment and flag anything unusual."; };
    ul.appendChild(li); });
  if (!ul.children.length) ul.innerHTML = `<li class="muted">${xs.detail || "no experiments"}</li>`;
});
document.getElementById("go").onclick = async () => {
  const busy = document.getElementById("busy"), out = document.getElementById("out"); busy.textContent = "thinking…";
  const r = await j("/api/ask", { method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ question: document.getElementById("q").value, eid, use_knowledge: document.getElementById("kn").checked }) });
  out.hidden = false; out.textContent = (r.text || r.detail || JSON.stringify(r)) + (r.source ? `\n\n— ${r.source}` : "");
  busy.textContent = "";
};
</script>
</body>
</html>
