openapi: 3.0.1
info:
  title: 'Signals Notebook APIs Document'
  version: v1.0
servers:
  - url: '/api/rest/v1.0'
    description: 'Signals Notebook'
security:
  - api_key: []
paths:
  /scim/v2/ServiceProviderConfig:
    get:
      tags:
        - SCIM
      summary: 'Fetch SCIM ServiceProviderConfig'
      description: 'Fetch SCIM ServiceProviderConfig'
      operationId: 'fetchSCIMServiceProviderConfig'
      responses:
        '200':
          description: 'OK'
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ServiceProviderConfigResponse'
        '4XX':
          description: 'Request error'
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '5XX':
          description: 'Internal Error'
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      deprecated: false
  /scim/v2/ResourceTypes:
    get:
      tags:
        - SCIM
      summary: 'Fetch SCIM ResourceTypes'
      description: 'Fetch SCIM ResourceTypes'
      operationId: 'fetchSCIMResourceTypes'
      responses:
        '200':
          description: 'OK'
          content:
            application/scim+json:
              schema:
                type: object
                properties:
                  schemas:
                    type: array
                    items:
                      type: string
                  totalResults:
                    type: number
                  Resources:
                    type: array
                    items:
                      $ref: '#/components/schemas/ResourceTypeResponse'
        '4XX':
          description: 'Request error'
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '5XX':
          description: 'Internal Error'
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      deprecated: false
  /scim/v2/ResourceTypes/{resourceTypeId}:
    get:
      tags:
        - SCIM
      summary: 'Fetch SCIM ResourceType by id'
      description: 'Fetch SCIM ResourceType by id'
      operationId: 'fetchSCIMResourceTypeById'
      parameters:
        - $ref: '#/components/parameters/resourceTypeIdParam'
      responses:
        '200':
          description: 'OK'
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ResourceTypeResponse'
        '4XX':
          description: 'Request error'
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '5XX':
          description: 'Internal Error'
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      deprecated: false
  /scim/v2/Schemas:
    get:
      tags:
        - SCIM
      summary: 'Fetch SCIM Schemas'
      description: 'Fetch SCIM Schemas'
      operationId: 'fetchSCIMSchemas'
