  examples:
    userApiRequest:
      value:
        schemas:
          - 'urn:ietf:params:scim:schemas:core:2.0:User'
          - 'urn:ietf:params:scim:schemas:extension:signalsnotebook:2.0:UserProperties'
        userName: 'email@[your_domain]'
        name:
          familyName: 'account'
          givenName: 'test'
        urn:ietf:params:scim:schemas:extension:signalsnotebook:2.0:UserProperties:
          alias: ''
          country: 'USA'
          organization: 'snb'
        roles:
          - value: '3'
            display: 'Standard User'
    updateUserWithLicenseApiRequest:
      value:
        schemas:
          - 'urn:ietf:params:scim:schemas:core:2.0:User'
          - 'urn:ietf:params:scim:schemas:extension:signalsnotebook:2.0:UserProperties'
        userName: 'email@[your_domain]'
        name:
          familyName: 'account'
          givenName: 'test'
        urn:ietf:params:scim:schemas:extension:signalsnotebook:2.0:UserProperties:
          alias: ''
          country: 'USA'
          organization: 'snb'
          licenses:
            - id: 'signals_suite'
              active: true
            - id: 'signals_notebook'
              active: true
            - id: 'chemoffice_plus'
              active: false
        roles:
          - value: '3'
            display: 'Standard User'
    groupApiRequest:
      value:
        schemas:
          - 'urn:ietf:params:scim:schemas:core:2.0:Group'
        displayName: 'TestGroup1'
    addUserPatchApiRequest:
      value:
        schemas:
          - 'urn:ietf:params:scim:api:messages:2.0:PatchOp'
        Operations:
          - op: 'add'
            value:
              roles:
                - value: '1'
                  display: 'System Admin'
    replaceUserPatchApiRequest:
      value:
        schemas:
          - 'urn:ietf:params:scim:api:messages:2.0:PatchOp'
        Operations:
          - op: 'replace'
            path: 'urn:ietf:params:scim:schemas:extension:signalsnotebook:2.0:UserProperties:organization'
            value: 'eln'
    removeUserPatchApiRequest:
      value:
        schemas:
          - 'urn:ietf:params:scim:api:messages:2.0:PatchOp'
        Operations:
          - op: 'remove'
            path: 'roles[value eq 1]'
    activateUserPatchApiRequest:
      value:
        schemas:
          - 'urn:ietf:params:scim:api:messages:2.0:PatchOp'
        Operations:
          - op: 'replace'
            path: 'active'
            value: true
    deactivateUserPatchApiRequest:
      value:
        schemas:
          - 'urn:ietf:params:scim:api:messages:2.0:PatchOp'
        Operations:
          - op: 'replace'
            path: 'active'
            value: false
    activateUserLicensesPatchApiRequest:
      value:
        schemas:
          - 'urn:ietf:params:scim:api:messages:2.0:PatchOp'
        Operations:
          - op: 'replace'
            path: 'urn:ietf:params:scim:schemas:extension:signalsnotebook:2.0:UserProperties:licenses[id eq chemoffice_plus]'
            value:
              id: 'chemoffice_plus'
              active: true
    deactivateUserLicensesPatchApiRequest:
      value:
        schemas:
          - 'urn:ietf:params:scim:api:messages:2.0:PatchOp'
        Operations:
          - op: 'replace'
            path: 'urn:ietf:params:scim:schemas:extension:signalsnotebook:2.0:UserProperties:licenses[id eq chemoffice_plus]'
            value:
              id: 'chemoffice_plus'
              active: false

    addGroupPatchApiRequest:
      value:
        schemas:
          - 'urn:ietf:params:scim:api:messages:2.0:PatchOp'
        Operations:
          - op: 'add'
            value:
              members:
                - value: 'user-100'
                  display: 'test.account@example.com'
                - value: 'user-101'
                  display: 'test2.account@example.com'
    replaceGroupPatchApiRequest:
      value:
        schemas:
          - 'urn:ietf:params:scim:api:messages:2.0:PatchOp'
        Operations:
          - op: 'replace'
            path: 'displayName'
            value: 'TestGroup'
    removeGroupPatchApiRequest:
      value:
        schemas:
          - 'urn:ietf:params:scim:api:messages:2.0:PatchOp'
        Operations:
          - op: 'remove'
            path: 'members[value eq user-101]'
    bulkApiRequest:
      value:
        schemas:
          - 'urn:ietf:params:scim:api:messages:2.0:BulkRequest'
        Operations:
          - method: 'POST'
            path: '/Users'
            bulkId: 'qwerty'
            data:
              schemas:
                - 'urn:ietf:params:scim:schemas:core:2.0:User'
                - 'urn:ietf:params:scim:schemas:extension:signalsnotebook:2.0:UserProperties'
              userName: 'email@[your_domain]'
              name:
                familyName: 'account'
                givenName: 'test'
              urn:ietf:params:scim:schemas:extension:signalsnotebook:2.0:UserProperties:
                alias: ''
                country: 'USA'
                organization: 'snb'
          - method: 'POST'
            path: '/Groups'
            bulkId: 'ytrewq'
            data:
              schemas:
                - 'urn:ietf:params:scim:schemas:core:2.0:Group'
              displayName: 'TestGroup1'
          - method: 'PATCH'
            path: '/Groups/group-100'
            data:
              - op: 'replace'
                path: 'displayName'
                value: 'TestGroup'
          - method: 'DELETE'
            path: '/Groups/group-100'