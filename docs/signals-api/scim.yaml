      description: 'Fetch SCIM Schemas by id'
      operationId: 'fetchSCIMSchemasById'
      parameters:
        - $ref: '#/components/parameters/schemaIdParam'
      responses:
        '200':
          description: 'OK'
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/SchemasResponse'
        '4XX':
          description: 'Request error'
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '5XX':
          description: 'Internal Error'
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      deprecated: false
  /scim/v2/Users:
    get:
      tags:
        - SCIM
      summary: 'Search SCIM user'
      description: 'Search SCIM user'
      operationId: 'SearchSCIMUser'
      parameters:
        - $ref: '#/components/parameters/filterParam'
        - $ref: '#/components/parameters/sortByParam'
        - $ref: '#/components/parameters/sortOrderParam'
        - $ref: '#/components/parameters/startIndexParam'
        - $ref: '#/components/parameters/countParam'
        - $ref: '#/components/parameters/requestAttributesParam'
        - $ref: '#/components/parameters/excludedAttributesParam'
      responses:
        '200':
          description: 'OK'
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '4XX':
          description: 'Request error'
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '5XX':
          description: 'Internal Error'
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      deprecated: false
    post:
      tags:
        - SCIM
      summary: 'Create SCIM user'
      description: |
        Create SCIM user, if create user who was deleted, will mark user as normal, otherwise response 409.
        
        Notes:
        - The userName "email@[your_domain]" should be a real email address.

      operationId: 'createSCIMUser'
      parameters:
        - $ref: '#/components/parameters/requestAttributesParam'
        - $ref: '#/components/parameters/excludedAttributesParam'
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: '#/components/schemas/UserRequest'
            examples:
              User:
                $ref: '#/components/examples/userApiRequest'
      responses:
        '201':
          description: 'OK'
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '4XX':
          description: 'Request error'
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '5XX':
          description: 'Internal Error'
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      deprecated: false
  /scim/v2/Users/{id}:
    get:
      tags:
        - SCIM
      summary: 'Fetch SCIM user by id'
      description: 'Fetch SCIM user by id'
      operationId: 'findSCIMUserById'
      parameters:
        - $ref: '#/components/parameters/scimUserIdParam'
        - $ref: '#/components/parameters/requestAttributesParam'
        - $ref: '#/components/parameters/excludedAttributesParam'
      responses:
        '200':
          description: 'OK'
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '4XX':
          description: 'Request error'
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '5XX':
          description: 'Internal Error'
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      deprecated: false
    patch:
      tags:
        - SCIM
      summary: 'Update SCIM user by id'
      description: |
        Update SCIM user by id.
        
        For the operations of update licenses,
        - replace, set active=true/false to activate/deactivate the license.
        - add, not supported
        - remove, not supported

      operationId: 'patchSCIMUserById'
      parameters:
        - $ref: '#/components/parameters/scimUserIdParam'
        - $ref: '#/components/parameters/requestAttributesParam'
        - $ref: '#/components/parameters/excludedAttributesParam'
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: '#/components/schemas/PatchRequest'
            examples:
              Add:
                $ref: '#/components/examples/addUserPatchApiRequest'
              Replace:
                $ref: '#/components/examples/replaceUserPatchApiRequest'
              Remove:
                $ref: '#/components/examples/removeUserPatchApiRequest'
              ActivateUser:
                $ref: '#/components/examples/activateUserPatchApiRequest'
              DeactivateUser:
                $ref: '#/components/examples/deactivateUserPatchApiRequest'
              ActivateUserLicense:
                $ref: '#/components/examples/activateUserLicensesPatchApiRequest'
              DeactivateUserLicense:
                $ref: '#/components/examples/deactivateUserLicensesPatchApiRequest'
      responses:
        '200':
          description: 'OK'
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '4XX':
          description: 'Request error'
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '5XX':
          description: 'Internal Error'
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      deprecated: false
    put:
      tags:
        - SCIM
      summary: 'Update SCIM user by id'
      description: |
        Update SCIM user by id.
        
        For update licenses,
        - If the licenses is not provided, the licenses will not be changed.
        - If the licenses is provided, the licenses should include the full set of the tenant licenses.
          If one license is not active, include it with active=false

        Notes:
        - The userName "email@[your_domain]" should be a real email address.

      operationId: 'putSCIMUserById'
      parameters:
        - $ref: '#/components/parameters/scimUserIdParam'
        - $ref: '#/components/parameters/requestAttributesParam'
        - $ref: '#/components/parameters/excludedAttributesParam'
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: '#/components/schemas/UserRequest'
            examples:
              User:
                $ref: '#/components/examples/userApiRequest'
              UpdateUserWithLicense:
                $ref: '#/components/examples/updateUserWithLicenseApiRequest'
      responses:
        '200':
          description: 'OK'
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '4XX':
          description: 'Request error'
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '5XX':
          description: 'Internal Error'
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      deprecated: false
    delete:
      tags:
        - SCIM
      summary: 'Delete SCIM user by id'
      description: 'Mark user as deleted, if get/update deleted user, will response 404'
      operationId: 'deleteSCIMUserById'
      parameters:
        - $ref: '#/components/parameters/scimUserIdParam'
      responses:
        '204':
          description: 'OK'
        '4XX':
          description: 'Request error'
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '5XX':
          description: 'Internal Error'
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      deprecated: false
  /scim/v2/Groups:
    get:
      tags:
        - SCIM
      summary: 'Search SCIM group'
      description: 'Search SCIM group'
      operationId: 'searchSCIMGroup'
      parameters:
        - $ref: '#/components/parameters/filterParam'
        - $ref: '#/components/parameters/sortByParam'
        - $ref: '#/components/parameters/sortOrderParam'
        - $ref: '#/components/parameters/startIndexParam'
        - $ref: '#/components/parameters/countParam'
        - $ref: '#/components/parameters/requestAttributesParam'
        - $ref: '#/components/parameters/excludedAttributesParam'
      responses:
        '200':
          description: 'OK'
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/GroupListResponse'
        '4XX':
          description: 'Request error'
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '5XX':
          description: 'Internal Error'
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      deprecated: false
    post:
      tags:
        - SCIM
      summary: 'Create SCIM group'
      description: 'Create SCIM group'
      operationId: 'createSCIMGroup'
      parameters:
        - $ref: '#/components/parameters/requestAttributesParam'
        - $ref: '#/components/parameters/excludedAttributesParam'
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: '#/components/schemas/GroupRequest'
            examples:
              Group:
                $ref: '#/components/examples/groupApiRequest'
      responses:
        '201':
          description: 'OK'
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/GroupResponse'
        '4XX':
          description: 'Request error'
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '5XX':
          description: 'Internal Error'
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      deprecated: false
  /scim/v2/Groups/{id}:
    get:
      tags:
        - SCIM
      summary: 'Fetch SCIM group by id'
      description: 'Fetch SCIM group by id'
      operationId: 'findSCIMGroupById'
      parameters:
        - $ref: '#/components/parameters/groupIdParam'
        - $ref: '#/components/parameters/requestAttributesParam'
        - $ref: '#/components/parameters/excludedAttributesParam'
      responses:
        '200':
          description: 'OK'
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/GroupResponse'
        '4XX':
          description: 'Request error'
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '5XX':
          description: 'Internal Error'
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      deprecated: false
    patch:
      tags:
        - SCIM
      summary: 'Update SCIM group by id'
      description: 'Update SCIM group by id'
      operationId: 'patchSCIMGroupById'
      parameters:
        - $ref: '#/components/parameters/groupIdParam'
        - $ref: '#/components/parameters/requestAttributesParam'
        - $ref: '#/components/parameters/excludedAttributesParam'
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: '#/components/schemas/PatchRequest'
            examples:
              Add:
                $ref: '#/components/examples/addGroupPatchApiRequest'
              Replace:
                $ref: '#/components/examples/replaceGroupPatchApiRequest'
              Remove:
                $ref: '#/components/examples/removeGroupPatchApiRequest'
      responses:
        '200':
          description: 'OK'
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/GroupResponse'
        '4XX':
          description: 'Request error'
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '5XX':
          description: 'Internal Error'
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      deprecated: false
    put:
      tags:
        - SCIM
      summary: 'Update SCIM group by id'
      description: 'Update SCIM group by id'
      operationId: 'putSCIMGroupById'
      parameters:
        - $ref: '#/components/parameters/groupIdParam'
        - $ref: '#/components/parameters/requestAttributesParam'
        - $ref: '#/components/parameters/excludedAttributesParam'
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: '#/components/schemas/GroupRequest'
            examples:
              Group:
                $ref: '#/components/examples/groupApiRequest'
      responses:
        '200':
          description: 'OK'
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/GroupResponse'
        '4XX':
          description: 'Request error'
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '5XX':
          description: 'Internal Error'
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      deprecated: false
    delete:
      tags:
        - SCIM
      summary: 'Delete SCIM group by id'
      description: 'Delete SCIM group by id'
      operationId: 'deleteSCIMGroupById'
      parameters:
        - $ref: '#/components/parameters/groupIdParam'
      responses:
        '204':
          description: 'OK'
        '4XX':
          description: 'Request error'
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '5XX':
          description: 'Internal Error'
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      deprecated: false
  /scim/v2/Bulk:
    post:
      tags:
        - SCIM
      summary: 'SCIM Bulk Operation'
      description: |
        SCIM Bulk Operation.

        Notes:
        - For create user, the userName "email@[your_domain]" should be a real email address.

      operationId: 'SCIMBulkOperation'
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: '#/components/schemas/BulkRequest'
            examples:
              Bulk:
                $ref: '#/components/examples/bulkApiRequest'
      responses:
        '200':
          description: 'OK'
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/BulkResponse'
        '4XX':
          description: 'Request error'
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '5XX':
          description: 'Internal Error'
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      deprecated: false
components:
  securitySchemes:
    api_key:
      type: apiKey
      in: header
      name: 'x-api-key'
  parameters:
    scimUserIdParam:
      name: 'id'
      in: path
      description: 'Unique SCIM user identifier'
      required: true
      allowEmptyValue: false
      schema:
        type: string
        description: ''
        format: ''
        pattern: '^user-.+$'
        maxLength: 1000
        deprecated: false
    groupIdParam:
      name: 'id'
      in: path
      description: 'Unique SCIM group identifier'
      required: true
      allowEmptyValue: false
      schema:
        type: string
        description: ''
        format: ''
        pattern: '^(group|role)-.+$'
        maxLength: 1000
        deprecated: false
    resourceTypeIdParam:
      name: 'resourceTypeId'
      in: path
      description: 'Unique SCIM resource type id'
      required: true
      allowEmptyValue: false
      schema:
        type: string
        description: ''
        format: ''
        maxLength: 1000
        deprecated: false
    schemaIdParam:
      name: 'id'
      in: path
      description: 'Unique SCIM schema identifier'
      required: true
      allowEmptyValue: false
      schema:
        type: string
        description: ''
        format: ''
        maxLength: 1000
        deprecated: false
    requestAttributesParam:
      name: 'attributes'
      in: query
      description: 'which attributes are included in response, '','' to split'
      required: false
      schema:
        type: string
        description: ''
        format: ''
        maxLength: 1000
        deprecated: false
    excludedAttributesParam:
      name: 'excludedAttributes'
      in: query
      description: 'which attributes are excluded in response, '','' to split'
      required: false
      schema:
        type: string
        description: ''
        format: ''
        maxLength: 1000
        deprecated: false
    filterParam:
      name: 'filter'
      in: query
      description: 'filter expression'
      required: false
      schema:
        type: string
        description: ''
        format: ''
        maxLength: 999
        deprecated: false
    sortByParam:
      name: 'sortBy'
      in: query
      description: 'sort by attribute name'
      required: false
      schema:
        type: string
        description: ''
        format: ''
        maxLength: 1000
        deprecated: false
    sortOrderParam:
      name: 'sortOrder'
      in: query
      description: 'sort order, ascending|descending'
      required: false
      schema:
        type: string
        description: ''
        format: ''
        maxLength: 1000
        deprecated: false
    startIndexParam:
      name: 'startIndex'
      in: query
      description: 'start item index'
      required: false
      schema:
        type: string
        description: ''
        format: ''
        maxLength: 1000
        deprecated: false
    countParam:
      name: 'count'
      in: query
      description: 'item count in result'
      required: false
      schema:
        type: string
        description: ''
        format: ''
        maxLength: 1000
        deprecated: false
  schemas:
    UserRequest:
      title: 'UserRequest'
      type: object
      required: [schemas, userName, name, 'urn:ietf:params:scim:schemas:extension:signalsnotebook:2.0:UserProperties']
      additionalProperties: true
      properties:
        schemas:
          type: array
          items:
            type: string
        userName:
          type: string
        name:
          type: object
          required: [familyName, givenName]
          properties:
            familyName:
              type: string
            givenName:
              type: string
        'urn:ietf:params:scim:schemas:extension:signalsnotebook:2.0:UserProperties':
          type: object
          required: [country, organization]
          properties:
            alias:
              type: string
            country:
              type: string
