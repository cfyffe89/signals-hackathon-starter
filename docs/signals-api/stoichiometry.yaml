components:
  securitySchemes:
    api_key:
      type: apiKey
      in: header
      name: 'x-api-key'
  parameters:
    idParam:
      name: 'eid'
      in: path
      description: |
        Unique entity identifier. Format: EID.
        Accepted entity types: experiment, chemicalDrawing.

        Example value: "experiment:fc87f321-6b74-4046-bde0-0e1cf18bd8ce".
      required: true
      allowEmptyValue: false
      schema:
        type: string
        description: ''
        format: ''
        maxLength: 1000
        deprecated: false
    chemicalDrawingIdParam:
      name: 'eid'
      in: path
      description: |
        Unique chemicalDrawing identifier. Format: EID.
        Accepted entity types: chemicalDrawing.

        Example value: "chemicalDrawing:fc87f321-6b74-4046-bde0-0e1cf18bd8ce".
      required: true
      allowEmptyValue: false
      schema:
        type: string
        description: ''
        format: ''
        maxLength: 1000
        deprecated: false
    aromaticRepresentationParam:
      name: 'aromaticRepresentation'
      in: query
      description: |
        Aromatic representation. Valid values are:
          - aromatic, Aromatic Circles.
          - alternating, Alternating Double/Single Bonds.
      schema:
        type: string
        enum: ['aromatic', 'alternating']
        description: ''
        format: ''
        maxLength: 1000
        deprecated: false
    mol3000LabelsParam:
      name: 'labels'
      in: query
      description: |
        Labels representation.

        This setting is applicable only to files in the V3000 MDL format.
        For all other formats, this value will be disregarded.

        Valid values are:
          - expanded, expand all labels.

      schema:
        type: string
        enum: ['expanded']
        description: ''
        format: ''
        maxLength: 1000
        deprecated: false
    offsetParam:
      name: page[offset]
      in: query
      description: Number of items to skip before returning the results.
      required: false
      schema:
        type: integer
        format: int64
        minimum: 0
        default: 0
    limitParam:
      name: page[limit]
      in: query
      description: Maximum number of items to return.
      required: false
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 100
        default: 20
    includeParam:
      name: 'include'
      in: query
      description: |
        The related resources to be shown in "included" field.

        Example value: "children, owner".
      required: false
