openapi: 3.0.1
info:
  title: 'Signals Notebook APIs Document'
  version: v1.0
servers:
  - url: '/api/rest/v1.0'
    description: 'Signals Notebook'
security:
  - api_key: []
paths:
  /stoichiometry/{eid}:
    get:
      tags:
        - Stoichiometry
      summary: 'Fetch stoichiometry data of experiment or chemicalDrawing'
      description: |
        Fetch stoichiometry data of experiment or chemicalDrawing.

        Accepted entity types: experiment, chemicalDrawing.

        There are 4 kinds of data grids in stoichiometry: reactants, products, solvents and conditions.
        This API will return all grids in default. 
        - Set filter 'fields[stoichiometry]' to return specified data grids.

        When the 'includeStrippedData' parameter is set to false (the default), the response omits stripped data.
        Set 'includeStrippedData' to true to include stripped data in the response.
        The 'includeStrippedData' parameter only returns additional data for structures that are part of the drawing (i.e., those with an Rxn ID).

        Stripped data represents the result of removing salts from the original structure and includes:
        - strippedStructure – the structure after salt removal, including the normalized structure, molecular weight, name, and formula.
        - strippedSalts – details of each removed salt, including salt name, formula, molecular weight, and coefficient.
        - stripError – an error returned when the structure cannot be stripped. It contains an error code and a detailed error message.

        When stripError is present, strippedStructure and strippedSalts are omitted. Both strippedStructure and strippedSalts are empty if the original structure contains no salts.
        Example usages:
          - Fetch all data grids.

            /stoichiometry/{eid}
          - Fetch reactants and products.

            /stoichiometry/{eid}?fields[stoichiometry]=reactants,products
        - Fetch all data grids with stripped data.

            /stoichiometry/{eid}?includeStrippedData=true

      operationId: 'fetchStoichiometryGridsById'
      parameters:
        - $ref: '#/components/parameters/idParam'
        - name: 'fields[stoichiometry]'
          in: query
          description: 'A comma separated String of any "reactants, products, solvents, conditions". Example value: "reactants, products"'
          required: false
          explode: true
          schema:
            type: array
            items:
              type: string
              description: ""
              default: ""
              maxLength: 2000
        - $ref: '#/components/parameters/valueFormatParam'
        - name: 'includeStrippedData'
          in: query
          description: |
            Include stripped data which is removed salts from the original structure.
            Default is false. Set it to true to include stripped data in response.
          required: false
          schema:
            type: boolean
            default: false

      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/StoichiometryGridResponse'
              examples:
                allDataGrids:
                  $ref: '#/components/examples/fetchingStoichiometryGridsResponse'
                allDataGridsIncludingStrippedData:
                  $ref: '#/components/examples/fetchingStoichiometryGridsIncludeStrippedSaltsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
  /stoichiometry/{eid}/{rowid}:
    get:
      tags:
        - Stoichiometry
      summary: 'Fetch one specified row of stoichiometry data grid by id'
      description: |
        Fetch one specified row of stoichiometry data grid of chemicalDrawing.

        Accepted entity types: chemicalDrawing.

        When the 'includeStrippedData' parameter is set to false (the default), the response omits stripped data.
        Set 'includeStrippedData' to true to include stripped data in the response.
        The 'includeStrippedData' parameter only returns additional data for structures that are part of the drawing
        (i.e., rows with an Rxn ID).

        Stripped data includes:
        - strippedStructure - the structure after salt removal, including formula, name, mw (if available), and em
          (if available).
        - strippedSalts - details of each removed salt in the same format as the fragments API.
        - stripError – an error returned when the structure cannot be stripped. It contains an error code and a detailed error message.

        When stripError is present, strippedStructure and strippedSalts are omitted. Both strippedStructure and strippedSalts are empty if the original structure contains no salts.

        Example usages:
        
          - /stoichiometry/{eid}/100
        
          - /stoichiometry/{eid}/100?includeStrippedData=true

      operationId: 'fetchStoichiometryGridRowById'
      parameters:
        - $ref: '#/components/parameters/chemicalDrawingIdParam'
        - name: 'rowid'
          in: path
          required: true
          description: row_id of grid data.
          schema:
            type: "string"
        - $ref: '#/components/parameters/valueFormatParam'
        - name: 'includeStrippedData'
          in: query
          description: |
            Include stripped data which is removed salts from the original structure.
            Default is false. Set it to true to include stripped data in response.
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/StoichiometryGridResponse'
              examples:
                FetchingRowById:
                  $ref: '#/components/examples/fetchingRowResponse'
                FetchingRowByIdWithStrippedData:
                  $ref: '#/components/examples/fetchingRowWithStrippedDataResponse'
                FetchingRowByIdWithStripError:
                  $ref: '#/components/examples/fetchingRowWithStripErrorResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
    patch:
      tags:
        - Stoichiometry
      summary: 'Update row value of stoichiometry grid'
      description: |
        Update value of stoichiometry grid row.

        Examples for properties with type, "text", "html" or "unit":
        - "name": "benzene"
        - "formula": "C\<sub\>6\</sub\>H\<sub\>6\</sub\>"
        - "mw": "78.11 g/mol"
        - "em": "78.04"
        - "sm": "78.11 g"
        - "moles": "1.00 mol"
        - "density": "0.87 g/ml"
        - "amountRatio": "2 w/w"

        To get IDs of ontologyList type fields, please refer to /attributes/{attributeEid}/ontology/options.

        Examples for properties with other types:
        - number, {"value": 3.0 }
        - date,  {"value":"2019-09-06T15:22:47.309Z"}
        - list,  {"value": "list1"}
        - multiSelect, {"value": "select1, select2"}
        - attributeList(multiple option), {"values": ["select1", "select2"]}
        - ontologyList(single select), {"value": {"id": 1234}}
        - ontologyList(multiple select), {"values": [{"id": 1234}, {"id": 5678}]}
        - boolean, {"value": true}
        - link, {"value": "experiment:a2f9bba9-a4c7-9999-a676-251de965c234"}
        - link(multiple option), {"values": [{"eid": "experiment:a2f9bba9-a4c7-9999-a676-251de965c234"}]}
        - externalLink, {"user": "Google", "value": "http://www.google.com"}
        - fragments, {"salts":[{"type":"SALT","name":"Bromide","mf":"Br-","mw":{"rawValue":"79.9045","displayValue":"79.9045g/mol"},"id":"SALT:8","coefficient":1}],"solvates":[]}
        - supplierList (name and country), {"value": { "name": "AABlock", "country": "USA"}}
        - supplierList (supplier id), {"value": { "supplierId": "4326062e-a916-4104-ae59-6423debc89fe"}}

        To clear the value of a field, set it to null.
        Example: {"name": null}

        The value of the attribute "formula" is in html format.
        The following are the accepted html elements, "b", "em", "i", "strong", "sub" and "sup".
        Others which are not on this list will be deleted automatically.

        The attribute "fragment" is used to update salts and solvates.
        This attribute should be updated as a whole value.
        To manage salts and solvates, see "/fragments"  for details.

        Accepted entity types: chemicalDrawing.

        Example usages:
          - Update the value of one reactant.

            /stoichiometry/{eid}/100
      operationId: 'patchStoicGridRowById'
      parameters:
        - $ref: '#/components/parameters/chemicalDrawingIdParam'
        - name: 'rowid'
          in: path
          required: true
          description: row_id of grid data.
          schema:
            type: "string"
        - name: 'syncUpdateToSample'
          in: query
          required: false
          description: Also update the related chemical samples in current experiment with the new content.
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/digestParam'
        - $ref: '#/components/parameters/forceParam'
        - $ref: '#/components/parameters/valueFormatParam'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/UpdateRowRequest'
            examples:
              UpdateRowValue:
                $ref: '#/components/examples/updateRowRequest'
              AddSalt:
                $ref: '#/components/examples/addSaltToRowRequest'
              AddSolvate:
                $ref: '#/components/examples/addSolvateToRowRequest'
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/StoichiometryGridResponse'
              examples:
                UpdateRow:
                  $ref: '#/components/examples/fetchingRowResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
    delete:
      tags:
        - Stoichiometry
      summary: 'Delete a custom row from stoichiometry grid'
      description: |
        Delete a custom row(no RXNID) from stoichiometry grid.

        Custom row does not have RXNID. It is not part of the reaction in the chemical drawing. It is removable.

        Non-custom row has RXNID. The structure of this row is part of the reaction in the chemical drawing. It is not deletable.

        If delete a reactant which linked to a material with a container. Any consumed amount will be removed from Inventory.
        To return the amount to Inventory, please update Inventory Decrement to 0 before deletion.

      operationId: 'deleteStoicGridRowById'
      parameters:
        - $ref: '#/components/parameters/chemicalDrawingIdParam'
        - name: 'rowid'
          in: path
          required: true
          description: row_id of grid data.
          schema:
            type: "string"
        - $ref: '#/components/parameters/digestParam'
        - $ref: '#/components/parameters/forceParam'
      responses:
        '204':
          description: 'No content'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
  /stoichiometry/{eid}/{rowid}/structure:
    get:
      tags:
        - Stoichiometry
      summary: 'Fetch structure of reactants/products'
      description: |
        Fetch structure of reactants/products.

        Accepted entity types: chemicalDrawing.

        Example usages:
          /stoichiometry/{eid}/100/structure

        Here are the acceptable values of 'format':
        1. cdxml, will export drawing as JSON encoded CDXML file.
        2. cdxml-raw, will export drawing as CDXML file.
        3. svg, will export drawing as SVG file.
        4. mol, will export drawing as V2000 MOL file.
        5. mol-v3000, will export drawing as V3000 MOL file.
        6. smiles, will export drawing as SMILES file.
        7. inchi, will export drawing as InChi file.
        8. helm, will export drawing as HELM file.
        9. (blank), will export drawing as escaped CDXML file.

        Except parameter 'format', 'Accept' in header is also supported.
        Here are the acceptable values of 'Accept':
        1. image/svg+xml, will export drawing as SVG file.
        2. chemical/x-cdxml, will export drawing as escaped CDXML file.
        3. chemical/x-mdl-molfile, will export drawing as V2000 molfile.
        4. chemical/mdl-molfile, will export drawing as V2000 molfile.
        5. chemical/x-mdl-molfile-v3000, will export drawing as V3000 molfile.
        6. chemical/mdl-molfile-v3000, will export drawing as V3000 molfile.
        7. chemical/x-daylight-smiles, will export drawing as SMILES file.
        8. chemical/x-inchi, will export drawing as InChi file.
        9. chemical/x-helm, will export drawing as HELM file.
        10. \*/\*, get format from parameter 'format' then export.
        11. application/octet-stream, get format from parameter 'format' then export.
        12. (blank), get format from parameter 'format' then export.
      operationId: 'downloadStructureOfCompound'
      parameters:
        - $ref: '#/components/parameters/chemicalDrawingIdParam'
        - name: 'rowid'
          in: path
          required: true
          description: row_id of grid data.
          schema:
            type: "string"
        - name: 'format'
          in: query
          description: 'Export resource format'
          schema:
            type: string
            enum: [cdxml, cdxml-raw, inchi, mol, mol-v3000, smiles, helm, svg]
            description: ''
            format: ''
            maxLength: 99
            deprecated: false
        - $ref: '#/components/parameters/aromaticRepresentationParam'
        - $ref: '#/components/parameters/mol3000LabelsParam'
      responses:
        '200':
          description: 'OK'
          content:
            application/octet-stream:
              schema:
                description: 'Return content as binary stream'
                type: string
                format: binary
              example: '(no example available)'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
    head:
      tags:
        - Stoichiometry
      summary: 'Head request of fetching structure of reactants/products'
      description: |
        Head request of fetching structure of reactants/products.
        Will return response head only(no body).

        Accepted entity types: chemicalDrawing.

        Example usages:
          /stoichiometry/{eid}/100/structure

        Here are the acceptable values of 'format':
        1. cdxml, will export drawing as JSON encoded CDXML file.
        2. cdxml-raw, will export drawing as CDXML file.
        3. svg, will export drawing as SVG file.
        4. mol, will export drawing as V2000 MOL file.
        5. mol-v3000, will export drawing as V3000 MOL file.
        6. smiles, will export drawing as SMILES file.
        7. inchi, will export drawing as InChi file.
        8. helm, will export drawing as HELM file.
        9. (blank), will export drawing as escaped CDXML file.

        Except parameter 'format', 'Accept' in header is also supported.
        Here are the acceptable values of 'Accept':
        1. image/svg+xml, will export drawing as SVG file.
        2. chemical/x-cdxml, will export drawing as escaped CDXML file.
        3. chemical/x-mdl-molfile, will export drawing as V2000 molfile.
        4. chemical/mdl-molfile, will export drawing as V2000 molfile.
        5. chemical/x-mdl-molfile-v3000, will export drawing as V3000 molfile.
        6. chemical/mdl-molfile-v3000, will export drawing as V3000 molfile.
        7. chemical/x-daylight-smiles, will export drawing as SMILES file.
        8. chemical/x-inchi, will export drawing as InChi file.
        9. chemical/x-helm, will export drawing as HELM file.
        10. \*/\*, get format from parameter 'format' then export.
        11. application/octet-stream, get format from parameter 'format' then export.
        12. (blank), get format from parameter 'format' then export.
      operationId: 'headRequestOfFetchStructure'
      parameters:
        - $ref: '#/components/parameters/chemicalDrawingIdParam'
        - name: 'rowid'
          in: path
          required: true
          description: row_id of grid data.
          schema:
            type: "string"
        - name: 'format'
          in: query
          description: 'Export resource format'
          schema:
            type: string
            enum: [cdxml, cdxml-raw, inchi, mol, mol-v3000, smiles, helm, svg]
            description: ''
            format: ''
            maxLength: 99
            deprecated: false
        - $ref: '#/components/parameters/aromaticRepresentationParam'

      responses:
        '200':
          description: 'OK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
  /stoichiometry/{eid}/reactants:
    get:
      tags:
        - Stoichiometry
      summary: 'Fetch all reactants'
      description: |
        Fetch all reactants of experiment or chemicalDrawing.

        Accepted entity types: experiment, chemicalDrawing.

        Example usages:

            /stoichiometry/{eid}/reactants
      operationId: 'fetchAllReactants'
      parameters:
        - $ref: '#/components/parameters/idParam'
        - $ref: '#/components/parameters/valueFormatParam'
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/StoichiometryGridResponse'
              examples:
                Reactants:
                  $ref: '#/components/examples/fetchingReactantsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
    post:
      tags:
        - Stoichiometry
      summary: 'Add a new custom reactant'
      description: |
        Add a custom reactant to the reactants table without displaying its chemical structure.

        This reactant will appear only in the grid and will not be shown in the chemical drawing.

        Accepted entity types: chemicalDrawing.

        Examples of properties with types "text", "html", or "unit":
        - "name": "benzene"
        - "formula": "C\<sub\>6\</sub\>H\<sub\>6\</sub\>"
        - "mw": "78.11 g/mol"
        - "em": "78.04"
        - "sm": "78.11 g"
        - "moles": "1.00 mol"
        - "density": "0.87 g/ml"
        - "amountRatio": "2 w/w"

        To get IDs of ontologyList type fields, please refer to /attributes/{attributeEid}/ontology/options.

        Examples of properties with other types:
        - number, {"value": 3.0 }
        - date,  {"value":"2019-09-06T15:22:47.309Z"}
        - list,  {"value": "list1"}
        - multiSelect, {"value": "select1, select2"}
        - attributeList(multiple option), {"values": ["select1", "select2"]}
        - ontologyList(single select), {"value": {"id": 1234}}
        - ontologyList(multiple select), {"values": [{"id": 1234}, {"id": 5678}]}
        - boolean, {"value": true}
        - link, {"value": "experiment:a2f9bba9-a4c7-9999-a676-251de965c234"}
        - link(multiple option), {"values": [{"eid": "experiment:a2f9bba9-a4c7-9999-a676-251de965c234"}]}
        - externalLink, {"user": "Google", "value": "http://www.google.com"}
        - fragments, {"salts":[{"type":"SALT","name":"Bromide","mf":"Br-","mw":{"rawValue":"79.9045","displayValue":"79.9045g/mol"},"id":"SALT:8","coefficient":1}],"solvates":[]}
        - supplierList (name and country), {"value": { "name": "AABlock", "country": "USA"}}
        - supplierList (supplier id), {"value": { "supplierId": "4326062e-a916-4104-ae59-6423debc89fe"}}
        
        The value of the "formula" attribute must be in HTML format.
        Only the following HTML elements are allowed: "b", "em", "i", "strong", "sub", and "sup".
        Any other HTML elements not included in this list will be automatically removed.

        The "fragment" attribute is used to provide salts and solvates.
        For detailed guidance on managing salts and solvates, refer to the documentation at "/fragments".

      operationId: 'postNewCustomReactant'
      parameters:
        - $ref: '#/components/parameters/chemicalDrawingIdParam'
        - $ref: '#/components/parameters/digestParam'
        - $ref: '#/components/parameters/forceParam'
        - $ref: '#/components/parameters/valueFormatParam'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/UpdateRowRequest'
            examples:
              AddCustomReactant:
                $ref: '#/components/examples/addNewCustomReactantRequest'
      responses:
        '201':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/StoichiometryGridRowResponse'
              examples:
                CustomReactant:
                  $ref: '#/components/examples/addCustomReactantResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
  /stoichiometry/{eid}/products:
    get:
      tags:
        - Stoichiometry
      summary: 'Fetch all products'
      description: |
        Fetch all products of experiment or chemicalDrawing.

        Accepted entity types: experiment, chemicalDrawing.

        Example usages:

            /stoichiometry/{eid}/products
      operationId: 'fetchAllProducts'
      parameters:
        - $ref: '#/components/parameters/idParam'
        - $ref: '#/components/parameters/valueFormatParam'
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/StoichiometryGridResponse'
              examples:
                Products:
                  $ref: '#/components/examples/fetchingProductsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
