        schema:
          type: boolean
          deprecated: false
    valueFormatParam:
      name: 'value'
      in: query
      description: |
        Format of field values. 
        1. Display.

          Will return the displayValue as field value.
          Example value: mf : "198.3189 g/mol"
        2. Normalized.

          Will return composite field value .
          Example value: mf : {value: 198.3189, units:"g/mol", display: "198.3189 g/mol"}
      required: false
      allowEmptyValue: true
      schema:
        type: string
        enum: ['display', 'normalized']
        default: 'display'
