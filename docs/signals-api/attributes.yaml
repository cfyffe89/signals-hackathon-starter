openapi: 3.0.1
info:
  title: 'Signals Notebook APIs Document'
  version: v1.0
servers:
  - url: '/api/rest/v1.0'
    description: 'Signals Notebook'
security:
  - api_key: []
paths:
  /attributes:
    get:
      tags:
        - Attributes
      summary: 'Fetch all Attributes'
      description: |
        Fetch all Attributes.
        
        Accepted entity types: attribute.
        
        Example usages:

          /attributes

      operationId: 'fetchAllAttributes'

      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AttributeListResponse'
              examples:
                attributes:
                  $ref: '#/components/examples/fetchingAllAttributesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
    post:
      tags:
        - Attributes
      summary: 'Create a new Attribute'
      description: |
        Create a new list Attribute(type is 'choice').

        - Create a new list attribute.

          Options can be used to init the list options.

        Accepted entity types: attribute.

        Example usages:

          /attributes

      operationId: 'postNewAttribute'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/PostAttributeRequest'
            examples:
              CreateListAttribute:
                $ref: '#/components/examples/postAttributeRequest'
              CreateHierarchicalAttribute:
                $ref: '#/components/examples/postHierarchicalAttributeRequest'
      responses:
        '201':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AttributeResponse'
              examples:
                attribute:
                  $ref: '#/components/examples/fetchingAttributeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '501':
          $ref: '#/components/responses/NotImplemented'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
  /attributes/{eid}:
    get:
      tags:
        - Attributes
      summary: 'Fetch content of Attribute'
      description: |
        Fetch content of Attribute.
        
        Accepted entity types: attribute.
        
        Example usages:

          /attributes/attribute:1234

      operationId: 'fetchAttrContentById'
      parameters:
        - $ref: '#/components/parameters/attributeIdParam'
        - $ref: '#/components/parameters/attributeStatisticParam'
        - $ref: '#/components/parameters/includeParam'
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AttributeResponse'
              examples:
                attribute:
                  $ref: '#/components/examples/fetchingAttributeResponse'
                externalListAttribute:
                  $ref: '#/components/examples/fetchingExternalListAttributeResponse'
                hierarchicalAttribute:
                  $ref: '#/components/examples/fetchingHierarchicalAttributeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
    patch:
      tags:
        - Attributes
      summary: 'Update content of Attribute'
      description: |
        Update content of Attribute.
        This API can be used for replacing the whole options of list Attribute in a quick way.

        - Use "hierarchicalOptions" for hierarchical attributes.
        - Use "options" for other attributes.

        Accepted entity types: attribute.

        Example usages:

          /attributes/attribute:1234

      operationId: 'patchAttrContentById'
      parameters:
        - $ref: '#/components/parameters/attributeIdParam'
        - $ref: '#/components/parameters/attributeStatisticParam'
        - $ref: '#/components/parameters/includeParam'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/PatchAttributeRequest'
            examples:
              UpdateAttributeOptions:
                $ref: '#/components/examples/patchAttributeRequest'
              UpdateHierarchicalAttributeOptions:
                $ref: '#/components/examples/patchHierarchicalAttributeRequest'
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AttributeResponse'
              examples:
                attribute:
                  $ref: '#/components/examples/fetchingAttributeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
    delete:
      tags:
        - Attributes
      summary: 'Delete an Attribute'
      description: |
        Delete an Attribute.
        
        Accepted entity types: attribute.
        
        Example usages:

          /attributes/attribute:1234

      operationId: 'deleteAttributeById'
      parameters:
        - $ref: '#/components/parameters/attributeIdParam'
      responses:
        '204':
          description: 'OK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
  /attributes/{eid}/options:
    get:
      tags:
        - Attributes
      summary: 'Fetch options of Attribute'
      description: |
        Fetch options of Attribute.
        
        Accepted entity types: attribute.
        
        Example usages:

          /attributes/attribute:1234/options

      operationId: 'fetchAttrOptionsById'
      parameters:
        - $ref: '#/components/parameters/attributeIdParam'
        - $ref: '#/components/parameters/offsetParam'
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/termParam'
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AttributeOptionListResponse'
              examples:
                attribute:
                  $ref: '#/components/examples/fetchingAttributeOptionsResponse'
                hierarchicalAttribute:
                  $ref: '#/components/examples/fetchingHierarchicalAttributeOptionsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
    patch:
      tags:
        - Attributes
      summary: 'Update options of Attribute'
      description: |
        Update options of Attribute.

        Accepted entity types: attribute.

        Specify expected 'action' values in request body while adding/updating/deleting options.

        There are 3 actions are accepted,
        - create, Add a new option.
        - update, Update existing option.
        - delete, Delete existing option.

        Example usages:

          /attributes/attribute:1234/options

      operationId: 'patchAttrOptionsById'
      parameters:
        - $ref: '#/components/parameters/attributeIdParam'
        - $ref: '#/components/parameters/offsetParam'
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/termParam'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/UpdateAttributeOptionsRequest'
            examples:
              UpdateAttributeOptions:
                $ref: '#/components/examples/updateAttributeOptionsRequest'
              UpdateExternalListAttributeOptions:
                $ref: '#/components/examples/updateExternalListAttributeOptionsRequest'
              UpdateHierarchicalAttributeOptions:
                $ref: '#/components/examples/updateHierarchicalAttributeOptionsRequest'
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AttributeOptionListResponse'
              examples:
                attributeOptions:
                  $ref: '#/components/examples/fetchingAttributeOptionsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
  /attributes/{eid}/refresh:
    post:
      tags:
        - Attributes
      summary: 'Refresh content of an external list Attribute'
      description: |
        Refresh content of an external list Attribute. 

        This is an synchronize API.
        If the request is accepted, server will start a job to refresh the content of the specified external list attribute.
        To get the status of refreshing, please use "GET /attributes/eid"(see externalListAttribute example for detail). 

        Accepted entity types: attribute.
        
        Example usages:

          /attributes/attribute:1234/refresh

        Note: For an external list attribute, there should be an "externalSource" field in the response if fetching it by "GET /attributes/eid".

      operationId: 'refreshOptions'
      parameters:
        - $ref: '#/components/parameters/attributeIdParam'
      responses:
        '202':
          description: 'Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false

  /attributes/ontology/options/{optionId}/details:
    get:
      tags:
        - Attributes
      summary: 'Fetch ontology option details by option ID'
      description: |
        Fetch detailed information about a specific ontology term that has been selected for an ontology list attribute.

        This endpoint returns comprehensive information about an ontology term including:
        - Preferred name and IRI (International Resource Identifier)
        - Definitions and synonyms
        - Hierarchical relationships (ancestors and subclasses)
        - Associated attribute information

        Example usages:

          /attributes/ontology/options/12345/details

      operationId: 'fetchOntologyOptionDetailsById'
      parameters:
        - $ref: '#/components/parameters/ontologyOptionIdParam'
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/OntologyOptionDetailsResponse'
              examples:
                ontologyOptionDetails:
                  $ref: '#/components/examples/fetchingOntologyOptionDetailsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false

  /attributes/{eid}/ontology/options:
    get:
      tags:
        - Attributes
      summary: 'Fetch ontology options for an attribute'
      description: |
        Fetch ontology options (terms) for a given ontology list attribute.
        Search matches against preferredName, IRI, and synonyms.

        Example usages:

          # Fetch root-level ontology options
          GET /attributes/attribute:123/ontology/options

          # Search for terms
          GET /attributes/attribute:123/ontology/options?search=cancer

          # With pagination
          GET /attributes/attribute:123/ontology/options?search=cancer&page[offset]=0&page[limit]=10

      operationId: 'fetchOntologyOptions'
      parameters:
        - $ref: '#/components/parameters/attributeIdParam'
        - name: search
          in: query
          description: 'Search keyword to match against preferredName, IRI, and synonyms.'
          required: false
          schema:
            type: string
        - $ref: '#/components/parameters/offsetParam'
        - name: page[limit]
          in: query
          description: Maximum number of items to return.
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 10000
            default: 100
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/OntologyOptionsResponse'
              examples:
                ontologyOptions:
                  $ref: '#/components/examples/fetchingOntologyOptionsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false

  /autotext/lists/{autotextListId}:
    get:
      tags:
        - Attributes
      summary: 'Fetch content of autotext list'
      description: |
        Fetch content of autotext list.
        
        Example usages:

          /autotext/lists/8166e780-0eb4-4510-9e57-9c798a7b82d3

      operationId: 'fetchAutotextListContentById'
      parameters:
        - $ref: '#/components/parameters/autotextListIdParam'
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AutotextListResponse'
              examples:
                autotextList:
                  $ref: '#/components/examples/fetchingAutotextListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false

components:
  securitySchemes:
    api_key:
      type: apiKey
      in: header
      name: 'x-api-key'
  parameters:
    attributeIdParam:
      name: 'eid'
      in: path
      description: |
        Unique Attribute identifier. Format: EID.
        Accepted entity types: attribute.

        Example value: "attribute:1234".
      required: true
      allowEmptyValue: false
      schema:
        type: string
        description: ''
        format: ''
        maxLength: 1000
        deprecated: false
    attributeStatisticParam:
      name: 'statistics'
      in: query
      description: |
        If true, the API will return the 'counts' object in the response and the default will be false.
        
        The 'counts' object contains statistics on the usage of the specified attribute throughout Signals.
      schema:
        type: boolean
        deprecated: false
    autotextListIdParam:
      name: 'autotextListId'
      in: path
      description: |
        Unique autotext list identifier.

        Example value: "8166e780-0eb4-4510-9e57-9c798a7b82d3".
      required: true
      allowEmptyValue: false
      schema:
        type: string
        description: ''
        format: ''
        maxLength: 1000
        deprecated: false
    includeParam:
      name: 'include'
      in: query
      description: |
        The related resources to be shown in "included" field.

        Example value: "entity".
      required: false
      allowEmptyValue: true
      schema:
        type: string
        description: ''
        format: ''
        maxLength: 200
        deprecated: false
    offsetParam:
      name: page[offset]
      in: query
      description: Number of items to skip before returning the results.
      required: false
      schema:
        type: integer
        format: int64
        minimum: 0
        default: 0
    limitParam:
      name: page[limit]
      in: query
      description: Maximum number of items to return.
      required: false
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 10000
        default: 20
    termParam:
      name: term
      in: query
      description: Parameter used to search for options whose value contains this term.
      required: false
      schema:
        type: string
        format: ''
        maxLength: 200
    ontologyOptionIdParam:
      name: 'optionId'
      in: path
      description: |
        Unique ontology option identifier.

        Example value: "12345".
      required: true
      allowEmptyValue: false
      schema:
        type: integer
        format: int64
        description: 'ID of the ontology option'
        deprecated: false

  schemas:
    ErrorResponse:
      type: object
      required: [errors]
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              status:
                type: string
              code:
                type: string
              title:
                type: string
              detail:
                type: string

    JsonApiResponse:
      title: 'JsonApiResponse'
      type: object
      properties:
        data:
          oneOf:
            - $ref: '#/components/schemas/JsonApiData'
            - type: array
              items:
                $ref: '#/components/schemas/JsonApiData'
        included:
          type: array
          items:
            $ref: '#/components/schemas/JsonApiData'
        links:
          $ref: '#/components/schemas/JsonApiLinks'
    JsonApiRelationship:
      title: 'JsonApiRelationship'
      type: object
      properties:
        data:
          oneOf:
            - $ref: '#/components/schemas/JsonApiDataIdentifier'
            - type: array
              items:
                $ref: '#/components/schemas/JsonApiDataIdentifier'
        links:
          $ref: '#/components/schemas/JsonApiLinks'
    JsonApiData:
      title: 'JsonApiData'
      type: object
      properties:
        type:
          type: string
        id:
          type: string
        meta:
          $ref: '#/components/schemas/JsonApiMeta'
        attributes:
          type: object
        relationships:
          type: object
        links:
          $ref: '#/components/schemas/JsonApiLinks'
    JsonApiDataIdentifier:
      title: 'JsonApiDataIdentifier'
      type: object
      properties:
        meta:
          $ref: '#/components/schemas/JsonApiMeta'
        type:
          type: string
        id:
          type: string
    JsonApiLinks:
      title: 'JsonApiLinks'
      type: object
      properties:
        self:
          type: string
    JsonApiMeta:
      title: 'JsonApiMeta'
      type: object
      additionalProperties: true
    JsonApiIncluded:
      title: 'JsonApiIncluded'
      type: array
      items:
        $ref: '#/components/schemas/JsonApiData'
    JsonApiPagingLinks:
      title: 'JsonApiPagingLinks'
      type: object
      properties:
        self:
          type: string
        prev:
          type: string
        first:
          type: string
        next:
          type: string


    ExtEntity:
      type: object
      title: 'ExtEntity'
      properties:
        links:
          $ref: '#/components/schemas/JsonApiLinks'
        type:
          type: string
        id:
          type: string
        attributes:
          type: object
          title: 'ExtEntityAttributes'
          properties:
            id:
              type: string
            eid:
              type: string
            name:
              type: string
            synonyms:
              type: array
              items:
                type: string
            description:
              type: string
            type:
              type: string
            createdAt:
              type: string
            editedAt:
              type: string
            digest:
              type: string
            fields:
              title: 'fields'
              type: object
              additionalProperties:
                type: object
            state:
              type: string
            flags:
              type: object
            signedAt:
              type: string
            acceptedAt:
              type: string
            rejectedAt:
              type: string
            fragments:
              type: array
              items:
                type: object
                additionalProperties: true
            data:
              type: object
              additionalProperties: true
          additionalProperties: true
        relationships:
          type: object
          title: 'ExtEntityRelationships'
          properties:
            createdBy:
              $ref: '#/components/schemas/JsonApiRelationship'
            editedBy:
              $ref: '#/components/schemas/JsonApiRelationship'
            owner:
              $ref: '#/components/schemas/JsonApiRelationship'
            ancestors:
              $ref: '#/components/schemas/JsonApiRelationship'
            children:
              $ref: '#/components/schemas/JsonApiRelationship'
            systemTemplate:
              $ref: '#/components/schemas/JsonApiRelationship'
            template:
              $ref: '#/components/schemas/JsonApiRelationship'
            pdf:
              $ref: '#/components/schemas/JsonApiRelationship'
            signedBy:
              $ref: '#/components/schemas/JsonApiRelationship'
            acceptedBy:
              $ref: '#/components/schemas/JsonApiRelationship'
            rejectedBy:
              $ref: '#/components/schemas/JsonApiRelationship'
            source:
              $ref: '#/components/schemas/JsonApiRelationship'
            drawing:
              $ref: '#/components/schemas/JsonApiRelationship'
          additionalProperties: true

    ExtAttribute:
      type: object
      title: 'ExtAttribute'
      properties:
        links:
