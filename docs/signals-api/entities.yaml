  /entities/export/pdf:
    put:
      tags:
        - Entities
      summary: 'Export entity to a PDF file asynchronously'
      description: |
        Export entity to a PDF file asynchronously.

        This API will not return PDF directly but only a FileId for later use.

        This API should be used together with following 2 APIs.

        - HEAD /entities/export/pdf/{fileId}

        This API is used to check the status of PDF file. It will return Content-Length in response Header.
        "0" means the PDF file is still in processing and it is not ready for download.
        Other values mean the PDF file has been generated and it is ready for download.

        - GET /entities/export/pdf/{fileId}

        This API is used to download PDF file while it is ready for download.

        One normal case to export PDF asynchronously is as below.
        1. Send request "PUT /entities/export/pdf?eid=***" to server to start an export thread.
        2. Send request "HEAD /entities/export/pdf/{fileId}" to server to query the status of PDF file.
        3. Check content-length in Step2's response header. If "0" then repeat Step2 after 2 seconds. Else go to next step.
        4. Send request "GET /entities/export/pdf/{fileId}" to server to download PDF file.

        By the way, the PDF file will not be stored in server side permanently.
        It will be removed in about 30 minutes. So, download it soon while it is ready for download.

        Supported entity types: experiment, request, sample, and task.

      operationId: 'exportEntityToPdfAsync'
      parameters:
        - $ref: '#/components/parameters/idQueryParam'
        - name: 'header'
          in: query
          description: 'Output per page headers'
          schema:
            type: boolean
        - name: 'footer'
          in: query
          description: 'Output per page footers'
          schema:
            type: boolean
        - name: 'attachments'
          in: query
          description: 'Embed documents as attachments'
          schema:
            type: boolean
        - name: 'links'
          in: query
          description: 'Include related experiments. (this field is not support for Synergy Experiment yet)'
          schema:
            type: boolean
        - name: 'comments'
          in: query
          description: 'Include comments'
          schema:
            type: boolean
        - name: 'history'
          in: query
          description: 'Include history'
          schema:
            type: boolean
        - name: 'paper'
          in: query
          description: 'Media Options: Paper format'
          schema:
            type: string
            enum: ['A3', 'A4', 'A5', 'B2', 'B3', 'B4', 'B5', 'Executive', 'Folio', 'Ledger', 'Letter', 'Tabloid']
            default: 'Letter'
        - name: 'orientation'
          in: query
          description: 'Media Options: Page orientation'
          schema:
            type: string
            enum: ['Portrait', 'Landscape']
            default: 'Portrait'
        - $ref: '#/components/parameters/localeParam'
        - $ref: '#/components/parameters/timeZoneParam'
        - $ref: '#/components/parameters/dateTimeFormatParam'
        - $ref: '#/components/parameters/skipPageBreaksParam'
      requestBody:
        description:
          Optional.  Specifies which child entities to include in the PDF. If not specified, all children are included. 
          `children` is an array of entity EIDs to be printed.
        required: false
        content:
          application/vnd.api+json:
            schema:
              title: "ExportRequest"
              type: object
              required: ["data"]
              properties:
                data:
                  type: object
                  required: ["type", "attributes"]
                  properties:
                    type:
                      type: string
                      enum: ["exportRequests"]
                    attributes:
                      type: object
                      required: ["children"]
                      properties:
                        children:
                          type: array
                          items:
                            type: string
                          description: "eid of the every entity/element you want to print"
              example:
                data:
                  type: "exportRequests"
                  attributes:
                    children: [
                      "text:0aeaead7-3a00-4c54-be54-b93b71d28f60",
                      "text:c153b90a-e7aa-4424-b201-1ea2620db8d3",
                      "text:950799b1-4f9a-4d09-8a59-79b77db20f88"
                    ]
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/EntityApiResponse'
              examples:
                ExperimentToPdf:
                  $ref: '#/components/examples/exportPdfAsyncApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
