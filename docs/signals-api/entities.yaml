  /entities/{eid}/export:
    get:
      tags:
        - Entities
      summary: 'Fetch entity content'
      description: |
        Fetch content of an entity.

        Accepted entity types: chemicalDrawing, excel, grid, imageResource, materialsTable,
        pdf, presentation, sample, samplesContainer, text, uploadedResource, viewonly, plateContainer,
        signals spotfire, design, etc.

        Unaccepted entity types: experiment, journal.

        The 'format' parameter is utilized for exporting entities that support multiple export formats. 
        See below for details.
        For other types, please leave this parameter blank to ensure accuracy.

        Here are the acceptable values of 'format' for chemical structures:
        1. cdxml, will export chemical structure as CDXML file.
        2. svg, will export chemical structure as SVG file.
        3. mol, will export chemical structure as V2000 MOL file.
        4. mol-v3000, will export chemical structure as V3000 MOL file.
        5. smiles, will export chemical structure as SMILES file.
        6. inchi, will export drawing as InChi file.
        7. rxn, will export drawing as RXN file.
        8. rxn-v3000, will export drawing as V3000 RXN file.
        9. (blank), will export the drawing as its original format.
        
        Here are the acceptable values of 'format' for biological sequence:
        1. gb, will export biological sequence as GenBank file.
        2. fa, will export biological sequence as FASTA file.
        3. (blank), will export biological sequence from original format.

        Here are the acceptable values of 'format' for samplesContainer/paragrid/materialsTable:
        1. csv, will export to CSV file.
        2. sdf, will export to SDF file.
        3. (blank), will export to CSV file.

        And, here are the acceptable values of 'format' for text:
        1. html, exports the content as an HTML file.
        2. txt, exports the content as a plain text file, removing all HTML tags.
        3. (blank), exports the content as an HTML file.

        Except parameter 'format', 'Accept' in header is also supported.
        Here are the acceptable values of 'Accept':
        1. image/svg+xml, will export chemical structure as SVG file.
        2. chemical/x-cdxml, will export chemical structure as CDXML file.
        3. chemical/x-mdl-molfile, will export chemical structure as V2000 molfile.
        4. chemical/mdl-molfile, will export chemical structure as V2000 molfile.
        5. chemical/x-mdl-molfile-v3000, will export chemical structure as V3000 molfile.
        6. chemical/mdl-molfile-v3000, will export chemical structure as V3000 molfile.
        7. chemical/x-daylight-smiles, will export chemical structure as SMILES file.
        8. chemical/x-inchi, will export drawing as InChi file.
        9. chemical/x-mdl-rxnfile, will export drawing as RXN file.
        10. chemical/x-mdl-rxnfile-v3000, will export drawing as RXN file.
        11. biosequence/fasta, will export biological sequence as FASTA file.
        12. biosequence/genbank, will export biological sequence as GenBank file.
        13. text/html, exports the content as an HTML file.
        14. text/plain, exports the content as a plain text file, removing all HTML tags.
        15. \*/\*, get format from parameter 'format' then export.
        16. application/octet-stream, get format from parameter 'format' then export.
        17. (blank), get format from parameter 'format' then export.

        For export samplesContainer, paragrid or materialsTable, please provide the 'Accept' value as below,
        1. text/csv, will export to CSV file.
        2. chemical/x-mdl-sdfile, will export to SDF file.
        3. (blank), will export to CSV file(DO NOT set 'format').

        For ELN table/list, plateContainer, it can be exported as CSV file if set format to "csv",
        else it will be exported as JSON file.

        For paraLayout, it can be exported as CSV file if set format to "csv".

      operationId: 'downloadEntityContent'
      parameters:
        - $ref: '#/components/parameters/gridIdParam'
        - name: 'format'
          in: query
          description: 'Export resource format (see description for available options for each entity type)'
          schema:
            type: string
            enum: [cdxml, inchi, mol, mol-v3000, rxn, rxn-v3000, smiles, svg, csv, sdf, gb, fa, html, txt]
            description: ''
            format: ''
            maxLength: 99
            deprecated: false
        - $ref: '#/components/parameters/aromaticRepresentationParam'
        - $ref: '#/components/parameters/mol3000LabelsParam'
      responses:
        '200':
          description: 'OK'
          content:
            application/octet-stream:
              schema:
                description: 'Return entity content as binary stream'
                type: string
                format: binary
              example: '(no example available)'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
    head:
      tags:
        - Entities
      summary: 'Head request of fetching entity content'
      description: |
        Head request of fetching entity content.
        Will return response head only(no body).

        Accepted entity types: chemicalDrawing, excel, grid, imageResource, materialsTable,
        pdf, presentation, sample, samplesContainer, text, uploadedResource, viewonly, plateContainer, design etc.

        Unaccepted entity types: experiment, journal.

