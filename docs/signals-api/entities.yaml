openapi: 3.0.1
info:
  title: 'Signals Notebook APIs Document'
  version: v1.0
servers:
  - url: '/api/rest/v1.0'
    description: 'Signals Notebook'
security:
  - api_key: []
paths:
  /entities:
    get:
      tags:
        - Entities
      summary: 'Fetch all entities'
      description: |
        Fetch entities in JSON:API format.

        Accepted entity types: chemicalDrawing, excel, experiment, grid, imageResource, journal,
        materialsTable, pdf, presentation, sample, samplesContainer, text,
        uploadedResource, viewonly, signals spotfire, etc.
      operationId: 'fetchAllEntities'
      parameters:
        - $ref: '#/components/parameters/offsetParam'
        - $ref: '#/components/parameters/limitParam'
        - name: 'includeTypes'
          in: query
          description: |
            Included entity types, separated by comma ','. For example, 'experiment, journal, ado'. The default include types
            are experiment, request and journal.
          schema:
            type: string
            description: ''
            format: ''
            maxLength: 199
            deprecated: false
            default: journal,experiment,request
        - name: 'excludeTypes'
          in: query
          description: Excluded entity types, separated by comma ','. For example, 'experiment, journal'.
          schema:
            type: string
            description: ''
            format: ''
            maxLength: 199
            deprecated: false
        - name: 'includeOptions'
          in: query
          description: |
            Flags of entities, separated by comma ','.

            The tag should be one of,
            - mine
            - other
            - shared
            - trashed
            - untrashed
            - trashedAncestor
            - starred
            - unstarred
            - template
            - nontemplate
            - systemTemplate
            - nonSystemTemplate

            Note:

            For the "trashed", "trashedAncestor" and "untrashed" options, if none of them are specified, 
            the system will default to returning items that have not been trashed.
            
            "untrashed" cannot be specified with "trashed" or "trashedAncestor" together.
            
            If you want to fetch all of "trashed", "trashedAncestor",
            specify them explicitly, such as "nontemplate,trashed,trashedAncestor".

          schema:
            type: string
            description: ''
            format: ''
            default: untrashed
            maxLength: 199
            deprecated: false
        - name: 'start'
          in: query
          description: |
            Return the entities which are modified after start time.
            The modification time is the latest time where the entity itself, or any children entities are edited, or sharing settings inherited from a parent notebook are updated.
            Example value, '2019-09-06T15:22:47.000Z'.
            Accurate to the second, milliseconds will be ignored.
          schema:
            type: string
            description: ''
            format: ''
            maxLength: 99
            deprecated: false
        - name: 'end'
          in: query
          description: |
            Return the entities which are modified before end time.
            The modification time is the latest time where the entity itself, or any children entities are edited, or sharing settings inherited from a parent notebook are updated.
            Example value, '2019-09-06T15:22:47.000Z'.
            Accurate to the second, milliseconds will be ignored.
          schema:
            type: string
            description: ''
            format: ''
            maxLength: 99
            deprecated: false
        - $ref: '#/components/parameters/includeParam'
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/EntityListApiResponse'
              examples:
                Experiments:
                  $ref: '#/components/examples/experimentListApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
    post:
      tags:
        - Entities
      summary: 'Create a new entity'
      description: |
        Create a new entity.

        The digest parameter is the digest of parent.

        Accepted entity types: grid, sample, journal, experiment, parallel experiment, subexperiment, subexperiment layout, request,
        worksheet, task, variations grid, hierarchical grid, signals spotfire, design table, reference table, synergy experiment, idea, and custom admin defined object.

        There are 3 main sections in the request body, ancestors, template, and attributes.
        They are different for different entity types.

        #### Ancestors
        Ancestors of the entity to be created. Only needs to set parent entity in the ancestors section.
        Belows are possible parents for different entity types.
        - Grid, Worksheet, Variations Grid, Hierarchical Grid: experiment, parallel experiment, subexperiment, sample, request, task, custom admin defined object.
        - Sample: samples container.
        - Notebook, Idea: (no parent).
        - Experiment, Parallel Experiment, Request, Custom Admin Defined Object: (no parent), notebook.
        - Subexperiment, Subexperiment Layout: parallel experiment.
        - Task: task container.
        - Design Table: idea.
        - Synergy Experiment: collaboration.
        - Reference Table: workOrder.

        For Task, grandparents are also accepted as ancestors. The new task will be added to the grandparent's task container.
        Belows are possible grandparents for task.
        - Task: experiment, parallel experiment, request, custom admin defined object.

        For Sample, grandparents are also accepted as ancestors. The new sample will be added to the grandparent's sample container.
        Belows are possible grandparents for sample.
        - Sample: experiment, parallel experiment, subexperiment, request, task, custom admin defined object.

        #### Template
        The template used to create new entities. Templates can be found by invoking "/entities" with entity type.
        For example, calling "/entities?includeTypes=experiment&includeOptions=template" to fetch experiment templates.

        - Grid, Sample, Worksheet, Task, Variations Grid, Hierarchical Grid, Design Table: Required.
        - Notebook, Subexperiment, Subexperiment Layout, MaterialsTable: Not required.
        - Experiment, Parallel Experiment, Request, Synergy Experiment, Idea, Custom Admin Defined Object: Optional.

        #### Attributes
        Attributes are for defined values for any of the object properties as defined by the template used.
        - Grid, Worksheet: Except for the "name", no other attributes are accepted.
          This will overwrite the “name” attribute which is by default is from the entities template.
        - Notebook, Experiment, Parallel Experiment, Subexperiment, Request, Synergy Experiment, Idea, Custom Admin Defined Object:
          User can provide the attributes which defined in the template while creating.
          The definition of attributes can be found by invoking "/entities/templates/templateId/fields".
        - Sample: Attributes are different for different sample templates.
          - For Chemical Samples, Except for the "stoicRef", no other attributes are accepted. StoicRef points to one row of stoichiometry data.
          - For Non-chemical Samples, Except for the "fields", no other attributes are accepted. The definition of items of the "fields" can be be found by invoking "/samples/sampleTemplateId/properties".
        - Subexperiment Layout, Variations Grid, Design Table: no attributes is needed.
        - Task: Except for the "fields", no other attributes are accepted. Use "Reference ID" field to set references for Task.
        - MaterialsTable: Except for the "libraryName", no other attributes are accepted.
        - Reference Table: You can configure the Reference Table using libraryName and entityType.
          - entityType: this is required. Supported values: asset, batch, design.
          - libraryName: this is required.

        #### Others
        - To create a new custom admin defined object, the meta-info "adoTypeName" is required.
          "adoTypeName" is the name of the custom admin defined object.
        - The name of the entity maybe auto generated. It depends on the definition in the template.
          If it is auto generated it can not be specified in the request body.
        - The workOrder relationship is required for Synergy Experiment and for the Synergy Experiment only.
          To create a draft Synergy Experiment, the status of Work Order should be "Draft" too.

        #### Examples
        There are several example request bodies for creating entities with different types.
        Please refer to the following "Examples" section at below for detail.

        To get IDs of ontologyList type fields, please refer to /attributes/{attributeEid}/ontology/options.

        Example values for items of sample or task fields:
        - date  {"value":"2019-09-06T15:22:47.309Z"}
        - text  {"value":"text1"}
        - list  {"value": "list1"}
        - multiSelect {"value": "select1, select2"}
        - attributeList(multiple option) {"values": ["select1", "select2"]}
        - ontologyList(single select) {"value": {"id": 1234}}
        - ontologyList(multiple select) {"values": [{"id": 1234}, {"id": 5678}]}
        - boolean {"value": true}
        - unit {"value": "3 g"}
        - link {"value": "experiment:a2f9bba9-a4c7-9999-a676-251de965c234"}
        - link(multiple option) {"values": [
            {"eid": "experiment:a2f9bba9-a4c7-9999-a676-251de965c234"},
            {"eid": "experiment:9528e408-939e-4902-ad5e-f7a085f627ce"}
          ]}
        - externalLink {"user":"Google", "value": "http://www.google.com"}

        Example values for attributes:
        - text, "text1"
        - list, "list1"
        - list(multiple option), ["select1", "select2"]
        - link, "{\\"value\\":\\"experiment:b082d006-8e1f-4df6-acf1-a15530e6fe1c\\"}"
        - link(multiple option), [
            "{\\"eid\\":\\"experiment:b082d006-8e1f-4df6-acf1-a15530e6fe1c\\"}",
            "{\\"eid\\":\\"experiment:7981c5ec-9ee8-4d8c-bd5f-24e0f5504e62\\"}"
          ]
        - externalLink, "{\\"user\\":\\"http://www.google.com\\",\\"value\\":\\"http://www.google.com\\"}"

      operationId: 'postNewEntity'
      parameters:
        - $ref: '#/components/parameters/digestParam'
        - name: 'force'
          in: query
          description: >
            Force to create without checking the provided digest.
            If true, the system will get and use the latest digest from server, ignoring the provided digest.
          schema:
            type: boolean
            deprecated: false
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/CreateEntityRequest'
            examples:
              CreateNewGrid:
                $ref: '#/components/examples/createNewGridRequest'
              CreateChemicalSample:
                $ref: '#/components/examples/createChemicalSampleRequest'
              CreateNonChemicalSample:
                $ref: '#/components/examples/createNonChemicalSampleRequest'
              CreateNotebook:
                $ref: '#/components/examples/createJournalRequest'
              CreateExperiment:
                $ref: '#/components/examples/createExperimentRequest'
              CreateSubexperiment:
                $ref: '#/components/examples/createSubexperimentRequest'
              CreateSubexperimentLayout:
                $ref: '#/components/examples/createSubexperimentLayoutRequest'
              CreateWorksheet:
                $ref: '#/components/examples/createNewWorksheetRequest'
              CreateVariationsGrid:
                $ref: '#/components/examples/createNewVariationsGridRequest'
              CreateHierarchicalGrid:
                $ref: '#/components/examples/createNewHierarchicalGridRequest'
              CreateTask:
                $ref: '#/components/examples/createNewTaskRequest'
              CreateTaskWithReference:
                $ref: '#/components/examples/createNewTaskWithReferenceRequest'
              CreateMaterialsTableWithLibraryName:
                $ref: '#/components/examples/createNewMaterialsTableRequest'
              CreateCustomAdminDefinedObject:
                $ref: '#/components/examples/createAdoRequest'
              CreateSignalsSpotfire:
                $ref: '#/components/examples/createSignalsSpotfireRequest'
              CreateDesignTable:
                $ref: '#/components/examples/createNewDesignTableRequest'
              CreateDraftSynergyExperiment:
                $ref: '#/components/examples/createNewSynergyExperimentRequest'
              CreateIdea:
                $ref: '#/components/examples/createNewIdeaRequest'
              CreateReferenceTable:
                $ref: '#/components/examples/createNewReferenceTableRequest'
      responses:
        '201':
          description: 'Created'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/EntityApiResponse'
              examples:
                Grid:
                  $ref: '#/components/examples/gridApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
  /entities/{eid}:
    get:
      tags:
        - Entities
      summary: 'Fetch entity by entity ID'
      description: |
        Fetch summary information of entity in JSON:API format.

        Accepted entity types: chemicalDrawing, excel, experiment, grid, variationsGrid, hierarchicalGrid, imageResource, journal,
        materialsTable, pdf, presentation, sample, samplesContainer, text,
        uploadedResource, viewonly, signals spotfire, etc.

        Notes:
        - The "hasTemplateChanged" flag is used to indicate whether the entity does not use the latest definition from the system template.
        This flag applies only to grids, variationsGrids, hierarchicalGrids and worksheets.

      operationId: 'fetchEntityByID'
      parameters:
        - $ref: '#/components/parameters/entityIdParam'
        - name: 'include'
          in: query
          description: |
            The related resources to be shown in "included" field.
  
            Example value: "children, owner".
  
            Available values: "createdBy", "editedBy", "children", "owner", "systemTemplate", "template".
          required: false
          allowEmptyValue: true
          schema:
            type: string
            description: ''
            format: ''
            maxLength: 200
            deprecated: false
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/EntityApiResponse'
              examples:
                Experiment:
                  $ref: '#/components/examples/experimentApiResponse'
                SamplesContainer:
                  $ref: '#/components/examples/samplesContainerApiResponse'
                Sample:
                  $ref: '#/components/examples/sampleApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
    delete:
      tags:
        - Entities
      summary: 'Delete entity by entity ID'
      description: |
        Delete entity by ID.

        - Some kinds of entities can be restored later, such as journal, experiment, request and so on.
        - Some kinds of entities will be deleted permanently, such as grid, chemicalDrawing, sample and so on.

        Accepted entity types: chemicalDrawing, excel, experiment, grid, imageResource, journal,
        materialsTable, pdf, presentation, sample, samplesContainer, text,
        uploadedResource, viewonly, signals spotfire, etc.

      operationId: 'deleteEntityById'
      parameters:
        - $ref: '#/components/parameters/entityIdParam'
        - $ref: '#/components/parameters/digestParam'
        - name: 'force'
          in: query
          description: >
            Force to delete without doing digest check.
          schema:
            type: boolean
            deprecated: false
      responses:
        '204':
          description: 'No content'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
  /entities/webdav/info:
    get:
      tags:
        - Entities
      summary: 'Fetch entity information using webdav URL'
      description: |
        Fetch entity information using webdav URL in JSON:API format.
      operationId: 'fetchEntityInfoForWebdav'
      parameters:
        - name: 'url'
          in: query
          description: 'webdav url'
          schema:
            type: string
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/EntityApiResponse'
              examples:
                Experiment:
                  $ref: '#/components/examples/experimentApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
  /entities/{eid}/children:
    get:
      tags:
        - Entities
      summary: 'Fetch children of a specified entity'
      description: |
        Fetch children of a specified entity.

        Accepted entity types: experiment, journal, samplesContainer.

        Parameter 'order' ONLY applies to Experiment.

        Accepted values of order:
        - layout, Sort children according to the layout order in UI page.
        - ''(default), Not sorted.

      operationId: 'fetchAllEntityChildrenById'
      parameters:
        - $ref: '#/components/parameters/entityIdParam'
        - $ref: '#/components/parameters/offsetParam'
        - $ref: '#/components/parameters/limitParam'
        - name: 'order'
          in: query
          description: 'Sort children according to the layout order in UI page(For Experiment only)'
          schema:
            type: string
            enum: [layout]
            description: ''
            format: ''
            maxLength: 99
            deprecated: false
        - name: 'include'
          in: query
          description: |
            The related resources to be shown in "included" field.
  
            Example value: "ancestors, owner".
            
            Available values: "createdBy", "editedBy", "ancestors, "owner".
          required: false
          allowEmptyValue: true
          schema:
            type: string
            description: ''
            format: ''
            maxLength: 200
            deprecated: false
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/EntityListApiResponse'
              examples:
                Experiment:
                  $ref: '#/components/examples/experimentChildrenApiResponse'
                SamplesContainer:
                  $ref: '#/components/examples/samplesContainerChildrenApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
  /entities/{eid}/ancestors:
    get:
      tags:
        - Entities
      summary: 'Fetch ancestors of a specified entity'
      description: |
        Fetch ancestors of a specified entity.

        Accepted entity types: chemicalDrawing, excel, experiment, grid, imageResource, journal,
        materialsTable, pdf, presentation, sample, samplesContainer, text,
        uploadedResource, viewonly, etc.

      operationId: 'fetchAllEntityAncestorsById'
      parameters:
        - $ref: '#/components/parameters/entityIdParam'
        - $ref: '#/components/parameters/includeParam'
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/EntityListApiResponse'
              examples:
                Ancestors:
                  $ref: '#/components/examples/entityAncestorApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
  /entities/{eid}/relationships:
    get:
      tags:
        - Entities
      summary: 'Fetch related entities of a specified entity'
      description: |
        Fetch related entities of a specified entity.

        Relationships can be added manually from the UI or automatically generated from internal references.

        Accepted entity types: journal, experiment, parallel experiment, subexperiment, sample,
          request, task, custom admin defined object, etc.

        Unaccepted entity types: attribute, user, group.

      operationId: 'fetchAllEntityRelationshipsById'
      parameters:
        - $ref: '#/components/parameters/entityIdParam'
        - $ref: '#/components/parameters/offsetParam'
        - $ref: '#/components/parameters/limitParam'
        - name: 'include'
          in: query
          description: |
            The related resources to be shown in "included" field.
  
            Example value: "source, link".
            
            Available values: "source", "link".
          required: false
          allowEmptyValue: true
          schema:
            type: string
            description: ''
            format: ''
            maxLength: 200
            deprecated: false
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/EntityRelationshipsResponse'
              examples:
                Relationships:
                  $ref: '#/components/examples/entityRelationshipsApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
    post:
      tags:
        - Entities
      summary: 'Create a new relationship'
      description: |
        Create a new relationship.

        Accepted entity types: journal, experiment, parallel experiment, subexperiment, sample,
          request, task, custom admin defined object, etc.

        Relationship can be any of following values: 
        related, repeats, repeated_by, duplicates, duplicated_by, precedes, preceded_by

      operationId: 'postNewRelationship'
      parameters:
        - $ref: '#/components/parameters/entityIdParam'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/LinkRequest'
            examples:
              CreateRelatedLink:
                $ref: '#/components/examples/relatedLinkRequest'
      responses:
        '201':
          description: 'Created'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/EntityRelationshipApiResponse'
              examples:
                Relationships:
                  $ref: '#/components/examples/entityRelationshipApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
  /entities/{eid}/properties:
    get:
      tags:
        - Entities
      summary: 'Fetch entity properties'
      description: |
