  /entities/{eid}/attachment:
    put:
      tags:
        - Entities
      summary: 'Replace attachment with a new file'
      description: |
        Upload a new file to replace the attachment.

        Here are the accepted entity types and its accepted content types, the new file must be in the accepted content type list for each entity.
        1. imageResource
        - image/tiff,
        - image/png,
        - image/jpeg,
        - image/bmp,
        - image/gif

        2. uploadedResource
        - all allowed types

        3. excel
        - application/vnd.ms-excel,
        - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,
        - application/vnd.openxmlformats-officedocument.spreadsheetml.template,
        - application/vnd.ms-excel.sheet.macroEnabled.12,
        - application/vnd.ms-excel.template.macroEnabled.12

        4. presentation
        - application/vnd.ms-powerpoint,
        - application/vnd.openxmlformats-officedocument.presentationml.presentation,
        - application/vnd.openxmlformats-officedocument.presentationml.slideshow,
        - application/vnd.openxmlformats-officedocument.presentationml.template,
        - application/vnd.ms-powerpoint.presentation.macroEnabled.12,
        - application/vnd.ms-powerpoint.slideshow.macroEnabled.12,
        - application/vnd.ms-powerpoint.template.macroEnabled.12

        5. viewonly
        - application/msword,
        - application/vnd.openxmlformats-officedocument.wordprocessingml.document,
        - application/vnd.openxmlformats-officedocument.wordprocessingml.template,
        - application/vnd.ms-word.document.macroEnabled.12,
        - application/vnd.ms-word.template.macroEnabled.12

        6. pdf
        - application/pdf

        7. spotfiredxp
        - application/vnd.spotfire.dxp

        8. signals_spotfiredxp
        - application/vnd.spotfire.dxp

        9. text
        - text/plain
        - text/html

        Content length must be defined in the request header by setting "Content-Length".
        
        Content type must be defined in the request header by setting "Content-Type".
        Such as "Content-Type: image/png", "Content-Type: application/msword", "Content-Type: application/octet-stream", etc.

        Here are the content types for known extensions.
        - "docx" -> "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
        - "dotx" -> "application/vnd.openxmlformats-officedocument.wordprocessingml.template"
