        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
    patch:
      tags:
        - Samples
      summary: 'Bulk update samples in samples table/summary'
      description: |
        Bulk update the samples in the samples table or samples summary table with the specified sample IDs and columns.
        If no sample ID is provided, this will update all samples in that table.
        
        There are 5 actions are accepted in the request body.
        - update, update a sample. This is the default action if action is not provided in request body.
        - delete, delete a sample.
        - close, close a sample.
        - cancel, cancel a sample.
        - reopen, reopen a closed/cancelled sample.

        To get IDs of ontologyList type fields, please refer to /attributes/{attributeEid}/ontology/options.

        Here are some example values for different property types,
        - date  {"value":"2019-09-06T15:22:47.309Z"}
        - text  {"value":"text1"}
        - list  {"value": "list1"}
        - multiSelect {"value": "select1, select2"}
        - attributeList(multiple option) {"values": ["select1", "select2"]}
        - ontologyList(single select) {"value": "{\\"id\\":\\"1234\\"}"}
        - ontologyList(multiple select) {"values": [{"id": 1234}, {"id": 5678}]}
        - boolean {"value": true}
        - unit {"value": "3 g"}
        - link {"value": "experiment:a2f9bba9-a4c7-9999-a676-251de965c234"}
        - link(multiple option) {"values": [
            {"eid": "experiment:a2f9bba9-a4c7-9999-a676-251de965c234"},
            {"eid": "experiment:9528e408-939e-4902-ad5e-f7a085f627ce"}
          ]}
        - externalLink {"name":"Google", "value": "http://www.google.com"}

        To clear the value of a cell, set content to null.
        Example: {"content": null}

        Available units for different measurements.
        - Amount - μmol, mmol, mol
        - Density - g/L, mg/mL, g/mL, kg/L
        - Loading - mmol/g, mol/kg, mol/g, μmol/g, mmol/kg
        - Mass - ng, μg, mg, g, kg
        - Molarity - μmolar, mmolar, molar
        - Molecular Weight - g/mol, kg/mol, dalton
        - Pressure - atm, bar, mbar, Pa, kPa, mmHg, Torr, psi
        - Temperature - °C, °F, K
        - Duration - μs, ms, s, min, hour, day
        - Volume - nL, μL, mL, L, kL
        - Percentage - %

        NOTE:
        
        - The maximum row count is 50.
        - Closed/cancelled samples can not be updated/deleted. Reopen is the unique action for them.
        - If the action is not provided in the request body, the default action will be update.
        - The "columns" and "stoicRef" in the request body is only for update action. For other actions, they will be ignored.

      operationId: 'patchSamplesTableRows'
      parameters:
        - $ref: '#/components/parameters/samplesTableIdParam'
        - $ref: '#/components/parameters/sampleIdsParam'
        - $ref: '#/components/parameters/digestParam'
        - $ref: '#/components/parameters/forceParam'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/SamplesTableRequest'
            examples:
