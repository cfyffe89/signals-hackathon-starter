      deprecated: false
  /samplesTables/{samplesTableId}/bulkUpdate:
    post:
      tags:
        - Samples
      summary: 'Bulk update samples in samples table asynchronously'
      description: |
        Bulk update the samples in the samples table asynchronously.

        This is an asynchronous API.
                The request body is a CSV file with the first column as "ID" (which has sample Ids) 
                and other columns as the sample properties to be updated.

                The first row is the header row.
                Each subsequent row represents a sample to be updated.

                If the request is accepted, server will start a job to execute and return a report with a job ID to client.

                Client can check the status of the job with API "samplesTables/{samplesTableId}/bulkUpdate/{jobId}".

                When the job is finished, the job status should be "SUCCESS" or "FAILED".

      operationId: 'patchSamplesTables'
      parameters:
        - $ref: '#/components/parameters/samplesTableEidParam'
        - $ref: '#/components/parameters/digestParam'
        - $ref: '#/components/parameters/forceParam'
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
              format: binary
      responses:
        '202':
          description: 'Accepted'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/SamplesBulkUpdateJobResponse'
              examples:
                SamplesTable:
                  $ref: '#/components/examples/startAsyncBulkUpdateSamplesApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
