                $ref: '#/components/examples/updateSamplesWithoutIdsApiRequest'
              UpdateSamplesWithIds:
                $ref: '#/components/examples/updateSamplesWithIdsApiRequest'
              UpdateSampleChemicalData:
                $ref: '#/components/examples/updateSampleChemicalDataApiRequest'
              CloseAllSamples:
                $ref: '#/components/examples/closeAllSamplesApiRequest'
              BulkUpdateSampleStatus:
                $ref: '#/components/examples/bulkUpdateSampleStatusApiRequest'
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/SamplesTableResponse'
              examples:
                SamplesInContainer:
                  $ref: '#/components/examples/fetchSamplesFromContainerApiResponse'
        '400':
