              examples:
                FetchSamplesFromContainer:
                  $ref: '#/components/examples/fetchSamplesFromContainerApiResponse'
                FetchSamplesFromSummary:
                  $ref: '#/components/examples/fetchSamplesFromSamplesSummaryApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
