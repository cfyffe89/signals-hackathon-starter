','UCT','Universal','US/Alaska','US/Aleutian','US/Arizona','US/Central','US/Eastern','US/East-Indiana','US/Hawaii','US/Indiana-Starke','US/Michigan','US/Mountain','US/Pacific','US/Pacific-New','US/Samoa','UTC','WET','W-SU','Zulu']
    dateTimeFormatParam:
      name: 'dateTimeFormat'
      in: query
      description: |
        Date/time format for timestamps in the exported PDF.

        Examples:
        - `dateTimeFormat=default` + no `timeZone` provided → `Mar 23, 2026 7:00 AM GMT`
        - `dateTimeFormat=default` + `timeZone=America/New_York` → `Mar 23, 2026 3:00 AM EDT`
        - `dateTimeFormat=iso8601` + no `timeZone` provided  → `2026-03-23T03:00:00+00:00` (default to UTC)
        - `dateTimeFormat=iso8601` + `timeZone=America/New_York` → `2026-03-23T03:00:00-04:00`
      schema:
        type: string
        enum: [ 'iso8601', 'default' ]
        default: 'default'
    skipPageBreaksParam:
      name: 'skipPageBreaks'
      in: query
      description: Skip page breaks or not, default not.
      required: false
      schema:
        type: boolean
        deprecated: false
    sortParam:
      name: 'sort'
      in: query
      allowEmptyValue: true
      description: |
        Specify the sort order of the search results by providing a comma-separated list of fields.  Fields will be sorted ascending unless prefixed with "-".
        For example: `name,-modifiedAt` will sort results by name ascending, modifiedAt descending.
      schema:
        type: string
        description: ''
        format: ''
        maxLength: 200
        deprecated: false
    valueFormatParam:
      name: 'value'
      in: query
      description: |
        Format of field values.
        1. Display.

          Will return value without units.
          Example value: mf : {value: "198.3189 g/mol"}
        2. Normalized.

          Will return composite field value with units.
          Example value: mf : {value: 198.3189, units:"g/mol", display: "198.3189 g/mol"}
      required: false
      allowEmptyValue: true
      schema:
        type: string
        enum: [ 'display', 'normalized' ]
        default: 'display'
        deprecated: false
    aromaticRepresentationParam:
      name: 'aromaticRepresentation'
      in: query
      description: |
        Aromatic representation. Valid values are:
          - aromatic, Aromatic Circles.
          - alternating, Alternating Double/Single Bonds.

        The structure will keep the original representation if no value is specified.

        Supported entity types: sample, chemicalDrawing.

      schema:
        type: string
        enum: ['aromatic', 'alternating']
        description: ''
        format: ''
        maxLength: 1000
        deprecated: false
    mol3000LabelsParam:
      name: 'labels'
      in: query
      description: |
        Labels representation.

        This setting is applicable only to files in the V3000 MDL format.
        For all other formats, this value will be disregarded.

        Valid values are:
          - expanded, expand all labels.

      schema:
        type: string
        enum: ['expanded']
        description: ''
        format: ''
        maxLength: 1000
        deprecated: false
    pageIdParam:
      name: 'pageId'
      in: path
      description: |
        Page id.
      required: true
      allowEmptyValue: false
      schema:
        type: string
        description: ''
        format: ''
        maxLength: 1000
        deprecated: false

