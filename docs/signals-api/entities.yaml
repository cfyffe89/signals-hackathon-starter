  /entities/{eid}/children/{filename}:
    post:
      tags:
        - Entities
      summary: 'Post an attachment to entity as a child'
      description: |
        Upload a file to an entity as a child.

        Accepted entity types: Experiment, Journal, Sample, Request and Task.

        File type can be defined in the request header by setting "Content-Type".
        Such as "Content-Type: image/png", "Content-Type: application/msword", "Content-Type: application/octet-stream", etc.

        If the value of the content type is "application/octet-stream",
        the file type will be inferred from the suffix/extension of the filename.
        The following are the known and supported extensions to content type mappings.
        - "docx" -> "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
        - "dotx" -> "application/vnd.openxmlformats-officedocument.wordprocessingml.template"
