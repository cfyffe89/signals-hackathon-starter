      required: false
      schema:
        type: integer
        format: int64
        minimum: 0
        default: 0
    offsetForChemSearchParam:
      name: page[offset]
      in: query
      description: Number of items to skip before returning the results.
      required: false
      schema:
        type: integer
        format: int64
        minimum: 0
        maximum: 5000
        default: 0
    limitParam:
      name: page[limit]
      in: query
      description: Maximum number of items to return(max 100, default 20).
      required: false
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 100
        default: 20
    noMaxLimitParam:
      name: page[limit]
      in: query
      description: Maximum number of items to return.
      required: false
      schema:
        type: integer
        format: int64
        minimum: 1
        default: 5000
    stopAfterItemsParam:
      name: stopAfterItems
      in: query
      description: Stops the query after 'stop-after-items' number of rows have been examined.
      required: false
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 1000000
    sourceParam:
      name: source
      in: query
      description: >
        Specify the source of the entities.
        If it's "SN", the entities will search from SignalsNotebook.
        If it's "CONNECTED", the entities will search from ELN Archive.
        If it's "IVT", the entities will search from Inventory.
        If it's "CHEMICALS", will search all chemical drawings.
      required: false
      allowEmptyValue: false
      schema:
        type: string
        description: ""
        maxLength: 20
        deprecated: false
        default: SN
        enum: [SN, CONNECTED, IVT, CHEMICALS]
    fieldsParam:
      name: fields[entity]
      in: query
      description: >
        Return only specific fields in the response on a per-type basis by including a fields[TYPE] parameter.

        Example usage

        - Only return 2 fields, 'name' and 'description', ?fields[entity]=name,description

        - Return all default fields and additional 'flags' field, ?fields[entity]&fields[entity]=flags

      required: false
      explode: true
      schema:
        type: array
        items:
          type: string
          description: ""
          default: ""
          maxLength: 200
