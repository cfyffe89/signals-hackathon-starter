  /entities/export/bulk:
    post:
      tags:
        - Entities
      summary: 'Bulk export contents of an entity asynchronously'
      description: |
        Bulk export contents of an entity including its descendants asynchronously.

        This API will not return the contents directly but a jobId for later use.

        This API should be used together with following 2 APIs.

        - GET /entities/export/bulk/{jobId}.
        This API is used to check the status of bulk export job.

        - GET /entities/export/bulk/{jobId}/contents.
        This API is used to download the contents while it is ready for download.
        
        There are 3 available values for job status.
        - IN_PROGRESS, means the bulk export job is still in processing and the content is not ready for download.
        - COMPLETED,  means the bulk export job has been finished and the content is ready for download.
        - FAILED, means the bulk export job is failed.

        One normal case to bulk export contents asynchronously is as below.
        1. Send request "POST /entities/export/bulk?eid=***" to server to start a bulk export job.
        2. Send request "GET /entities/export/bulk/{jobId}" to server to query the status of bulk export job.
        3. Check the status in Step2's response.
           - If "IN_PROGRESS", repeat Step2 after 2 seconds.
           - If "FAILED", finished and check the error message for detail.
           - If "COMPLETED", go to next step.
        4. Send request "GET /entities/export/bulk/{jobId}/contents" to server to download the content.

        By the way, the exported contents will not be stored in server permanently.
        It will be removed after 2 hours if it is not downloaded. So, download it soon while it is ready for download.

        Notes:

        Due to performance issues, we started several workers for bulk export.
        429(too many requests) will be returned if the service handling the API request doesn't have free workers.
        Please try again later if you encounter 429 error.

        Supported entity types: experiment, request, sample, parallel experiment, subexperiment, and custom admin defined object.

      operationId: 'bulkExportEntityContentAsync'
      parameters:
        - $ref: '#/components/parameters/idQueryParam'
        - name: 'depth'
          in: query
          description: |
            Depth of descendents to be included.
            - 0, self only. This is the default value.
            - 1, include immediate descendants.
            - -1, include all descendants.
          schema:
            type: integer
            format: int64
            minimum: -1
            maximum: 100
            default: 0
        - name: 'types'
          in: query
          description: |
            The entity types whose content to be exported. The entities whose type are not in this list will be bypassed.
            This should be a comma seperated string, such as "chemicalDrawing, grid".
            All the entities with all types will be exported by default.
          schema:
            type: string
            description: ''
            format: ''
            maxLength: 99
            deprecated: false
        - name: 'structureFormat'
          in: query
          description: |
            The format of chemical structure to be exported.
            This parameter is for chemicalDrawing and sample only, the default value is "cdxml".
            For other types, this parameter will be ignored.
          schema:
            type: string
            enum: [cdxml, inchi, mol, mol-v3000, smiles, svg]
            description: ''
            format: ''
            maxLength: 99
            deprecated: false
        - name: 'stoichiometry'
          in: query
          description: |
            Whether to export stoichiometry data.
            All the rows of stoichiometry will be exported separately if this value is set to "true".
            The default value is "true".
            To export the stoichiometry data, the chemicalDrawing must be exported too.
          schema:
            type: boolean
            default: true
            deprecated: false
        - name: 'stoichiometryStructureFormat'
          in: query
          description: |
            The format of reactants and products in stoichiometry to be exported.            
            The default value is "cdxml".
          schema:
            type: string
            enum: [cdxml, inchi, mol, mol-v3000, smiles, helm, svg]
            description: ''
            format: ''
            maxLength: 99
            deprecated: false
        - $ref: '#/components/parameters/aromaticRepresentationParam'
      responses:
        '202':
          description: 'Accepted'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/BulkExportContentJobResponse'
              examples:
                BulkExportContents:
                  $ref: '#/components/examples/bulkExportContentsAsyncApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '415':
          description: 'Unsupported media type'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
  /entities/export/bulk/{jobId}:
    get:
      tags:
        - Entities
      summary: 'Get the status of bulk export'
      description: |
        This API is used to get the status of bulk export job.

        There are 3 available values for job status.
        - IN_PROGRESS, means the bulk export job is still in processing and the contents is not ready for download.
        - COMPLETED,  means the bulk export job has been finished and the contents is ready for download.
