          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false

  /entities/templates/{eid}/fields:
    get:
      tags:
        - Entities
      summary: 'Fetch template fields definition'
      description: |
        Fetch definition of the template fields.

        Template id can be found in the response of fetching entities API.
        For example, to fetch all experiment templates, "/entities?includeTypes=experiment&includeOptions=template".

        Accepted entity types: journal, experiment, parallel experiment, request and custom admin defined object and etc.
      operationId: 'fetchFieldsDefinitionByTemplateId'
      parameters:
        - $ref: '#/components/parameters/entityIdParam'
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/EntityTemplateFieldsResponse'
              examples:
                ExperimentTemplateFields:
                  $ref: '#/components/examples/entityFieldsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
  /entities/{eid}/syncWithTemplate:
    post:
      tags:
        - Entities
      summary: 'Synchronize the definition with template'
      description: |
        Synchronize the definition with template.

        This API can be used to update the column definition to the latest version if the related template changed.

        The "hasTemplateChanged" flag is used to indicate whether the entity does not use the latest definition from the system template. 
        It can be fetched by "GET /entities/eid".

        !IMPORTANT! The content of current entity will be erased after synchronizing the definition with template.

        Supported entity types: grid, variationsGrid, hierarchicalGrid and worksheet.

      operationId: 'syncColumnDefinitionWithTemplate'
      parameters:
        - $ref: '#/components/parameters/gridIdParam'
        - $ref: '#/components/parameters/digestParam'
        - name: 'force'
          in: query
          description: >
            Force to update without doing digest check.
          schema:
            type: boolean
            deprecated: false

      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/EntityApiResponse'
              examples:
                SyncTableColumnDefinitionWithTemplate:
                  $ref: '#/components/examples/syncTableColumnDefinitionWithTemplateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '415':
          description: 'Unsupported media type'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false

