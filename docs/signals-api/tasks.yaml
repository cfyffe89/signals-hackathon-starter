openapi: 3.0.1
info:
  title: 'Signals Notebook APIs Document'
  version: v1.0
servers:
  - url: '/api/rest/v1.0'
    description: 'Signals Notebook'
security:
  - api_key: []
paths:
  /tasks/{taskId}/properties:
    get:
      tags:
        - Tasks
      summary: 'Fetch task properties'
      description: 'Fetch task properties'
      operationId: 'fetchAllTaskPropertiesById'
      parameters:
        - $ref: '#/components/parameters/taskIdParam'
        - name: 'name'
          in: query
          description: 'Indicate name of property'
          schema:
            type: string
          deprecated: false
        - $ref: '#/components/parameters/valueFormatParam'
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/TaskPropertiesApiResponse'
              examples:
                taskProperties:
                  $ref: '#/components/examples/taskPropertiesApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
    patch:
      tags:
        - Tasks
      summary: 'Update task properties'
      description: |
        Update task properties. The digest is the digest of taskContainer.

        To get IDs of ontologyList type fields, please refer to /attributes/{attributeEid}/ontology/options.

        Here are some example values for different property types,
        - date  {"value":"2019-09-06T15:22:47.309Z"}
        - text  {"value":"text1"}
        - list  {"value": "list1"}
        - multiSelect {"value": "select1, select2"}
        - attributeList(multiple option) {"values": ["select1", "select2"]}
        - ontologyList(single select) {"value": "{\\"id\\":\\"1234\\"}"}
        - ontologyList(multiple select) {"values": [{"id": 1234}, {"id": 5678}]}
        - boolean {"value": true}
        - unit {"value": 3}
        - link {"value": "experiment:a2f9bba9-a4c7-9999-a676-251de965c234"}
        - link(multiple option) {"values": [{"eid": "experiment:a2f9bba9-a4c7-9999-a676-251de965c234"}]}
        - externalLink {"display":"Google", "value": "http://www.google.com"}

        To clear the value of a property, set content to null.

      operationId: 'patchTaskPropertiesById'
      parameters:
        - $ref: '#/components/parameters/taskIdParam'
        - name: 'name'
          in: query
          description: 'Indicate name of property'
          schema:
            type: string
          deprecated: false
        - $ref: '#/components/parameters/digestParam'
        - $ref: '#/components/parameters/forceParam'
        - $ref: '#/components/parameters/valueFormatParam'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/taskPropertiesRequest'
            examples:
              taskProperties:
                $ref: '#/components/examples/taskPropertiesApiRequest'
              taskPropertyWithName:
                $ref: '#/components/examples/taskPropertyApiRequest'
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/TaskPropertiesApiResponse'
              examples:
                taskProperties:
                  $ref: '#/components/examples/taskPropertiesApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
  /tasks/{taskId}/properties/{propertyId}:
    get:
      tags:
        - Tasks
      summary: 'Fetch task properties by ID'
      description: 'Fetch task properties by ID'
      operationId: 'fetchTaskPropertyById'
      parameters:
        - $ref: '#/components/parameters/taskIdParam'
        - name: 'propertyId'
          in: path
          description: 'Unique task property identifier'
          required: true
          allowEmptyValue: false
          schema:
            type: string
            description: ''
            format: ''
            maxLength: 99
            deprecated: false
        - $ref: '#/components/parameters/valueFormatParam'
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/TaskPropertyApiResponse'
              examples:
                taskProperty:
                  $ref: '#/components/examples/taskPropertyApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
    patch:
      tags:
        - Tasks
      summary: 'Update task properties by ID'
      description: |
        Update task properties by ID. The digest is the digest of taskContainer.

        To get IDs of ontologyList type fields, please refer to /attributes/{attributeEid}/ontology/options.

        Here are some example values for different property types,
        - date  {"value":"2019-09-06T15:22:47.309Z"}
        - text  {"value":"text1"}
        - list  {"value": "list1"}
        - multiSelect {"value": "select1, select2"}
        - attributeList(multiple option) {"values": ["select1", "select2"]}
        - ontologyList(single select) {"value": "{\\"id\\":\\"1234\\"}"}
        - ontologyList(multiple select) {"values": [{"id": 1234}, {"id": 5678}]}
        - boolean {"value": true}
        - unit {"value": 3}
        - link {"value": "experiment:a2f9bba9-a4c7-9999-a676-251de965c234"}
        - link(multiple option) {"values": [{"eid": "experiment:a2f9bba9-a4c7-9999-a676-251de965c234"}]}
        - externalLink {"display":"Google", "value": "http://www.google.com"}

        To clear the value of a property, set content to null.
        Example: {"content": null}

      operationId: 'patchTaskPropertyById'
      parameters:
        - $ref: '#/components/parameters/taskIdParam'
        - name: 'propertyId'
          in: path
          description: 'Unique task property identifier'
          required: true
          allowEmptyValue: false
          schema:
            type: string
            description: ''
            format: ''
            maxLength: 99
            deprecated: false
        - $ref: '#/components/parameters/digestParam'
        - $ref: '#/components/parameters/forceParam'
        - $ref: '#/components/parameters/valueFormatParam'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/taskPropertyRequest'
            examples:
              taskProperty:
                $ref: '#/components/examples/taskPropertyApiRequest'
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/TaskPropertyApiResponse'
              examples:
                taskProperty:
                  $ref: '#/components/examples/taskPropertyApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
  /tasks/todo/{todoListId}/rows:
    get:
      tags:
        - Tasks
      summary: 'Fetch tasks from tasks todo list'
      description: 'Fetch tasks from tasks todo list.'
      operationId: 'fetchTasksTodoListRows'
      parameters:
        - $ref: '#/components/parameters/tasksTodoIdParam'
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ExtTaskTableResponse'
              examples:
                taskTodoList:
                  $ref: '#/components/examples/taskTodoListApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
    patch:
      tags:
        - Tasks
      summary: 'Update tasks in tasks todo list'
      description: |
        Update tasks in tasks todo list.

        Specify the expected 'action' value in request body.
        There are 4 actions accepted,
        - assign, add a task to the todo list and assign to oneself.
        - unassign, remove a task from the todo list and unassign.
        - complete, complete a task.
        - reopen, reopen a completed task.

      operationId: 'patchTasksTodoListRows'
      parameters:
        - $ref: '#/components/parameters/tasksTodoIdParam'
        - $ref: '#/components/parameters/digestParam'
        - $ref: '#/components/parameters/forceParam'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/updateRowRequest'
            examples:
              assignTask:
                $ref: '#/components/examples/assignTaskApiRequest'
              completeTask:
                $ref: '#/components/examples/completeTaskApiRequest'
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ExtTaskTableResponse'
              examples:
                tasksTodoList:
                  $ref: '#/components/examples/taskTodoListApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
  /tasks/todo/{todoListId}/_column:
    get:
      tags:
        - Tasks
      summary: 'Fetch column definitions of tasks todo list'
      description: |
        Fetch column definitions of a tasks todo list.

        Accepted entity types: linkedTaskContainer.

        Example usages:

          GET /tasks/todo/linkedTaskContainer:abcd/_column

      operationId: 'fetchTodoListColumnDefinitions'
      parameters:
        - $ref: '#/components/parameters/tasksTodoIdParam'
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/TodoListColumnDefinitionResponse'
              examples:
                columnDefinitions:
                  $ref: '#/components/examples/fetchingTodoListColumnDefinitionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
    patch:
      tags:
        - Tasks
      summary: 'Update column definition of tasks todo list'
      description: |
        Update column definition of a tasks todo list.

        The `action` field must be one of:
        - `hide`, set the specified columns as hidden
        - `unhide`, set the specified columns as visible

        The `columns` field is a non-empty list of column keys to apply the action to.

        Accepted entity types: linkedTaskContainer.

        Example usages:

          PATCH /tasks/todo/linkedTaskContainer:abcd/_column

      operationId: 'patchTodoListColumnVisibility'
      parameters:
        - $ref: '#/components/parameters/tasksTodoIdParam'
        - $ref: '#/components/parameters/digestParam'
        - $ref: '#/components/parameters/forceParam'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/UpdateTodoListColumnVisibilityRequest'
            examples:
              hideColumns:
                $ref: '#/components/examples/hideTodoListColumnsRequest'
              unhideColumns:
                $ref: '#/components/examples/unhideTodoListColumnsRequest'
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/TodoListColumnDefinitionResponse'
              examples:
                columnDefinitions:
                  $ref: '#/components/examples/fetchingTodoListColumnDefinitionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
  /tasks/tasksTable/{tasksTableId}/rows:
    get:
      tags:
        - Tasks
      summary: 'Fetch tasks from tasks table'
      description: 'Fetch tasks from tasks table.'
      operationId: 'fetchTasksTableRows'
      parameters:
        - $ref: '#/components/parameters/tasksTableIdParam'
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ExtTaskTableResponse'
              examples:
                tasksTable:
                  $ref: '#/components/examples/tasksTableApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
    patch:
      tags:
        - Tasks
      summary: 'Update tasks in tasks table'
      description: |
        Update tasks in tasks table.

        Specify the expected 'action' value in request body.
        There are 7 actions accepted,
        - duplicate, duplicate current task.
        - delete, complete current task.
        - submit, submit current task.
        - cancel, cancel from submitted.
        - reopen, reopen from cancelled.
        - assign, assign a task to a user(Analyst) or a user group(Assigned Group).
          Tasks in completed or cancelled status cannot be assigned by this API.
          For this assign task action, the 'cells' field is required.
          The 'key' field is the property key(Analyst or Assigned Group), and the 'value' field is the property value.
          See example 'assignTask' for more details.
        - unassign, unassign a task from the user(Analyst) and the user group(Assigned Group).
          Tasks in inProgress or completed  status cannot be unassigned by this API.

      operationId: 'patchTasksTableRows'
      parameters:
        - $ref: '#/components/parameters/tasksTableIdParam'
        - $ref: '#/components/parameters/digestParam'
        - $ref: '#/components/parameters/forceParam'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/updateTasksTableRowRequest'
            examples:
              submitTask:
                $ref: '#/components/examples/submitTaskApiRequest'
              deleteTask:
                $ref: '#/components/examples/deleteTaskApiRequest'
              assignTask:
                $ref: '#/components/examples/assignTaskToGroupApiRequest'
              unassignTask:
                $ref: '#/components/examples/unassignTaskFromGroupApiRequest'
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ExtTaskTableResponse'
              examples:
                tasksList:
                  $ref: '#/components/examples/taskTodoListApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
  /tasks/tasksTable/{tasksTableId}/_column:
    get:
      tags:
        - Tasks
      summary: 'Fetch column definitions of tasks table'
      description: |
        Fetch column definitions of a tasks table.

        Accepted entity types: taskContainer.

        Example usages:

          GET /tasks/tasksTable/taskContainer:abcd/_column

      operationId: 'fetchTasksTableColumnDefinitions'
      parameters:
        - $ref: '#/components/parameters/tasksTableIdParam'
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/TasksTableColumnDefinitionResponse'
              examples:
                columnDefinitions:
                  $ref: '#/components/examples/fetchingTasksTableColumnDefinitionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
    patch:
      tags:
        - Tasks
      summary: 'Update column definition of tasks table'
      description: |
        Update column definition of a tasks table.

        The `action` field must be one of:
        - `hide`, set the specified columns as hidden
        - `unhide`, set the specified columns as visible

        The `columns` field is a non-empty list of column keys to apply the action to.

        Accepted entity types: taskContainer.

        Example usages:

          PATCH /tasks/tasksTable/taskContainer:abcd/_column

      operationId: 'patchTasksTableColumnVisibility'
      parameters:
        - $ref: '#/components/parameters/tasksTableIdParam'
        - $ref: '#/components/parameters/digestParam'
        - $ref: '#/components/parameters/forceParam'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/UpdateTasksTableColumnVisibilityRequest'
            examples:
              hideColumns:
                $ref: '#/components/examples/hideTasksTableColumnRequest'
              unhideColumns:
                $ref: '#/components/examples/unhideTasksTableColumnRequest'
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/TasksTableColumnDefinitionResponse'
              examples:
                columnDefinitions:
                  $ref: '#/components/examples/fetchingTasksTableColumnDefinitionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false

components:
  securitySchemes:
    api_key:
      type: apiKey
      in: header
      name: 'x-api-key'
  parameters:
    taskIdParam:
      name: 'taskId'
      in: path
      description: |
        Unique task identifier. Format: EID.

        Example value: "task:fc87f321-6b74-4046-bde0-0e1cf18bd8ce".
      required: true
      allowEmptyValue: false
      schema:
        type: string
        description: ''
        format: ''
        maxLength: 1000
        deprecated: false
    tasksTodoIdParam:
      name: 'todoListId'
      in: path
      description: |
        Unique task todo list identifier. Format: EID.

        Example value: "linkedTaskContainer:fc87f321-6b74-4046-bde0-0e1cf18bd8ce".
      required: true
      allowEmptyValue: false
      schema:
        type: string
        description: ''
        format: ''
        maxLength: 1000
        deprecated: false
    tasksTableIdParam:
      name: 'tasksTableId'
      in: path
      description: |
        Unique tasks table identifier. Format: EID.

        Example value: "taskContainer:fc87f321-6b74-4046-bde0-0e1cf18bd8ce".
      required: true
      allowEmptyValue: false
      schema:
        type: string
        description: ''
        format: ''
        maxLength: 1000
        deprecated: false
    includeParam:
      name: 'include'
      in: query
      description: |
        The related resources to be shown in "included" field.

        Example value: "children, owner".
      required: false
      allowEmptyValue: true
      schema:
        type: string
        description: ''
        format: ''
        maxLength: 200
        deprecated: false
    digestParam:
      name: 'digest'
      in: query
      description: >
        Indicate digest of entity.
        It is used to avoid conflict while concurrent editing.
        If the parameter 'force' is true, this parameter is optional.
        If the parameter 'force' is false, this parameter is required.
      schema:
        type: string
        deprecated: false
    forceParam:
