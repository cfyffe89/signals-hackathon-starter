    patch:
      tags:
        - HierarchicalTables
      summary: 'Update column definitions of a Hierarchical Table'
      description: |
        Update column definitions of a Hierarchical Table.

        The `action` field must be one of:
        - `hide`, set the specified columns as hidden
        - `unhide`, set the specified columns as visible

        The `tables` field is a non-empty list of tables to update, each with the following structure:
        - id: the ID of the table to update.
        - columns: a non-empty list of column IDs to hide/unhide in the specified table.

        Accepted entity types: hierarchicalGrid.

        Example usages:

          PATCH /hierarchicalTables/hierarchicalGrid:abcd/_columns?digest=xxx&force=false

      operationId: 'patchHierarchicalTablesColumnVisibility'
