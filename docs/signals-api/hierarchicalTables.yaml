openapi: 3.0.1
info:
  title: 'Signals Notebook APIs Document'
  version: v1.0
servers:
  - url: '/api/rest/v1.0'
    description: 'Signals Notebook'
security:
  - api_key: []

paths:
  /hierarchicalTables/{eid}:
    get:
      tags:
        - HierarchicalTables
      summary: 'Fetch all content of a Hierarchical Table'
      description: |
        Fetch all content of a Hierarchical Table including all layers and rows.

        Accepted entity types: hierarchicalGrid.

        Example usages:

          /hierarchicalTables/hierarchicalGrid:abcd

      operationId: 'fetchHierarchicalTablesContentById'
      parameters:
        - $ref: '#/components/parameters/hierarchicalTablesIdParam'
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/hierarchicalTableResponse'
              examples:
                hierarchicalTable:
                  $ref: '#/components/examples/fetchingHierarchicalTablesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false

  /hierarchicalTables/{eid}/tables/{tableId}:
    get:
      tags:
        - HierarchicalTables
      summary: 'Fetch all content of a Hierarchical Table Layer'
      description: |
        Fetch all content of a specific Hierarchical Table Layer.

        Accepted entity types: hierarchicalGrid.

        Example usages:

          /hierarchicalTables/hierarchicalGrid:abcd/tables/layer-1

      operationId: 'fetchHierarchicalTablesLayerById'
      parameters:
        - $ref: '#/components/parameters/hierarchicalTablesIdParam'
        - $ref: '#/components/parameters/tableIdParam'
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/hierarchicalTableLayerResponse'
              examples:
                hierarchicalTableLayer:
                  $ref: '#/components/examples/fetchingHierarchicalTablesLayerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
    post:
      tags:
        - HierarchicalTables
      summary: 'Add a new row to a Hierarchical Table Layer'
      description: |
        Add a new row to a Hierarchical Table Layer. And the parentRowId should be omitted if add operation is in a top-level table.

        Accepted entity types: hierarchicalGrid.

        Example usages:

          /hierarchicalTables/hierarchicalGrid:abcd/tables/layer-1?digest=xxx&force=false

        To get IDs of ontologyList type fields, please refer to /attributes/{attributeEid}/ontology/options.

        Here are some example values for different column data types:
          - number {"value": 3.0 }
          - date  {"value":"2019-09-06T15:22:47.309Z"}
          - text  {"value":"text1"}
          - list  {"value": "list1"}
          - multiSelect {"value": "select1, select2"}
          - attributeList(multiple option) {"values": ["select1", "select2"]}
          - ontologyList(single select) {"value": {"id": 1234}}
          - ontologyList(multiple select) {"values": [{"id": 1234}, {"id": 5678}]}
          - boolean {"value": true}
          - unit {"value": 3 } or {"display": "3 g"} or {"user": "3 g"}
        
            Note: "value" is stored in the system's base unit (e.g. mol for Amount, g/mL for Density, mmol/g for Loading, g for Mass,
            molar for Molarity, g/mol for Molecular Weight, atm for Pressure, °C for Temperature, min for Duration, mL for Volume).
        
            Suggestion: Use "display" or "user" to specify a value with an explicit unit.
          - link {"value": "experiment:a2f9bba9-a4c7-9999-a676-251de965c234"}
          - link(multiple option) {"values": [
            {"eid": "experiment:a2f9bba9-a4c7-9999-a676-251de965c234"}
          ]}
          - externalLink {"display": "Google", "value": "http://www.google.com"}

        Available units for different measurements:
        - Amount - μmol, mmol, mol
        - Density - g/L, mg/mL, g/mL, kg/L
        - Loading - mmol/g, mol/kg, mol/g, μmol/g, mmol/kg
        - Mass - ng, μg, mg, g, kg
        - Molarity - μmolar, mmolar, molar
        - Molecular Weight - g/mol, kg/mol, dalton
        - Pressure - atm, bar, mbar, Pa, kPa, mmHg, Torr, psi
        - Temperature - °C, °F, K
        - Duration - μs, ms, s, min, hour, day
        - Volume - nL, μL, mL, L, kL
        - Percentage - %

      operationId: 'addHierarchicalTablesLayerRows'
      parameters:
        - $ref: '#/components/parameters/hierarchicalTablesIdParam'
        - $ref: '#/components/parameters/tableIdParam'
        - $ref: '#/components/parameters/digestParam'
        - $ref: '#/components/parameters/forceParam'
        - $ref: '#/components/parameters/syncDataParam'

      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/AddRowRequest'
            examples:
              addARowInTopTableRequestBody:
                $ref: '#/components/examples/addARowInTopTableRequestBody'
              addARowInNonTopTableRequestBody:
                $ref: '#/components/examples/addARowInNonTopTableRequestBody'

      responses:
        '201':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/hierarchicalTableOneRowResponse'
              examples:
                hierarchicalTableRow:
                  $ref: '#/components/examples/addHierarchicalTablesOneRowResponse'

        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
    patch:
      tags:
        - HierarchicalTables
      summary: 'Bulk update content of a Hierarchical Table Layer'
      description: |
        Bulk update(including update/create/delete) multiple rows in a Hierarchical Table Layer. Updating column definition is NOT supported.
        Specify expected 'action' values in request body while updating/creating/deleting rows.
        And the parentRowId should be omitted if create operation is in a top-level table.

        The automatically calculated formula columns can also be modified through this API.
        If a specified value is given, it is no longer calculated automatically.
        Add "formulationAction=recalculate" in the body of the request to make the value calculate automatically again.

        Accepted entity types: hierarchicalGrid.

        Example usages:

          /hierarchicalTables/hierarchicalGrid:abcd/tables/layer-1?digest=xxx&force=false

        To get IDs of ontologyList type fields, please refer to /attributes/{attributeEid}/ontology/options.

        Here are some example values for different column data types:
          - number {"value": 3.0 }
          - date  {"value":"2019-09-06T15:22:47.309Z"}
          - text  {"value":"text1"}
          - list  {"value": "list1"}
          - multiSelect {"value": "select1, select2"}
          - attributeList(multiple option) {"values": ["select1", "select2"]}
          - ontologyList(single select) {"value": {"id": 1234}}
          - ontologyList(multiple select) {"values": [{"id": 1234}, {"id": 5678}]}
          - boolean {"value": true}
          - unit {"value": 3 } or {"display": "3 g" } or {"user": "3 g" }
        
            Note: "value" is stored in the system's base unit (e.g. mol for Amount, g/mL for Density, mmol/g for Loading, g for Mass,
            molar for Molarity, g/mol for Molecular Weight, atm for Pressure, °C for Temperature, min for Duration, mL for Volume).
        
            Suggestion: Use "display" or "user" to specify a value with an explicit unit.
          - link {"value": "experiment:a2f9bba9-a4c7-9999-a676-251de965c234"}
          - link(multiple option) {"values": [
            {"eid": "experiment:a2f9bba9-a4c7-9999-a676-251de965c234"}
          ]}
          - externalLink {"display": "Google", "value": "http://www.google.com"}

        If want to remove the value of one cell, set the content to null.

        Available units for different measurements:
        - Amount - μmol, mmol, mol
        - Density - g/L, mg/mL, g/mL, kg/L
        - Loading - mmol/g, mol/kg, mol/g, μmol/g, mmol/kg
        - Mass - ng, μg, mg, g, kg
        - Molarity - μmolar, mmolar, molar
        - Molecular Weight - g/mol, kg/mol, dalton
        - Pressure - atm, bar, mbar, Pa, kPa, mmHg, Torr, psi
        - Temperature - °C, °F, K
        - Duration - μs, ms, s, min, hour, day
        - Volume - nL, μL, mL, L, kL
        - Percentage - %

      operationId: 'bulkUpdateHierarchicalTablesLayerRows'
      parameters:
        - $ref: '#/components/parameters/hierarchicalTablesIdParam'
        - $ref: '#/components/parameters/tableIdParam'
        - $ref: '#/components/parameters/digestParam'
        - $ref: '#/components/parameters/forceParam'
        - $ref: '#/components/parameters/syncDataParam'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/UpdateRowRequest'
            examples:
              BulkUpdateRowValueBody:
                $ref: '#/components/examples/bulkPatchRowsRequestBody'
              BulkUpdateFormulationRowValueBody:
                $ref: '#/components/examples/bulkPatchFormulaRowsRequestBody'

      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/hierarchicalTableRowsResponse'
              examples:
                hierarchicalTableRows:
                  $ref: '#/components/examples/bulkUpdateHierarchicalTablesRowsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false

  /hierarchicalTables/{eid}/tables/{tableId}/rows/search:
    post:
      tags:
        - HierarchicalTables
      summary: 'Fetch all rows of a Hierarchical Table Layer from specified parent rows'
      description: |
        Fetch all rows of a Hierarchical Table Layer from specified parent rows.
        Request body requires a list of parent row ids.

        Accepted entity types: hierarchicalGrid.

        Example usages:

          /hierarchicalTables/hierarchicalGrid:abcd/tables/layer-2/rows

      operationId: 'fetchHierarchicalTablesRowsByParentIds'
      parameters:
        - $ref: '#/components/parameters/hierarchicalTablesIdParam'
        - $ref: '#/components/parameters/tableIdParam'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: object
                  required: [parentRowIds]
                  properties:
                    parentRowIds:
                      type: array
                      items:
                        type: string
                      description: List of parent row identifiers
            example:
              data:
                parentRowIds:
                  - "8e2c3d9e-c1df-49bf-ba33-151dc5c6e14a"
                  - "4de17b6f-751e-4a54-af90-d0a17668d6d9"
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/hierarchicalTableRowsResponse'
              examples:
                hierarchicalTableRows:
                  $ref: '#/components/examples/searchHierarchicalTablesRowsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false

  /hierarchicalTables/{eid}/tables/{tableId}/rows/{rowId}:
    get:
      tags:
        - HierarchicalTables
      summary: 'Fetch content of a specific row in a Hierarchical Table Layer'
      description: |
        Fetch content of a specific row in a Hierarchical Table Layer.

        Accepted entity types: hierarchicalGrid.

        Example usages:

          /hierarchicalTables/hierarchicalGrid:abcd/tables/layer-1/rows/8e2c3d9e-c1df-49bf-ba33-151dc5c6e14a

      operationId: 'fetchHierarchicalTablesLayerRowById'
      parameters:
        - $ref: '#/components/parameters/hierarchicalTablesIdParam'
        - $ref: '#/components/parameters/tableIdParam'
        - $ref: '#/components/parameters/rowIdParam'
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/hierarchicalTableOneRowResponse'
              examples:
                hierarchicalTableRow:
                  $ref: '#/components/examples/fetchingHierarchicalTablesOneRowResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
    patch:
      tags:
        - HierarchicalTables
      summary: 'Update content of a specific row in a Hierarchical Table Layer'
      description: |
        Update content of a specific row in a Hierarchical Table Layer.
        Only the cells provided in the request body will be updated.

        The automatically calculated formula columns can also be modified through this API.
        If a specified value is given, it is no longer calculated automatically.
        Add "formulationAction=recalculate" in the body of the request to make the value calculate automatically again.

        Accepted entity types: hierarchicalGrid.

        Example usages:

          /hierarchicalTables/hierarchicalGrid:abcd/tables/layer-1/rows/8e2c3d9e-c1df-49bf-ba33-151dc5c6e14a

        To get IDs of ontologyList type fields, please refer to /attributes/{attributeEid}/ontology/options.

        Here are some example values for different column data types,
          - number {"value": 3.0 }
          - date  {"value":"2019-09-06T15:22:47.309Z"}
          - text  {"value":"text1"}
          - list  {"value": "list1"}
          - multiSelect {"value": "select1, select2"}
          - attributeList(multiple option) {"values": ["select1", "select2"]}
          - ontologyList(single select) {"value": {"id": 1234}}
          - ontologyList(multiple select) {"values": [{"id": 1234}, {"id": 5678}]}
          - boolean {"value": true}
          - unit {"value": 3 } or {"display": "3 g" } or {"user": "3 g" }
            
            Note: "value" is stored in the system's base unit (e.g. mol for Amount, g/mL for Density, mmol/g for Loading, g for Mass,
            molar for Molarity, g/mol for Molecular Weight, atm for Pressure, °C for Temperature, min for Duration, mL for Volume).
            
            Suggestion: Use "display" or "user" to specify a value with an explicit unit.
          - link {"value": "experiment:a2f9bba9-a4c7-9999-a676-251de965c234"}
          - link(multiple option) {"values": [
            {"eid": "experiment:a2f9bba9-a4c7-9999-a676-251de965c234"},
            {"eid": "experiment:9528e408-939e-4902-ad5e-f7a085f627ce"}
          ]}
          - externalLink {"display": "Google", "value": "http://www.google.com"}

        To clear the value of a cell, set its content to null.
        Example,

        {
          key: "0cba9c0d-263c-49be-8f9b-a835235b76ac",
          content: null
        }

        Available units for different measurements.
        - Amount - μmol, mmol, mol
        - Density - g/L, mg/mL, g/mL, kg/L
        - Loading - mmol/g, mol/kg, mol/g, μmol/g, mmol/kg
        - Mass - ng, μg, mg, g, kg
        - Molarity - μmolar, mmolar, molar
        - Molecular Weight - g/mol, kg/mol, dalton
        - Pressure - atm, bar, mbar, Pa, kPa, mmHg, Torr, psi
        - Temperature - °C, °F, K
        - Duration - μs, ms, s, min, hour, day
        - Volume - nL, μL, mL, L, kL
        - Percentage - %

      operationId: 'updateHierarchicalTablesLayerRowById'
      parameters:
        - $ref: '#/components/parameters/hierarchicalTablesIdParam'
        - $ref: '#/components/parameters/tableIdParam'
        - $ref: '#/components/parameters/rowIdParam'
        - $ref: '#/components/parameters/digestParam'
        - $ref: '#/components/parameters/forceParam'
        - $ref: '#/components/parameters/syncDataParam'

      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/PatchRowRequest'
            examples:
              UpdateRowValueBody:
                $ref: '#/components/examples/patchRowRequestBody'
              UpdateFormulationRowValueBody:
                $ref: '#/components/examples/patchFormulaRowRequestBody'
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/hierarchicalTableOneRowResponse'
              examples:
                hierarchicalTableOneRow:
                  $ref: '#/components/examples/fetchingHierarchicalTablesOneRowResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
    delete:
      tags:
        - HierarchicalTables
      summary: 'Delete specified row from hierarchical table'
      description: |
        Delete specified row from hierarchical table.

        The related children rows will also be removed.

        Accepted entity types: hierarchicalGrid.


        Example usages:

          /hierarchicalTables/hierarchicalGrid:abcd/tables/layer-1/rows/8e2c3d9e-c1df-49bf-ba33-151dc5c6e14a

      operationId: 'deleteHierarchicalTablesLayerRowById'
      parameters:
        - $ref: '#/components/parameters/hierarchicalTablesIdParam'
        - $ref: '#/components/parameters/tableIdParam'
        - $ref: '#/components/parameters/rowIdParam'
        - $ref: '#/components/parameters/digestParam'
        - $ref: '#/components/parameters/forceParam'
      responses:
        '204':
          description: 'No Content'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false


  /hierarchicalTables/{eid}/header:
    get:
      tags:
        - HierarchicalTables
      summary: 'Fetch content of a Hierarchical Table header'
      description: |
        Fetch content of a Hierarchical Table header.

        Accepted entity types: hierarchicalGrid.

        Example usages:

          /hierarchicalTables/hierarchicalGrid:abcd/header

      operationId: 'fetchHierarchicalTablesHeaderById'
      parameters:
        - $ref: '#/components/parameters/hierarchicalTablesIdParam'
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/hierarchicalTableHeaderResponse'
              examples:
                hierarchicalTableHeader:
                  $ref: '#/components/examples/fetchingHierarchicalTablesHeaderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
    patch:
      tags:
        - HierarchicalTables
      summary: 'Patch content of a Hierarchical Table header'
      description: |
        Patch content of a Hierarchical Table header.

        Accepted entity types: hierarchicalGrid.

        Example usages:

          /hierarchicalTables/hierarchicalGrid:abcd/header
        
        Here are some example values for different column data types,
          - number {"value": 3.0 }
          - date  {"value":"2019-09-06T15:22:47.309Z"}
          - text  {"value":"text1"}
          - list  {"value": "list1"}
          - multiSelect {"value": "select1, select2"}
          - attributeList(multiple option) {"values": ["select1", "select2"]}
          - ontologyList(single select) {"value": {"id": 1234}}
          - ontologyList(multiple select) {"values": [{"id": 1234}, {"id": 5678}]}
          - boolean {"value": true}
          - unit {"value": 3 } or {"display": "3 g" } or {"user": "3 g" }
        
            Note: "value" is stored in the system's base unit (e.g. mol for Amount, g/mL for Density, mmol/g for Loading, g for Mass,
            molar for Molarity, g/mol for Molecular Weight, atm for Pressure, °C for Temperature, min for Duration, mL for Volume).
        
            Suggestion: Use "display" or "user" to specify a value with an explicit unit.
          - link {"value": "experiment:a2f9bba9-a4c7-9999-a676-251de965c234"}
          - link(multiple option) {"values": [
            {"eid": "experiment:a2f9bba9-a4c7-9999-a676-251de965c234"},
            {"eid": "experiment:9528e408-939e-4902-ad5e-f7a085f627ce"}
          ]}
          - externalLink {"display": "Google", "value": "http://www.google.com"}

        To clear the value of a cell, set its content to null.
        Example,

        {
          key: "0cba9c0d-263c-49be-8f9b-a835235b76ac",
          content: null
        }

        Available units for different measurements.
        - Amount - μmol, mmol, mol
        - Density - g/L, mg/mL, g/mL, kg/L
        - Loading - mmol/g, mol/kg, mol/g, μmol/g, mmol/kg
        - Mass - ng, μg, mg, g, kg
        - Molarity - μmolar, mmolar, molar
        - Molecular Weight - g/mol, kg/mol, dalton
        - Pressure - atm, bar, mbar, Pa, kPa, mmHg, Torr, psi
        - Temperature - °C, °F, K
        - Duration - μs, ms, s, min, hour, day
        - Volume - nL, μL, mL, L, kL
        - Percentage - %

