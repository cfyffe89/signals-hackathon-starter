      summary: 'Update subexperiment layout'
      description: |
        Update subexperiment layout.

        This API is used to update the layout of subexperiments. So, only the position of subexperiment can be updated by this API. Other properties of subexperiment can not be updated by this API.

        The PositionX and PositionY are started from "0".

        For the ID of plates,
        - The plate in the request with an existing ID will be updated.
        - The plate with any ID which is NOT in the request will not be changed.
        - The plate in the request with a non-existent ID will be taken as creating a new plate.

        For the action of plates,
        - add, add the specified subexperiments to current plate.
        - remove, remove the specified subexperiments from current plate.
        - removeAll, remove all the subexperiments from current plate.

      operationId: 'patchSubexpLayout'
