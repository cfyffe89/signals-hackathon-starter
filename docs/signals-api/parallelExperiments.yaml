  /subexpSummary/{subexpSummaryId}/samples/bulkCreate:
    post:
      tags:
        - ParallelExperiments
      summary: 'Bulk create samples for product(s) in a parallel experiment summary table'
      description: |
        Bulk create samples for product(s) in a parallel experiment summary table (paraGrid) asynchronously.

        This is an asynchronous API. If the request is accepted, the server will schedule a job and return a job ID.
        
        User can check the status of the job with API `GET /subexpSummary/{subexpSummaryId}/samples/bulkCreate/{jobId}`.

        **URL parameters:**
        - `sampleCount`: Number of samples to create per product. Must be an integer between 1 and 3.

        **Request body:**
        - `rowIds` (optional): List of row IDs to specify which sub-experiments to generate samples from.
          Defaults to all sub-experiments if not provided.
        
          Row IDs can be retrieved from `GET /subexpSummary/{subexpSummaryId}/rows`.
        - `sampleProperties` (optional): List of sample property values to apply to all created samples.
          If not provided, samples will be created with default properties.
        
          Available property definitions can be retrieved from `GET /samples/{sampleId}/properties`, sampleId is the id of default chemical sample template. 
          
          Note that only a subset of properties are writable (e.g., Description, Comments, Amount); system-managed and read-only properties will be rejected.

        Accepted entity types: paragrid

        Example usage:

        /subexpSummary/paragrid:fc87f321-6b74-4046-bde0-0e1cf18bd8ce/samples/bulkCreate?sampleCount=2

      operationId: 'bulkCreateSamplesFromParaGrid'
      parameters:
