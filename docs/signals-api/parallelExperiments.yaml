openapi: 3.0.1
info:
  title: 'Signals Notebook APIs Document'
  version: v1.0
servers:
  - url: '/api/rest/v1.0'
    description: 'Signals Notebook'
security:
  - api_key: [ ]

paths:
  /paraexp/{eid}/reset:
    post:
      tags:
        - ParallelExperiments
      summary: 'Reset and delete all subexperiments of a paraexperiment'
      description: |
        Reset and delete all subexperiments of current paraexperiment.
        This includes the manually added or enumerated subexperiments. Once deleted, they cannot be restored.
        
        This is an asynchronous API. If the request is accepted, server will start a job to do it.
        - The job status can be checked with API "/paraexp/{eid}/reset/{jobId}".
        - The job status is "IN_PROGRESS" while the the job is in processing.
        - The job status should be "COMPLETED" or "FAILED" after the job is finished.
        - If the status is "FAILED", the detail error message will be shown in the response.

        Accepted entity types: paraexp

        Example usage:

        /paraexp/paraexp:fc87f321-6b74-4046-bde0-0e1cf18bd8ce/reset

      operationId: 'resetParaexpAsync'
      parameters:
        - $ref: '#/components/parameters/paraexpEid'
        - $ref: '#/components/parameters/digestParam'
        - $ref: '#/components/parameters/forceParam'

      responses:
        '202':
          description: 'Accepted'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ParaexpResetJobResponse'
              examples:
                ResetParaexpAsync:
                  $ref: '#/components/examples/startAsyncResetParaexpApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
  /paraexp/{eid}/reset/{jobId}:
    get:
      tags:
        - ParallelExperiments
      summary: 'Get the status of paraexperiment resetting job'
      description: |
        Get the status of paraexperiment resetting job.
        - The job status is "IN_PROGRESS" while the the job is in processing.
        - The job status should be "COMPLETED" or "FAILED" after the job is finished.
        - If the status is "FAILED", the detail error message will be shown in the response.

        Accepted entity types: paraexp

        Example usage:

        /paraexp/paraexp:fc87f321-6b74-4046-bde0-0e1cf18bd8ce/reset/42

      operationId: 'fetchStatusOfParaexpResetting'
      parameters:
        - $ref: '#/components/parameters/paraexpEid'
        - name: 'jobId'
          in: path
          description: 'Job ID of paraexperiment resetting.'
          required: true
          schema:
            type: string
            description: ''
            format: ''
            maxLength: 99
            deprecated: false

      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ParaexpResetJobResponse'
              examples:
                ResetParaexpSucceed:
                  $ref: '#/components/examples/getAsyncResetParaexpSuccessStatusApiResponse'
                ResetParaexpFailed:
                  $ref: '#/components/examples/getAsyncResetParaexpFailedStatusApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
  /enumerator/{eid}:
    get:
      tags:
        - ParallelExperiments
      summary: 'Get content of an enumerator'
      description: |
        Get content of an enumerator by the specified Id.
        
        Accepted entity types: paraenum

        Example usage:

        /enumerator/paraenum:fc87f321-6b74-4046-bde0-0e1cf18bd8ce

      operationId: 'fetchEnumeratorContentById'
      parameters:
        - $ref: '#/components/parameters/enumeratorEid'
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ParaexpEnumeratorResponse'
              examples:
                EnumeratorContent:
                  $ref: '#/components/examples/getEnumeratorContentApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
  /enumerator/{eid}/addCompound:
    post:
      tags:
        - ParallelExperiments
      summary: 'Add compound to an enumerator'
      description: |
        Add compound(s) to an enumerator by uploading a file.

        "Content-Type" in Header is required for this API. Such as, "Content-Type: chemical/x-cdxml", "Content-Type: chemical/x-mdl-molfile" etc.
        
        Here are the accepted content types and its file extension:
        - "chemical/x-cdxml" -> "cdxml"
        - "chemical/x-mdl-molfile" -> "mol"
        - "chemical/x-daylight-smiles" -> "smiles"
        - "chemical/x-inchi" -> "inchi"
        - "chemical/x-mdl-sdfile" -> "sdf"

        SDF file is used to add multiple compounds. The others are used to add single compound.
        
        For adding compounds from SDF file, the column fields are mapped by the exact name match.
        To be consistent with the exported SDF file from UI, the 7 characters, "-.<>=% ", in name are replaced with "_".

        Accepted entity types: paraenum

        Example usage:

        /enumerator/paraenum:fc87f321-6b74-4046-bde0-0e1cf18bd8ce/addCompound

      operationId: 'addCompoundToReactionGroup'
      parameters:
        - $ref: '#/components/parameters/enumeratorEid'
        - $ref: '#/components/parameters/enumeratorReactionGroupId'
        - $ref: '#/components/parameters/digestParam'
        - $ref: '#/components/parameters/forceParam'
      requestBody:
        content:
          chemical/x-cdxml:
            schema:
              type: string
              format: binary
          chemical/x-daylight-smiles:
            schema:
              type: string
              format: binary
          chemical/x-mdl-molfile:
            schema:
              type: string
              format: binary
          chemical/x-inchi:
            schema:
              type: string
              format: binary
          chemical/x-mdl-sdfile:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/EntityApiResponse'
              examples:
                AddCompound:
                  $ref: '#/components/examples/getEnumeratorEntityApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
  /enumerator/{eid}/refreshGroups:
    post:
      tags:
        - ParallelExperiments
      summary: 'Refresh groups of an enumerator'
      description: |
        Refresh enumerator groups with the selected reaction.

        This API is used to refresh the groups if the currently selected reaction changed. 
        It is also used to switch reactions by specifying a new reaction ID in the request body.

        The "selectedReactionEid" is the EID of the chemical drawing. It is required in the request body.

        If the "checksum" of the reaction and chemical drawing stoichiometry data is different,
        this means that the reaction changed after it was selected.

        Accepted entity types: paraenum

        Example usage:

        /enumerator/paraenum:fc87f321-6b74-4046-bde0-0e1cf18bd8ce/refreshGroups

      operationId: 'refreshEnumeratorReactionGroups'
      parameters:
        - $ref: '#/components/parameters/enumeratorEid'
        - $ref: '#/components/parameters/digestParam'
        - $ref: '#/components/parameters/forceParam'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/RefreshGroupsOfEnumeratorRequest'
            examples:
              RefreshGroups:
                $ref: '#/components/examples/refreshEnumeratorGroupsExampleRequest'
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/EntityApiResponse'
              examples:
                RefreshGroups:
                  $ref: '#/components/examples/getEnumeratorEntityApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
  /enumerator/{eid}/enumerate:
    post:
      tags:
        - ParallelExperiments
      summary: 'Enumerate to generate subexperiments'
      description: |
        Enumerate to generate subexperiments.
        
        This is an asynchronous API. If the request is accepted, server will start a job to do it.
        - The job status can be checked with API "/enumerator/{eid}/enumerate/{jobId}".
        - The job status is "IN_PROGRESS" while the the job is in processing.
        - The job status should be "COMPLETED" or "FAILED" after the job is finished.
        - If the status is "FAILED", the detail error message will be shown in the response.

        The "contentsToCopy" is required in the request body.
        It is used to decide which children in the paraexperiment will be cloned into the new subexperiments.

        Keep the value as an empty array if no content is needed.

        And also, paraexperiment particular items can not be cloned into subexperiment, such as
        - paraGrid
        - parasamplesgrid
        - paralayout
        - paraenum

        Accepted entity types: paraenum

        Example usage:

        /enumerator/paraenum:fc87f321-6b74-4046-bde0-0e1cf18bd8ce/enumerate

      operationId: 'enumerateParaexpAsync'
      parameters:
        - $ref: '#/components/parameters/enumeratorEid'
        - $ref: '#/components/parameters/digestParam'
        - $ref: '#/components/parameters/forceParam'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/EnumerateParaexpRequest'
            examples:
              Enumerate:
                $ref: '#/components/examples/enumerateParaexpExampleRequest'
      responses:
        '202':
          description: 'Accepted'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ParaexpEnumerateJobResponse'
              examples:
                AsyncEnumerate:
                  $ref: '#/components/examples/startAsyncEnumerateParaexpApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
  /enumerator/{eid}/enumerate/{jobId}:
    get:
      tags:
        - ParallelExperiments
      summary: 'Get the status of enumerating job'
      description: |
        Get the status of paraexperiment enumerating job.
        - The job status is "IN_PROGRESS" while the the job is in processing.
        - The job status should be "COMPLETED" or "FAILED" after the job is finished.
        - If the status is "FAILED", the detail error message will be shown in the response.

        Accepted entity types: paraenum

        Example usage:

        /enumerator/paraenum:fc87f321-6b74-4046-bde0-0e1cf18bd8ce/enumerate/47

      operationId: 'fetchStatusOfParaexpEnumerating'
      parameters:
        - $ref: '#/components/parameters/enumeratorEid'
        - name: 'jobId'
          in: path
          description: 'Job ID of paraexperiment enumerating.'
          required: true
          schema:
            type: string
            description: ''
            format: ''
            maxLength: 99
            deprecated: false

      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ParaexpEnumerateJobResponse'
              examples:
                EnumerateParaexpSucceed:
                  $ref: '#/components/examples/getAsyncEnumerateParaexpSuccessStatusApiResponse'
                EnumerateParaexpFailed:
                  $ref: '#/components/examples/getAsyncEnumerateParaexpFailedStatusApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
  /extenumerator/{eid}/upload:
    post:
      tags:
        - ParallelExperiments
      summary: 'Upload csv, sdf, or rdf to an external enumerator'
      description: |
        Uploading a file csv, sdf, rdf to an external enumerator.

        "Content-Type" in Header is required for this API. Such as, "Content-Type: text/csv", "Content-Type: chemical/x-mdl-sdfile", "Content-Type: chemical/x-mdl-rdfile".

        Accepted entity types: extparaenum

        Example usage:

        /extenumerator/extparaenum:fc87f321-6b74-4046-bde0-0e1cf18bd8ce/upload

      operationId: 'uploadToExternalEnumerator'
      parameters:
        - $ref: '#/components/parameters/extenumeratorEid'
        - $ref: '#/components/parameters/digestParam'
        - $ref: '#/components/parameters/forceParam'
        - in: header
          name: X-Filename
          required: false
          schema:
            type: string
          description: >
            Indicates the upload file name. If this header is omitted or empty,
            the service falls back to `enumeratorEntity.name`. When provided,
            the value should be UTF-8 header-encoded (URL-encoded).
      requestBody:
        content:
          text/csv:
            schema:
              type: string
              format: binary
          chemical/x-mdl-sdfile:
            schema:
              type: string
              format: binary
          chemical/x-mdl-rdfile:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/EntityApiResponse'
              examples:
                AddCompound:
                  $ref: '#/components/examples/getEnumeratorEntityApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
  /extenumerator/mapping/template:
    get:
      tags:
        - ParallelExperiments
      summary: 'Get mapping template for patching to external enumerator'
      description: |
        Get mapping template for patching to external enumerator.

        This mapping template is a structure without any settings, user can use it to construct own mapping and patch to external enumerator

        Example usage:

        /extenumerator/mapping/template

      operationId: 'fetchMappingTemplate'
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ExtExternalEnumeratorMappingResponse'
              examples:
                EnumeratorContent:
                  $ref: '#/components/examples/patchMappingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
  /extenumerator/{eid}/mapping:
    patch:
      tags:
        - ParallelExperiments
      summary: 'Patch mapping to an external enumerator'
      description: |
        Patch Mapping to an External Enumerator

        Use `GET /extenumerator/mapping/template` to fetch the field definitions for `reactants`, `products`, `conditions`, and `solvents` in order to construct the mapping.

        - `externalField`: maps to a column in the file.

        - `key`: maps to a key in the definitions. For other details, please refer to the examples.

        - `isBase64Encoded`, `isChemicalField`: relate to chemical structure columns. When setting a chemical structure, you must also set `type`; accepted values are: `Mol2k`, `Mol3k`, `SMILES`, `INCHI`, `CDXML`.

        - `unit`: applies when `type` is `unit`. Accepted values are the unit of value and measure (e.g., molecular mass displays as `g/mol`, `kg/mol`, etc.).

        - `isFixed`: indicates that the column value is provided by the user; used together with `fixedValue`.

        Accepted entity types: extparaenum

        Example usage:

        /extenumerator/extparaenum:fc87f321-6b74-4046-bde0-0e1cf18bd8ce/mapping

      operationId: 'patchMappingToExternalEnumerator'
      parameters:
        - $ref: '#/components/parameters/extenumeratorEid'
        - $ref: '#/components/parameters/digestParam'
        - $ref: '#/components/parameters/forceParam'
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/PatchMappingRequest'
            examples:
              patchReactants:
                $ref: '#/components/examples/patchReactants'
              patchProducts:
                $ref: '#/components/examples/patchProducts'
              patchConditions:
                $ref: '#/components/examples/patchConditions'
              patchSolvents:
                $ref: '#/components/examples/patchSolvents'
              patchTextFixedValue:
                $ref: '#/components/examples/patchTextFixedValue'
              patchUnitFixedValue:
                $ref: '#/components/examples/patchUnitFixedValue'
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ExtExternalEnumeratorMappingResponse'
              examples:
                patchMapping:
                  $ref: '#/components/examples/patchMappingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
  /extenumerator/{eid}:
    get:
      tags:
        - ParallelExperiments
      summary: 'Get content of an external enumerator'
      description: |
        Get content of an external enumerator by the specified Id.

        Accepted entity types: extparaenum

        Example usage:

        /extenumerator/extparaenum:fc87f321-6b74-4046-bde0-0e1cf18bd8ce

      operationId: 'fetchExternalEnumeratorContentById'
      parameters:
        - $ref: '#/components/parameters/extenumeratorEid'
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ExtExternalEnumeratorMappingResponse'
              examples:
                patchMapping:
                  $ref: '#/components/examples/patchMappingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
  /extenumerator/{eid}/enumerate:
    post:
      tags:
        - ParallelExperiments
      summary: 'External Enumerate to generate subexperiments'
      description: |
        External Enumerate to generate subexperiments.

        This is an asynchronous API. If the request is accepted, the server will start a job to process it.
        - The job status can be checked with the API "/extenumerator/{eid}/enumerate/{jobId}".
        - The job status is "IN_PROGRESS" while the job is being processed.
        - The job status will be "COMPLETED" or "FAILED" after the job is finished.
        - If the status is "FAILED", the detailed error message will be shown in the response.

        "contentsToCopy" is required in the request body.
        It is used to decide which children in the paraexperiment will be cloned into the new subexperiments.

        Keep the value as an empty array if no content is needed.

        Also, paraexperiment-specific items cannot be cloned into a subexperiment, such as:
        - paraGrid
        - parasamplesgrid
        - paralayout
        - paraenum
        - extparaenum

        Accepted entity types: extparaenum

        Example usage:

        /extenumerator/extparaenum:fc87f321-6b74-4046-bde0-0e1cf18bd8ce/enumerate

      operationId: 'externalEnumerateParaexpAsync'
      parameters:
        - $ref: '#/components/parameters/extenumeratorEid'
        - $ref: '#/components/parameters/digestParam'
        - $ref: '#/components/parameters/forceParam'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/EnumerateParaexpRequest'
            examples:
              Enumerate:
                $ref: '#/components/examples/enumerateParaexpExampleRequest'
