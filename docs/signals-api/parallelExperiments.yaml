  /subexpLayout/{layoutId}/reset:
    patch:
      tags:
        - ParallelExperiments
      summary: 'Reset/autoFill subexperiment layout asynchronously'
      description: |
        Reset/autoFill subexperiment layout asynchronously. The layout will be reset with the new layout pattern.

        User can systematically layout the Subexperiments on the plate(s) by selecting one of the following patterns:
        - "keep_fill": keep the original subexperiment place but change the plate size. The new size must be able to keep all the placed subexperiments.
        - "across_row": left to right repeated. For example, for a 96 well plate A1 to A12, then B1 to B12, then C1 to C12 and so on, and then subsequently onto other plates if needed.
        - "left_to_right_row": left to right, then reversed right to left, repeated. For example, for a 96 well plate A1 to A12, then B12 to B1, then C1 to C12 and so on, and then subsequently onto other plates if needed.
        - "down_column": up to Down repeated. For example, for a 96 well plate A1 to H1, then A2 to H2, then A3 to H3 and so on, and then subsequently onto other plates if needed.
        - "down_and_up_column": up to Down, then reversed Down to Up, repeated. For example, for a 96 well plate A1 to H1, then H2 to A2, then A3 to H3 and so on, and then subsequently onto other plates if needed.

        Any wells indicated as blocked will be skipped.

        This is an asynchronous API.

        If the request is accepted, server will start a job to execute and return a report with a job ID to client.

        Client can check the status of the job with API "/subexpLayout/{layoutId}/reset/{jobId}".

        While the job is finished, the job status should be "SUCCESS" or "FAILED".

      operationId: 'resetSubexpLayout'
      parameters:
        - $ref: '#/components/parameters/paraLayoutId'
        - $ref: '#/components/parameters/digestParam'
        - $ref: '#/components/parameters/forceParam'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/ResetParaLayoutRequest'
            examples:
              ResizeLayout:
                $ref: '#/components/examples/ResizeParaLayoutApiRequest'
              ResetLayout:
                $ref: '#/components/examples/ResetParaLayoutApiRequest'
      responses:
        '202':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/JsonApiResponse'
              examples:
                ResetSubexpLayoutAsync:
                  $ref: '#/components/examples/asyncResetSubexpLayoutApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
