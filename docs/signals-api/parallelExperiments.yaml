      description: |
        Bulk update content of subexperiment summary table asynchronously.

        This is an asynchronous API.

        If the request is accepted, server will start a job to execute and return a report with a bulk update ID to client.

        Client can check the status of the job with API "/subexpSummary/{subexpSummaryId}/bulkUpdate/{bulkUpdateId}".

        While the job is finished, the job status should be "SUCCESS" or "FAILED".

        Examples for properties with different data types:
        - number, {"value": 3.0 }
        - date,  {"value":"2019-09-06T15:22:47.309Z"}
        - list,  {"value": "list1"}
        - unit,  {"value": "78.11 g/mol"}
        - multiSelect, {"value": "select1, select2"}
        - attributeList(multiple option), {"values": ["select1", "select2"]}
        - boolean, {"value": true}
        - link, {"value": "experiment:a2f9bba9-a4c7-9999-a676-251de965c234"}
        - link(multiple option), {"values": [{"eid": "experiment:a2f9bba9-a4c7-9999-a676-251de965c234"}]}
        - externalLink, {"user": "Google", "value": "http://www.google.com"}
        - ontologyList, {"value": {"id": "123", "iri": "http://example.com/iri", "preferredName": "Term A"}}
        - ontologyList(multiple option), {"values": [{"id": "123", "iri": "http://example.com/iriA", "preferredName": "Term A"}, {"id": "456", "iri": "http://example.com/iriB", "preferredName": "Term B"}]}

