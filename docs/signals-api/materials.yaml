  /materials/{libraryName}/bulkImport:
    post:
      tags:
        - Materials
      summary: 'Bulk import materials'
      deprecated: false
      operationId: 'bulkImportMaterials'
      description: |
        Bulk import materials into a specified material library.

        Currently, this API support import data from json or zip file.

        In JSON format:

        Request body should be a list of assets.
        For each asset, please refer to the POST API "/materials/{libraryName}/assets" for detail.

        You can include a base64 encoded image as display image for none compounds materials.
        For example:
        {
          "id": "5f3ddfde80317b4144232155",
          "value": "data:image/png;base64,iVBORw0KGKQjm0arkJggg=="
        }

        And the link value(s) is as below,
        - "LINK": {"eid": "batch:5ed8b35fa41afa9298674424", "name": "0011-1230001", "type": "batch"}
        - "LINK"(multiple option): [{"eid": "batch:5ed8b35fa41afa9298674424", "name": "0011-1230001", "type": "batch"}]

        In ZIP file format:

        Request body should be a zip file, the zip file contains the sdf file or csv file and attachments.
        For the zip file format, please refer the GET API "/materials/{libraryName}/bulkImport/example"
        to download the example zip file.

        The column name in each records of sdf/csv file should be match the asset field name. In sdf file, it doesn't support
        character '-', '.', '<', '>', '=', '%', ' ', please replace them to '_' in records.
        For example, '% active' field in Compounds should be mapped to ‘__active’ column in sdf file which prepare to import.

        For multi select fields, we will separate values in "\n", please add values as "val1\nval2\nval3".

        Fields with calculated is true (e.g. Chemical or Protein type Materials) are not supported in bulk import. 
        
        In the exported or example file, the internal reference value is divided into two parts: “name” and “link”. 
        When importing data, only the information in the “name” column will be considered. However, if needed, 
        the data from the “link” column can be transferred to the “name” column for import purposes. 
        For instance, both “Experiment-0001” and “https://signalsresearch.revvitycloud.net/elements/entity/experiment:xxxxx-xxxx-xxxxx-xxxx” 
        are acceptable for import as internal references. If desired, the “link” column can be omitted from the example file.

        Notes:

        1. This is an asynchronous API.

        If the request is accepted, server will start a job to import the materials asynchronously and return a report with a job ID to client.

        Client can check the status of the job with API `/materials/bulkImport/jobs/{jobId}`.

        While the job is completed, client can select to download a detail report of the bulk import with API `/materials/bulkImport/jobs/{jobId}/report`.

        The content of the report depends on the parameter "reportFormat" in the request of bulk import.
        - (blank or not specified), the report only includes the materials which failed to import.
        - 'FAILURES_ONLY', the report only includes the materials which failed to import.
        - 'DUPLICATES_AND_FAILURES', the report includes the materials which failed to import or duplicated.
        - 'ALL_RESULTS', the report includes the materials which imported successfully, failed to import or duplicated.

        While the job is finished(either completed or failed), client can select to delete the report in server with API `/materials/bulkImport/jobs/{jobId}`.
        Otherwise the report will stay in server for a long time.

        2. Rules of import:
        - 'TREAT_AS_UNIQUE', each item will be treated as a new asset. Please note that this option is selected by default.
        - 'USE_MATCHES', server will check the item with uniqueness check, if same will import as a batch.
        - 'USE_ASSET_AND_BATCH_MATCHES', server will check the item with uniqueness check, if duplicated will imported as new batch with existing batch type of an existing asset. Please note this is only for Normalized Compounds library.
        - 'NO_DUPLICATED', server will check the item with uniqueness check, duplicates are skipped and not imported.

        3. ImportType:
        - 'zip': the upload file should be a zip file.
        - 'json': the upload file should in a json format.
        
        4. Import compounds materials by a zipped CSV file:

        The chemical drawing format will be auto-detected by the column name:
        - Chemical Structure (SMILES): SMILES
        - Chemical Structure (InChI): InChI
        - Chemical Structure (HELM): HELM

        If more than one chemical structure column is found, the priority is placed in the above order. The column with the highest priority will be selected.

        5. Report Format options:
          - 'FAILURES_ONLY', the report only includes the materials which failed to import. This is the default value.
          - 'DUPLICATES_AND_FAILURES', the report includes the materials which failed to import or duplicated.
          - 'ALL_RESULTS', the report includes the materials which imported successfully, failed to import or duplicated.

        6. Max request body size: 300MiB.

      parameters:
        - $ref: '#/components/parameters/libraryNameParam'
        - name: 'rule'
          in: query
          description: 'Rule of import'
          required: false
          schema:
            type: string
            enum: [ 'TREAT_AS_UNIQUE', 'USE_MATCHES', 'USE_ASSET_AND_BATCH_MATCHES', 'NO_DUPLICATED' ]
            description: ''
            default: 'TREAT_AS_UNIQUE'
            format: ''
            maxLength: 99
            deprecated: false
        - name: 'importType'
          in: query
          description: 'type of the bulk import, default to json, should be set to zip when bulk importing from zip file'
          required: false
          schema:
            type: string
            enum: ['zip', "json"]
            default: 'json'
            description: 'Indicate the bulkImport type'
            format: ''
            maxLength: 99
            deprecated: false
        - name: 'processInAnyOrder'
          in: query
          description: |
            Import the materials in the file in any order, so as to improve import speed. System-generated material IDs will not be assigned in the order the materials are in the file.
            
            When used with `USE_MATCHES`, `USE_ASSET_AND_BATCH_MATCHES`, or `NO_DUPLICATED`, the materials in the file must be unique in order to prevent unexpected duplicates.
            
            For `TREAT_AS_UNIQUE`, there is no impact, as each material will create a new material in the system, regardless of uniqueness check finding duplicates. If specifying IDs in the file, any duplicates will cause failures.
          required: false
          schema:
            type: boolean
            deprecated: false
        - name: 'reportFormat'
          in: query
          description: |
            Identify the content of the report.
            The report will be generated in the format specified by this parameter.
            If not specified, the default value is "FAILURES_ONLY".'
          required: false
          schema:
            type: string
            enum: [ 'FAILURES_ONLY', 'DUPLICATES_AND_FAILURES', 'ALL_RESULTS' ]
            default: 'FAILURES_ONLY'
            description: 'Indicate the format of the report'
            format: ''
            maxLength: 99
            deprecated: false
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/BulkImportRequest'
            examples:
              Assets:
                $ref: '#/components/examples/bulkImportAssetRequest'
          application/octet-stream:
            schema:
              type: string
              format: binary
            example: '(please refer API \"/materials/{libraryName}/bulkImport/example\" to get the example file)'
      responses:
        '200':
          description: 'accepted'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/MaterialBulkImportReportApiResponse'
              examples:
                Report:
                  $ref: '#/components/examples/bulkImportReportResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '434':  
          $ref: '#/components/responses/RequestValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /materials/bulkImport/jobs/{jobId}:
    get:
      tags:
