components:
  securitySchemes:
    api_key:
      type: apiKey
      in: header
      name: 'x-api-key'
  parameters:
    materialEntityIdParam:
      name: 'eid'
      in: path
      description: |
        Unique material identifier. Format: EID.
        Accepted material types: asset, assetType, batch.

        Example value: "asset:1234567".
      required: true
      allowEmptyValue: false
      schema:
        type: string
        description: ''
        format: ''
        maxLength: 1000
        deprecated: false
    libraryNameParam:
      name: libraryName
      in: path
      description: |
        The name of material library(Alias, asset type).

        For example:
        Antibodies, Cell Lines, Compounds, Equipment and etc.
      required: true
      allowEmptyValue: false
      schema:
        type: string
        description: ''
        format: ''
        minLength: 1
        maxLength: 1000
        deprecated: false
    dataFileType:
      name: dataFileType
      in: query
      description: |
        The data type of the import materials unzipped file example.
        If no dataFileType is present SDF will be set as a default.
        
        For example:
        SDF, CSV
      allowEmptyValue: true
      schema:
        type: string
        description: ''
        format: ''
        minLength: 1
        maxLength: 1000
        deprecated: false
    materialIdParam:
      name: id
      in: path
      description: |
        The unique id of material.
      required: true
      allowEmptyValue: false
      schema:
        type: string
        description: ''
        format: ''
        minLength: 1
        maxLength: 1000
        deprecated: false
    assetBatchIdParam:
      name: 'eid'
      in: path
      description: |
        Unique material identifier. Format: EID.
        Accepted material types: asset, batch.
        Example value: "asset:619ca6f5f99e014ed31bf0aa".
      required: true
      allowEmptyValue: false
      schema:
        type: string
        description: ''
        format: ''
        maxLength: 1000
        deprecated: false
    assetIdParam:
      name: 'eid'
      in: path
      description: |
        Unique material identifier. Format: EID.
        Accepted material types: asset.
        Example value: "asset:619ca6f5f99e014ed31bf0aa".
      required: true
      allowEmptyValue: false
      schema:
        type: string
        description: ''
        format: ''
        maxLength: 1000
        deprecated: false
    batchIdParam:
      name: 'eid'
      in: path
      description: |
        Unique material identifier. Format: EID.
        Accepted material types: batch.
        Example value: "batch:619ca6f5f99e014ed31bf0aa".
      required: true
      allowEmptyValue: false
      schema:
        type: string
        description: ''
        format: ''
        maxLength: 1000
        deprecated: false
    digestParam:
      name: 'digest'
      in: query
      description: >
        Indicate digest of material.
        It is used to avoid conflict while concurrent editing.
        If the parameter 'force' is true, this parameter is optional.
        If the parameter 'force' is false, this parameter is required.
      schema:
        type: string
        deprecated: false
    materialsTableIdParam:
      name: 'materialsTableId'
      in: path
      description: |
        ID of the materials table.
        Accepted entity type: materialsTable.
        Example value: "materialsTable:619ca6f5f99e014ed31bf0aa".
      required: true
      schema:
        type: string
        description: ''
        format: ''
        maxLength: 1000
        deprecated: false
    materialsTableRowIdParam:
      name: 'rowId'
      in: path
      description: |
        ID of the materials table row.
        Example value: "619ca6f5f99e014ed31bf0aa".
      required: true
      schema:
        type: string
        description: ''
        format: ''
        maxLength: 1000
        deprecated: false
    materialsTableDigestParam:
      name: 'digest'
      in: query
      description: >
        Indicate digest of materials table.
        It is used to avoid conflict while concurrent editing.
        If the parameter 'force' is true, this parameter is optional.
        If the parameter 'force' is false, this parameter is required.
      schema:
        type: string
        deprecated: false
    forceParam:
      name: 'force'
      in: query
      description: >
        Force to do without checking the provided digest.
        If set to true, the system will retrieve and use the latest digest from the server before executing the action, ignoring any provided digest.
      schema:
        type: boolean
        deprecated: false
    aromaticRepresentationParam:
      name: 'aromaticRepresentation'
      in: query
      description: |
        Aromatic representation. Valid values are:
          - aromatic, Aromatic Circles.
          - alternating, Alternating Double/Single Bonds.
      schema:
        type: string
        enum: ['aromatic', 'alternating']
        description: ''
        format: ''
        maxLength: 1000
        deprecated: false
    mol3000LabelsParam:
      name: 'labels'
      in: query
      description: |
        Labels representation.

        This setting is applicable only to files in the V3000 MDL format.
        For all other formats, this value will be disregarded.

        Valid values are:
          - expanded, expand all labels.

      schema:
        type: string
        enum: ['expanded']
        description: ''
        format: ''
        maxLength: 1000
        deprecated: false
    materialFieldsParam:
      name: 'fields[material]'
      in: query
      description: |
        Filter fields of attributes for material type.

        Example value: "id,eid,name,chemicalDrawing,image...".
      required: false
      explode: true
      schema:
        type: array
        items:
          type: string
          description: ""
          default: ""
          maxLength: 200
    includeParam:
      name: 'include'
      in: query
      description: |
        The related resources to be shown in "included" field.

        Example value: "batches, owner".
      required: false
      allowEmptyValue: true
      schema:
        type: string
        description: ''
        format: ''
        maxLength: 200
        deprecated: false
    materialStructureFormatParam:
      name: 'structureFormat'
      in: query
      description: |
        Optional format for returning the material's structure.
        Supported values: `helm`, `smiles`, `inchi`, `mol`, `mol-v3000`, `cdxml`.

        Notes:
        - No structure will be returned if the parameter is not provided.
        - Ignored for non-chemical libraries.
        - If requested format cannot be derived, `structure.error` explains why.
      required: false
      allowEmptyValue: false
      schema:
        type: string
        enum: ['helm', 'smiles', 'inchi', 'mol', 'mol-v3000', 'cdxml']
        description: ''
        format: ''
        maxLength: 100
        deprecated: false
    offsetParam:
      name: page[offset]
      in: query
      description: Number of items to skip before returning the results.
      required: false
      schema:
        type: integer
        format: int64
        minimum: 0
        default: 0
    limitParam:
      name: page[limit]
      in: query
      description: Maximum number of items to return.
      required: false
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 100
        default: 20
    valueFormatParam:
      name: 'value'
      in: query
      description: |
        Format of field values.
        1. Display.

          Will return value without units.
          Example value: mf : {value: "198.3189 g/mol"}
        2. Normalized.

          Will return composite field value with units.
          Example value: mf : {value: 198.3189, units:"g/mol", display: "198.3189 g/mol"}
      required: false
      allowEmptyValue: true
      schema:
        type: string
        enum: [ 'display', 'normalized' ]
        default: 'display'
        deprecated: false
    enrichSequenceParam:
      name: 'enrichSequence'
      in: query
      description: |
        A flag to indicate whether return Sequence value in the response.
      required: false
      allowEmptyValue: false
      schema:
        type: boolean
        deprecated: false
    assetBatchFieldIdParam:
      name: 'fieldId'
      in: path
      description: |
        Unique material field identifier. Format: EID.
        Example value: "619c9264f99e014ed31bf07c".
      required: true
      allowEmptyValue: false
      schema:
        type: string
        description: ''
        format: ''
        maxLength: 1000
        deprecated: false
    materialAttachmentParam:
      name: 'filename'
      in: header
      description: 'Indicate file name of attachment'
      required: true
      schema:
        type: string
        description: ''
        format: ''
        maxLength: 1000
        deprecated: false
  schemas:
    ErrorResponse:
      type: object
      required: [ errors ]
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              status:
                type: string
              code:
                type: string
              title:
                type: string
              detail:
                type: string

    JsonApiResponse:
      title: 'JsonApiResponse'
      type: object
      properties:
        data:
          oneOf:
            - $ref: '#/components/schemas/JsonApiData'
            - type: array
              items:
                $ref: '#/components/schemas/JsonApiData'
        included:
          type: array
          items:
            $ref: '#/components/schemas/JsonApiData'
        links:
          $ref: '#/components/schemas/JsonApiLinks'
    JsonApiRelationship:
      title: 'JsonApiRelationship'
      type: object
      properties:
        data:
          oneOf:
            - $ref: '#/components/schemas/JsonApiDataIdentifier'
            - type: array
              items:
                $ref: '#/components/schemas/JsonApiDataIdentifier'
        links:
          $ref: '#/components/schemas/JsonApiLinks'
    JsonApiData:
      title: 'JsonApiData'
      type: object
      properties:
        type:
          type: string
        id:
          type: string
        meta:
          $ref: '#/components/schemas/JsonApiMeta'
        attributes:
          type: object
        relationships:
          type: object
        links:
          $ref: '#/components/schemas/JsonApiLinks'
    JsonApiDataIdentifier:
      title: 'JsonApiDataIdentifier'
      type: object
      properties:
        meta:
          $ref: '#/components/schemas/JsonApiMeta'
        type:
          type: string
        id:
          type: string
    JsonApiLinks:
      title: 'JsonApiLinks'
      type: object
      properties:
        self:
          type: string
    JsonApiMeta:
      title: 'JsonApiMeta'
      type: object
      additionalProperties: true
    JsonApiIncluded:
      title: 'JsonApiIncluded'
      type: array
      items:
        $ref: '#/components/schemas/JsonApiData'
