  /materialsTable/{materialsTableId}/{rowId}/register:
    post:
      tags:
        - MaterialsTable
      summary: 'Register a material using data from the specified row in the materials table'
      description: |
        Register a material using data from the specified row in the materials table.
        
        A new material entry will be created based on the data from the selected row, subject to the following conditions:
        - All required fields for the material must be present before the entry can be registered.
        - Uniqueness checks will be performed in accordance with the rules specified in the materials table configuration.
        - If the row has already been registered, an exception will be raised to prevent duplication.
        - If registration is successful, the new material will be linked to the corresponding row.

        Please note that this action supports only the registration of materials from non-chemical
        material libraries (e.g., Antibodies, Cell Lines, etc.) and does not support the registration of materials from
        chemical material libraries (e.g., Compounds and Reagents (SNB)).

        Example usage:

        /materialsTable/materialsTable:e67efeb4-d702-4430-b654-b8408e63b4eb/01cdd910-a1af-40d7-b503-e08fba112dd4/register

      operationId: 'registerMaterialsTableRowById'
