      operationId: 'fetchBulkUpdateJobReport'
      description: |
        Get report of bulk update job.

        Available job status:
        - PENDING, the job is pending to run.
        - UPDATING, the job is running.
        - FAILED, the job is failed to run.
        - COMPLETED, the job is completed.

      parameters:
