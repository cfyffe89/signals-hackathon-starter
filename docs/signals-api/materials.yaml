    patch:
      tags:
        - MaterialsTable
      summary: 'Bulk update content of materials table'
      description: |
        Bulk update content of materials table.

        Adding new rows, updating existing rows and deleting existing rows are allowed.
        Updating column definition is NOT supported.

        Specify expected 'action' values in request body while adding/updating/deleting rows.

        There are 5 actions are accepted,
        - create, Add a new row. User needs to specify a material Id for the new row.
        - update, Update an existing row. Fields with the attribute `isMaterialField=true` can not be used for this action.
        - delete, Delete an existing row.
        - updateFromMaterials, update an existing row with the latest data of the related material.
        - updateToMaterials, update an existing row and its related material. 

        For updateToMaterials action,

        1. Only fields with the attribute `isMaterialField=true` can be used for this action.
        2. This action is only available for materials that are not chemical, such as Antibodies, Cell lines, etc.
        3. The row data must be up to date before using this action. Using `updateFromMaterials` action to update the row data first if the data is not up to date.
        4. This action must be performed one by one, not in bulk.

        Here are some example values for different field types,
        - number {"value": 3.0 }
        - date  {"value":"2019-09-06T15:22:47.309Z"}
        - text  {"value":"text1"}
        - boolean {"value": true}
        - unit {"value": "3.1415926 g" }
        - link {"value": "experiment:a2f9bba9-a4c7-9999-a676-251de965c234"}
        - link(multiple option) {"values": [
            {"eid": "experiment:a2f9bba9-a4c7-9999-a676-251de965c234"},
            {"eid": "experiment:9528e408-939e-4902-ad5e-f7a085f627ce"}
          ]}
        - externalLink {"display": "Google", "value": "http://www.google.com"}

        For inventory decrement:
        - The row can be deleted when Inventory Columns amounts are present, 
          the amount will not be returned to the container automatically.  
          User needs to update the amount to 0 first if he want to return the amount to the container.

        Example usage:

        /materialsTable/materialsTable:e67efeb4-d702-4430-b654-b8408e63b4eb
