  /materials/{libraryName}/assets:
    post:
      tags:
        - Materials
      summary: 'Create a new asset with batch'
      deprecated: false
      operationId: 'postNewAsset'
      description: |
        Create a new asset in a specified material library.

        The materials ID of the asset or batch is optional. If it is not specified at the time of creation, it will be automatically generated following the defined format in Signals Notebook.

        You can get library definitions by API "/materials/libraries". Here is an example of field definition:

            {
                "id": "5eaa8792b5ed583958f447c5",
                "name": "Copy Number",
                "dataType": "TEXT",
                "mandatory": false,
                "hidden": false,
                "definedBy": "SYSTEM_DEFAULT",
                "options": [
                    "High Copy"
                ],
                "collection": "LIST"
             }

        The meaning of main items is as following:

        - "id": The unique identity of a field, it will be the key of field in the body of request.
        - "name": The display name of this field.
        - "dataType": The data type of this field.
        - "mandatory": It can be "true" or "false", "true" means that this field value is required while creating an asset.
        - "collection": the element type of the options collection, such as "MULTI_SELECT", "LIST"
        - "options": The list of available values for this field.

        Example values for supported field data types:

        - "BOOLEAN" {"value": true}
        - "TEMPERATURE" {"value": {"rawValue": "12", "displayValue": "12 °C"}}
        - "DATETIME" {"value": "2020-07-06T16:00:00.000Z"}
        - "EXTERNAL_LINK" {"value": {"link": "https://www.example.com", "alias": "Example"}}
        - "ATTRIBUTE" {"value": "New"}
        - "LINK" {"value": {"eid": "batch:5ed8b35fa41afa9298674424"}}
        - "LINK" (multiple option) {"values": [{"eid": "batch:5ed8b35fa41afa9298674424"}]}
        - "MOLECULAR_FORMULA" {"value": {"rawValue": "C13H22", "displayValue": "C&lt;sub&gt;13&lt;/sub&gt;H&lt;sub&gt;22&lt;/sub&gt;"}}
        - "MULTI_SELECT" {"values": ["Bovine", "Broad"]}
        - "ATTACHED_FILE" {"value": {"filename": "example.png", "base64": "ZXhhbXBsZS5wbmcK"}}
        - "SEQUENCE_FILE" {"value": {"filename": "example.dna", "base64": "ZS5wbmcKZXhhbXBs"}}
        - "SUPPLIER_LIST" (name and country) {"value": {"name": "Aaron", "country": "USA"}}
        - "SUPPLIER_LIST" (supplier id) {"value": {"supplierId": "6eeb68bd-3777-4f9f-b8bf-df44020ba9a1"}}
        - "ONTOLOGY_LIST" (single select) {"value": {"id": 1234}}
        - "ONTOLOGY_LIST" (multiple select) {"values": [{"id": 1234}, {"id": 5678}]}
        
        For the "Chemical structure" field in the "Compounds" library, the data type is "CHEMICAL_DRAWING" and it is required.
        You can add the field value by embedding the CDXML file as a string during creation.
        Alternatively, you can add the field value using other chemical formats by including an additional "contentType" attribute.

        Here are some available content types:
        - `chemical/x-daylight-smiles`, example value, {"data": "C1CCCCC1", "contentType":"chemical/x-daylight-smiles"}
        - `chemical/x-inchi`, example value, {"data": "InChI=1S/C7H14/c1-2-4-6-7-5-3-1/h1-7H2", "contentType":"chemical/x-inchi"}
        - `chemical/x-helm`, example value, {"data": "CHEM1{C1CCCCC1 |$;;;;;;;$|}$$$$V2.0", "contentType":"chemical/x-helm"}
        - `chemical/x-cdxml`, example value, {"data": "<?xml version=\"1.0\" encoding=\"UTF-8\" ?><!DOCTYPE CDXML SYSTEM \"http://www.cambridgesoft.com/xml/cdxml.dtd\" ><CDXML......>.......</CDXML>", "contentType":"chemical/x-cdxml"}

        Refer to the example request body for details.

        For "display image" field of none "Compounds" and "Reagents (SNB)" material library, you can also set the value by
        another PATCH API "/materials/{eid}/image" after asset creation. "Compounds" and "Reagents (SNB)" have no display image.
        For details, you can refer to the document of API "/materials/{eid}/image".

        Both "Compounds" and "Reagents (SNB)" support fragments. The fragments in these two libraries are the same but in different positions.
        Fragments belong to the batch part of "Compounds" but belong to the asset part of "Reagents (SNB)".

      parameters:
        - $ref: '#/components/parameters/libraryNameParam'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/PostAssetRequest'
            examples:
              AssetTypeRequestBodyWithFragments:
                $ref: '#/components/examples/PostAssetRequest'
              ReagentsSnbWithFragments:
                $ref: '#/components/examples/PostReagentsSnbRequest'
              AssetWithSmilesStructure:
                $ref: '#/components/examples/PostAssetWithSmilesRequest'
      responses:
        '201':
          description: 'created'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/MaterialApiResponse'
              examples:
                Asset:
                  $ref: '#/components/examples/fetchingAssetResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '434':  
          $ref: '#/components/responses/RequestValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
