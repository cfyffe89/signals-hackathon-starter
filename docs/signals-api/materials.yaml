  /materials/{libraryName}/assets/uniquenessCheck:
    post:
      tags:
        - Materials
      summary: "Check whether the asset exists in the material library according to the uniqueness rule"
      deprecated: false
      operationId: 'uniquenessCheckAsset.'
      description: |
        Find and return duplicate assets according to the uniqueness rules defined in the material library.

        This API can be used to check whether a similar asset exists or not before creation.
        For this purpose, the request body is as same as the creation one.

        #### Field definition
        You can get library definitions by API "/materials/libraries". Here is an example of field definition:

            {
                "id": "5eaa8792b5ed583958f447b8",
                "name": "Plasmid Name",
                "dataType": "TEXT",
                "mandatory": true,
                "hidden": false,
                "definedBy": "SYSTEM_DEFAULT"
             }

        The meaning of each item as following:

        - "id": The unique identity of a field, it will be the key of field in the body of request.
        - "name": The display name of this field.
        - "dataType": The data type of this field.
        - "mandatory": It can be "true" or "false", "true" means that this field value is required while creating an asset.
        - "hidden": It can be "true" or "false", "true" means that this field is invisible in UI.
        - "definedBy": The user who defined this field.

        #### Value examples
        Example values for supported field data types:

        - "BOOLEAN": true/false
        - "TEMPERATURE": {"rawValue": "12", "displayValue": "12 °C"}
        - "DATETIME": "2020-07-06T16:00:00.000Z"
        - "EXTERNAL_LINK": {"link": "https://www.example.com", "alias": "Example"}
        - "ATTRIBUTE": "New"
        - "LINK": {"eid": "batch:5ed8b35fa41afa9298674424"}
        - "LINK"(multiple option): [{"eid": "batch:5ed8b35fa41afa9298674424"}]
        - "MOLECULAR_FORMULA": {"rawValue": "C13H22", "displayValue": "C&lt;sub&gt;13&lt;/sub&gt;H&lt;sub&gt;22&lt;/sub&gt;"}
        - "MULTI_SELECT": ["Bovine", "Broad"]
        - "ATTACHED_FILE": {"filename": "example.png", "base64": "ZXhhbXBsZS5wbmcK"}
        - "SEQUENCE_FILE": {"filename": "example.dna", "base64": "ZS5wbmcKZXhhbXBs"}
        - "SUPPLIER_LIST" (name and country): {"name": "Aaron", "country": "USA"}
        - "SUPPLIER_LIST" (supplier id): {"supplierId": "6eeb68bd-3777-4f9f-b8bf-df44020ba9a1"}

        For the `Chemical structure` field in the `Compounds` library:

        The data type is CHEMICAL_DRAWING, and the field is required.
        - You can provide the field value by embedding a CDXML file as a string during creation.
        - Alternatively, you may use other chemical formats by including an additional "contentType" attribute to specify the format.

        Here are some supported values for the `contentType` attribute:
        - `chemical/x-daylight-smiles`, example value, {"data": "C1CCCCC1", "contentType":"chemical/x-daylight-smiles"}
        - `chemical/x-inchi`, example value, {"data": "InChI=1S/C7H14/c1-2-4-6-7-5-3-1/h1-7H2", "contentType":"chemical/x-inchi"}
        - `chemical/x-helm`, example value, {"data": "CHEM1{C1CCCCC1 |$;;;;;;;$|}$$$$V2.0", "contentType":"chemical/x-helm"}
        - `chemical/x-cdxml`, example value, {"data": "<?xml version=\"1.0\" encoding=\"UTF-8\" ?><!DOCTYPE CDXML SYSTEM \"http://www.cambridgesoft.com/xml/cdxml.dtd\" ><CDXML......>.......</CDXML>", "contentType":"chemical/x-cdxml"}

        For more details, refer to the example request body.

        #### Meaning of the result
        - None empty, if the asset is not unique, this API will return the duplicated assets.
        - Empty("\{\}"), if the asset is unique, this API will return an empty value.

      parameters:
        - $ref: '#/components/parameters/libraryNameParam'
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/offsetParam'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/UniquenessCheckRequest'
            examples:
              UniquenessCheck:
                $ref: '#/components/examples/PostAssetRequest'
              UniquenessCheckWithSmilesStructure:
                $ref: '#/components/examples/PostAssetWithSmilesRequest'
      responses:
        '200':
          description: 'ok'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/MaterialListApiResponse'
              examples:
                uniquenessCheckResponse:
                  $ref: '#/components/examples/uniquenessCheckResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '434':  
          $ref: '#/components/responses/RequestValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
