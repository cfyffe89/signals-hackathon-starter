  /materials/{libraryName}/bulkUpdate:
    post:
      tags:
        - Materials
      summary: 'Bulk update materials'
      deprecated: false
      operationId: 'bulkUpdateMaterials'
      description: |
        Bulk update materials of a specified material library.

        Currently, this API support update data with ZIP file.
        The ZIP file should contain a summary SDF file or CSV file and attachments.
        The chemical libraries, such as, Compounds, Reagents (SNB), support SDF summary file. Others support CSV summary file.
        Refer to the GET API "/materials/{libraryName}/bulkUpdate/example" to download the example ZIP file.

        The column name in each records of SDF/CSV file should match the asset field name.
        In SDF file, it doesn't support character '-', '.', '<', '>', '=', '%', ' ', please replace them to '_' in records.
        For example, '% active' field in Compounds should be mapped to ‘__active’ column in SDF file which prepare to update.

        For multi select fields, we will separate values in "\n", please add values as "val1\nval2\nval3".

        In the exported or example file, the internal reference value is divided into two parts: “name” and “link”. 
        When importing data, only the information in the “name” column will be considered. However, if needed, 
        the data from the “link” column can be transferred to the “name” column for update purposes. 
        For instance, both “Experiment-0001” and “https://signalsresearch.revvitycloud.net/elements/entity/experiment:xxxxx-xxxx-xxxxx-xxxx” 
        are acceptable for import as internal references. If desired, the “link” column can be omitted from the example file.

        Notes:

        This is an asynchronous API.

        If the request is accepted, server will start a job to update the materials asynchronously and return a report with a job ID to client.

        Client can check the status of the job with API "/materials/bulkUpdate/jobs/{jobId}".

        If the update work is finished with failures, client can download the details with API "/materials/bulkUpdate/jobs/{jobId}/failures";

        While the job is finished(either completed or failed), client can select to delete the report in server with API "/materials/bulkUpdate/jobs/{jobId}".
        Otherwise the report will stay in server for a long time.

        All the columns in the request SDF/CSV file will be updated except the auto-calculated columns.
        Please remove the other columns from the upload file if want to update some special columns only.

        Max request body size: 300MiB.

      parameters:
        - $ref: '#/components/parameters/libraryNameParam'
        - name: 'applyNullValue'
          in: query
          description: |
            If true, values in non-required fields will be cleared if the value uploaded is empty.
          schema:
            type: boolean
            default: false
            deprecated: false
      requestBody:
        required: true
        content:
          application/zip:
            schema:
              type: string
              format: binary
      responses:
        '202':
          description: 'Accepted'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/MaterialBulkUpdateReportApiResponse'
              examples:
                JobInProcess:
                  $ref: '#/components/examples/bulkUpdateMaterialsInProcessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '434':  
          $ref: '#/components/responses/RequestValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /materials/bulkUpdate/jobs/{jobId}:
    get:
      tags:
