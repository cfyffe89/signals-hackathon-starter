openapi: 3.0.1
info:
  title: 'Signals Notebook APIs Document'
  version: v1.0
servers:
  - url: '/api/rest/v1.0'
    description: 'Signals Notebook'
security:
  - api_key: [ ]
paths:
  /materials/libraries:
    get:
      tags:
        - Materials
      summary: 'Fetch all active material libraries'
      description: |
        Fetch all active material libraries.

        Optionally filter by library name using the `name` query parameter to
        return details for a single material library.
      operationId: 'fetchAllActiveMaterialLibraries'
      deprecated: false
      parameters:
        - in: query
          name: name
          required: false
          schema:
            type: string
          description: |
            Optional library name to filter by. When provided, only the matching
            material library is returned. Defaults to empty (returns all libraries).
            Matching is case-insensitive.
      responses:
        '200':
          description: "ok"
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/MaterialLibraryListApiResponse'
              examples:
                AssetTypes:
                  $ref: '#/components/examples/AllAssetTypeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '434':  
          $ref: '#/components/responses/RequestValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /materials/{eid}:
    get:
      tags:
        - Materials
      summary: 'Fetch material by entity ID'
      description: |
        Fetch material by entity ID.

        Accepted material types: asset, assetType and batch.

        Example usages:
          - Fetch asset material.

            /materials/asset:1234567
          - Fetch batch material.

            /materials/batch:1234567
      operationId: 'fetchMaterialByEntityId'
      parameters:
        - $ref: '#/components/parameters/materialEntityIdParam'
        - $ref: '#/components/parameters/materialFieldsParam'
        - $ref: '#/components/parameters/includeParam'
        - $ref: '#/components/parameters/materialStructureFormatParam'
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/MaterialApiResponse'
              examples:
                Asset:
                  $ref: '#/components/examples/fetchingAssetResponse'
                Batch:
                  $ref: '#/components/examples/fetchingBatchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '434':  
          $ref: '#/components/responses/RequestValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
    patch:
      tags:
        - Materials
      summary: 'Update Fragments or Synonyms of a specified material'
      description: |
        Update Fragments or Synonyms of a specified material.

        This API can be used to modify Fragments or Synonyms.

        In Reagents (SNB) library asset supports updating of both Synonyms and Fragments.

        In other libraries asset supports updating Synonyms, and batch supports updating Fragments.

        In the Normalized Compounds library, fragments that are auto-calculated from chemical structure(with the property calculated=true) cannot be edited.
        Do not include them in your request - the system will add them automatically.

        Accepted material types: asset, batch.

      operationId: 'patchMaterialFragmentsSynonyms'
      parameters:
        - $ref: '#/components/parameters/assetBatchIdParam'
        - name: 'digest'
          in: query
          description: >
            Indicate digest of material.
            It is used to avoid conflict while concurrent editing.
            If the parameter 'force' is true, this parameter is ignored.
            If the parameter 'force' is false, this parameter is required.
          schema:
            type: string
            deprecated: false
        - name: 'force'
          in: query
          description: >
            Force to update properties without digest check.
          schema:
            type: boolean
            deprecated: false
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/UpdateFragmentsSynonymsRequest'
            examples:
              updateSynonyms:
                $ref: '#/components/examples/assetSynonymsPatchRequest'
              updateFragments:
                $ref: '#/components/examples/batchFragmentsPatchRequest'
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/MaterialApiResponse'
              examples:
                Asset:
                  $ref: '#/components/examples/fetchingAssetResponse'
                Batch:
                  $ref: '#/components/examples/fetchingBatchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/DigestMismatch'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '434':  
          $ref: '#/components/responses/RequestValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
  /materials/{eid}/properties:
    get:
      tags:
        - Materials
      summary: 'Fetch properties of a specified material'
      description: |
        Fetch properties of a specified material.

        Accepted entity types: asset, batch.

        Example usages:
          - Fetch properties of an asset.

            /materials/asset:1234567/properties
          - Fetch properties of a batch.

            /materials/batch:1234567/properties
      operationId: 'fetchMaterialPropertiesByMaterialId'
      parameters:
        - $ref: '#/components/parameters/assetBatchIdParam'
        - $ref: '#/components/parameters/enrichSequenceParam'
        - $ref: '#/components/parameters/valueFormatParam'
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/MaterialPropertyListApiResponse'
              examples:
                AssetProperties:
                  $ref: '#/components/examples/assetPropertiesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '434':  
          $ref: '#/components/responses/RequestValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
    patch:
      tags:
        - Materials
      summary: 'Update properties of a specified material'
      description: |
        Update properties of a specified material.

        This API can be used to modify existing properties but can NOT be used to add new property. 

        Accepted material types: asset, batch.

        To get IDs of ontologyList type fields, please refer to /attributes/{attributeEid}/ontology/options.

        Here are some example values for different property types,
        - date  {"value": "2019-09-06T15:22:47.309Z"}
        - text  {"value": "text1"}
        - boolean {"value": true}
        - PERCENTAGE {"value": {"displayValue":"3 %", "rawValue":"3"}}
        - MASS {"value": {"displayValue":"3 g", "rawValue":"3"}}
        - link {"value": {"eid": "experiment:a2f9bba9-a4c7-9999-a676-251de965c234"}}
        - link(multiple option) {"values": [{"eid": "experiment:a2f9bba9-a4c7-9999-a676-251de965c234"}]}
        - external_link {"value": {"link":"http://www.google.com","alias":"google"}}
        - attributeList(multiple option) {"values": ["select1", "select2"]}
        - ontologyList(single select) {"value": {"id": 1234}}
        - ontologyList(multiple select) {"values": [{"id": 1234}, {"id": 5678}]}
        - multi_select {"values": ["select1", "select2"]}
        - attached_file {"value": {"filename": "example.png", "base64": "ZXhhbXBsZS5wbmcK"}}
        - sequence_file {"value": {"filename": "example.dna", "base64": "ZS5wbmcKZXhhbXBs"}}
        - SUPPLIER_LIST (name and country) {"value": {"name": "Aaron", "country": "USA"}}
        - SUPPLIER_LIST (supplier id) {"value": {"supplierId": "6eeb68bd-3777-4f9f-b8bf-df44020ba9a1"}}

        To clear the value of a property:
        - For single-select fields: {"value": null}
        - For multi-select fields: {"values": []}

      operationId: 'patchMaterialProperties'
      parameters:
        - $ref: '#/components/parameters/assetBatchIdParam'
        - name: 'digest'
          in: query
          description: >
            Indicate digest of material.
            It is used to avoid conflict while concurrent editing.
            If the parameter 'force' is true, this parameter is ignored.
            If the parameter 'force' is false, this parameter is required.
          schema:
            type: string
            deprecated: false
        - name: 'force'
          in: query
          description: >
            Force to update properties without digest check.
          schema:
            type: boolean
            deprecated: false
        - $ref: '#/components/parameters/valueFormatParam'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/UpdateMaterialPropertiesRequest'
            examples:
              AssetProperties:
                $ref: '#/components/examples/entityPropertiesPatchRequest'
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/MaterialPropertyListApiResponse'
              examples:
                AssetProperties:
                  $ref: '#/components/examples/assetPropertiesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/DigestMismatch'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '434':  
          $ref: '#/components/responses/RequestValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
  /materials/{eid}/drawing:
    get:
      tags:
        - Materials
      summary: 'Export chemical drawing of a chemical material'
      description: |
        Export chemical drawing or image of a specified chemical material, such as Compounds and Reagents (SNB).

        Accepted material types: asset, batch.

        Parameter 'format' is used to define the output type of chemical drawing.

        Accepted values:
        1. cdxml, will export drawing as CDXML file.
        2. svg, will export drawing as SVG file.
        3. mol, will export drawing as V2000 MOL file.
        4. mol-v3000, will export drawing as V3000 MOL file.
        5. smiles, will export drawing as SMILES file.
        6. inchi, will export drawing as InChi file.

        Except 'format', another parameter, 'Accept' in header, is also supported.
        Accepted values of 'Accept':
        1. image/svg+xml, will export drawing as SVG file.
        2. chemical/x-cdxml, will export drawing as CDXML file.
        3. chemical/x-mdl-molfile, will export drawing as V2000 molfile.
        4. chemical/mdl-molfile, will export drawing as V2000 molfile.
        5. chemical/x-mdl-molfile-v3000, will export drawing as V3000 molfile.
        6. chemical/mdl-molfile-v3000, will export drawing as V3000 molfile.
        7. chemical/x-daylight-smiles, will export drawing as SMILES file.
        8. chemical/x-inchi, will export drawing as InChi file.
        9. \*/\*, get format from parameter 'format' then export.
        10. application/octet-stream, get format from parameter 'format' then export.
        11. (blank), get format from parameter 'format' then export.
      operationId: 'exportMaterialChemicalDrawingOrImage'
      parameters:
        - $ref: '#/components/parameters/assetBatchIdParam'
        - name: 'format'
          in: query
          description: 'Output type of chemical drawing.'
          schema:
            type: string
            enum: [ cdxml, inchi, mol, mol-v3000, smiles, svg ]
            description: ''
            default: 'cdxml'
            format: ''
            maxLength: 99
            deprecated: false
        - $ref: '#/components/parameters/aromaticRepresentationParam'
        - $ref: '#/components/parameters/mol3000LabelsParam'
      responses:
        '200':
          description: 'OK'
          content:
            application/octet-stream:
              schema:
                description: 'Return chemical drawing or image as binary stream'
                type: string
                format: binary
              example: '(no example available)'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '434':  
          $ref: '#/components/responses/RequestValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
    patch:
      tags:
        - Materials
      summary: 'Patch chemical structure to a chemical material'
      description: |
        Upload a file to chemical material(such as Compounds and Reagents (SNB)) as structure.

        Accepted material types: asset,batch.
        
        The content type of the structure file is inferred from the `Content-Type` header.
        
        Accepted values of `Content-type`: 
        - chemical/x-cdxml
        - chemical/x-daylight-smiles
        - chemical/x-inchi
        - chemical/x-helm
        - application/octet-stream, get content type from parameter 'filename' (works only with cdxml file).

      operationId: 'patchStructureToCompounds'
      parameters:
        - $ref: '#/components/parameters/assetBatchIdParam'
        - name: 'filename'
          in: header
          description: |
            Specifies the name of the file being uploaded.

            Filename is required when uploading a CDXML file with Content-Type: application/octet-stream, and it must end with the .cdxml extension.
            For all other content types, this parameter is ignored.

          required: false
          schema:
            type: string
            description: ''
            format: ''
            maxLength: 1000
            deprecated: false
        - name: 'chemicalName'
          in: query
          description: |
            Set chemical name for Compounds. If not set, a calculated name will be used.

            Note: The batch chemical name of a normalized compound cannot be set using this `chemicalName` query parameter.
          required: false
          schema:
            type: string
            description: ''
            format: ''
            maxLength: 99
            deprecated: false
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
          "chemical/x-cdxml":
            schema:
              type: string
              format: binary
          "chemical/x-daylight-smiles":
            schema:
              type: string
            example: 'C1CCCCC1'
          "chemical/x-inchi":
            schema:
              type: string
            example: 'InChI=1S/C7H14/c1-2-4-6-7-5-3-1/h1-7H2'
          "chemical/x-helm":
            schema:
              type: string
            example: 'CHEM1{C1CCCCC1 |$;;;;;;;$|}$$$$V2.0'
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/FetchingMaterialByIdResponse'
              examples:
                Asset:
                  $ref: '#/components/examples/fetchingAssetResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '434':  
          $ref: '#/components/responses/RequestValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
  /materials/{eid}/image:
    get:
      tags:
        - Materials
      summary: 'Export display image of a non-chemical/non-bio material'
      description: |
        Export image of a specified non-chemical/non-bio material, such as Antibodies and Equipment.

        Accepted material types: asset, batch.
      operationId: 'exportMaterialImage'
      parameters:
        - $ref: '#/components/parameters/assetBatchIdParam'
      responses:
        '200':
          description: 'OK'
          content:
            application/octet-stream:
              schema:
                description: 'Return image as binary stream'
                type: string
                format: binary
              example: '(no example available)'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '434':  
          $ref: '#/components/responses/RequestValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
    patch:
      tags:
        - Materials
      summary: 'Patch image to a non-chemical/non-bio material'
      description: |
        Upload a file to a specified non-chemical/non-bio material(such as Antibodies and Equipment) as display image.
        
        If image size is lager than 5MB, the image will be resized to less than 5MB by reduce the height/width.

        Accepted material types: asset.
      operationId: 'patchImageToAsset'
      parameters:
        - $ref: '#/components/parameters/assetBatchIdParam'
        - $ref: '#/components/parameters/materialAttachmentParam'
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
          "image/*":
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/FetchingMaterialByIdResponse'
              examples:
                Asset:
                  $ref: '#/components/examples/fetchingAssetResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '434':  
          $ref: '#/components/responses/RequestValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
    delete:
      tags:
        - Materials
      summary: 'Delete image from a non-chemical/non-bio material'
      description: |
        Delete display image of a specified non-chemical/non-bio material(such as Antibodies and Equipment).

        Accepted material types: asset.
      operationId: 'deleteImageFromAsset'
      parameters:
        - $ref: '#/components/parameters/assetBatchIdParam'
      responses:
        '204':
          description: 'OK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/DigestMismatch'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '434':  
          $ref: '#/components/responses/RequestValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
  /materials/{eid}/bioSequence:
    get:
      tags:
        - Materials
      summary: 'Export biological sequence file of a bio-material'
      description: |
        Export biological sequence file of a specified bio-material, such as DNA, RNA and Protein.

        Accepted material types: asset, batch.
      operationId: 'fetchBioSequence'
      parameters:
        - $ref: '#/components/parameters/assetBatchIdParam'
        - name: 'format'
          in: query
          description: 'Output type of biological sequence file.'
          schema:
            type: string
            enum: [ gb, fa ]
            description: ''
            default: ''
            format: ''
            maxLength: 99
            deprecated: false
      responses:
        '200':
          description: 'OK'
          content:
            application/octet-stream:
              schema:
                description: 'Return sequence file as binary stream'
                type: string
                format: binary
              example: '(no example available)'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '434':  
          $ref: '#/components/responses/RequestValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false

  /materials/{eid}/attachments/{fieldId}:
    get:
      tags:
        - Materials
      summary: 'Export an attachment for a specified field of the specific material'
      description: |
        Export an attachment for a specified field of the specific material.

        Accepted material types: asset, batch.
      operationId: 'exportMaterialAttachment'
      parameters:
        - $ref: '#/components/parameters/assetBatchIdParam'
        - $ref: '#/components/parameters/assetBatchFieldIdParam'
      responses:
        '200':
          description: 'OK'
          content:
            application/octet-stream:
              schema:
                description: 'Return attachment as binary stream'
                type: string
                format: binary
              example: '(no example available)'
        '400':
          $ref: '#/components/responses/BadRequest'
