  /materials/{libraryName}/bulkExport:
    post:
      tags:
        - Materials
      summary: 'Export materials of specified material library'
      deprecated: false
      operationId: 'bulkExportMaterials'
      description: |
        Export materials of the specified material library into a CSV/SDF/ZIP file asynchronously.

        The request body with specified material IDs is optional.
        If the request body is not provided, all materials in the library will be exported.

        Material IDs can be specified in the request body to export specific materials.
        Material IDs can be either asset ID or batch ID, they are the names of the specific materials.
        For example, "000001" can be the material ID of an asset or "000001-0001" can be the material ID of a batch.
        The max count of the specific materials to be exported in the request body is 5000.
        The parameter "limit" and "startAfter" will be omitted if the request body with specified material IDs is provided,
        as the count is determined by the request body in this case.

        Here are the supported export file types:
        - **SDF:** default export content format for chemical aware libraries and it's only for chemical libraries.
        - **CSV:** default export content format for non-chemical aware libraries and it's for all libraries.
        - **ZIP:** To export materials into a zip archive, which will contains all sequence file and attachments 
        and it's only for non-chemical libraries.

        If you want to export chemical materials into CSV file and convert the chemical structure to SMILES, InChI, HELM format, 
        you can specify 'fileType' and 'chemFormat' in the query parameters.

        Notes:

        This is an asynchronous API.

        If the request is accepted, server will start a job to export the materials batch by batch asynchronously.
        And server will return a report with file ID and report ID to client.

        Client can use one of below APIs to check the status of current export.
        - HEAD "/materials/bulkExport/download/{fileId}"
        - GET "/materials/bulkExport/reports/{reportId}"

        Example usage:
        1. Start an export job by POSTing "/materials/{libraryName}/bulkExport".
        2. Query the status with HEADing "/materials/bulkExport/download/{fileId}" every 5 seconds till content-length is not 0 in response header.

           Or, query the status with GETing "/materials/bulkExport/reports/{reportId}" every 5 seconds till the status is "COMPLETED" in the response body.
        3. Download the file with GETing "/materials/bulkExport/download/{fileId}".

        The maximum file size is 100MB. The maximum count is 25000 assets.

        If the count limit or file size limit is reached, the user can continue the export job using the "nextExport" link in the report.

      parameters:
        - $ref: '#/components/parameters/libraryNameParam'
        - name: 'fileType'
          in: query
          required: false
          allowEmptyValue: true
          description: |
            Specifies the exported file type for the exported content.
            
            - **SDF:** For chemical-aware libraries only.
            - **CSV:** For all libraries.
            - **ZIP:** for non-chemical libraries.
            
            If exporting to CSV, you can specify the chemical structure format using the `chemFormat` parameter.
            
            Default for chemical library is SDF and other library is CSV.
          schema:
            type: string
            enum: [ "SDF", "CSV", "ZIP"]
            deprecated: false
            default: null
        - name: 'chemFormat'
          in: query
          required: false
          allowEmptyValue: true
          description: |
