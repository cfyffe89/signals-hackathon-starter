  /inventory/containers/status/{action}/bulk:
    post:
      tags:
        - Inventory
      summary: 'Bulk update containers status'
      description: |
        Bulk update containers status.

        The accepted actions are,
        - dispose
        - finalDispose
        - restore
        - checkout
        - checkin

        Notes:
        - The location information is required for checkout and checkin. 
        - The location IDs should be same in one request if provided.
        - The owner information is optional for checkout and checkin.
        - The owner IDs should be same in one request if provided.
        - The dispose, finalDispose, and restore operations do not require location or owner information. 
        - For finalDispose, this action cannot be undone, and no further actions can be performed on the container(s),
        including changing location.
        - If the container is updated successfully, the updated container is returned in the response.
        - If the container update fails, an error message is returned in the response.

      operationId: 'bulkUpdateInventoryContainerStatus'
      parameters:
        - $ref: '#/components/parameters/statusActionParam'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/BulkUpdateContainerStatusRequest'
            examples:
              BulkDisposeContainer:
                $ref: '#/components/examples/bulkDisposeContainerExample'
              BulkRestoreContainer:
                $ref: '#/components/examples/bulkRestoreContainerExample'
              BulkCheckoutContainer:
                $ref: '#/components/examples/bulkCheckoutContainerExample'
              BulkCheckinContainer:
                $ref: '#/components/examples/bulkCheckinContainerExample'
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/JsonApiResponse'
              examples:
                RestoreContainers:
                  $ref: '#/components/examples/bulkRestoreContainersResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '435':
