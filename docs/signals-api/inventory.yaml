  /inventory/types:
    get:
      tags:
        - Inventory
      summary: 'Get types of inventory'
      description: |
        Get types of inventory.

      operationId: 'fetchAllInventoryTypes'
      parameters:
        - name: entityType
          in: query
          description: |
            Entity types of inventory type: location or container.
          required: true
          allowEmptyValue: false
          schema:
            type: string
            enum: [ 'location','container' ]
            description: ''
            format: ''
            pattern: '^.+$'
            maxLength: 99
            deprecated: false
        - $ref: '#/components/parameters/offsetParam'
        - $ref: '#/components/parameters/limitParam'
      responses:
        '200':
          description: 'OK'
          content:
