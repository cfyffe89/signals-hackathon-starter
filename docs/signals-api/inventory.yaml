  /inventory/containers/bulkExport:
    post:
      tags:
        - Inventory
      summary: 'Export containers'
      description: |
        Create a job to export containers.

        - Server will create an async job to export container data.
        - Client can check the status with `GET /inventory/containers/bulkExport/jobs/{jobId}/status`.
        - Report can be downloaded from `GET /inventory/containers/bulkExport/jobs/{jobId}/report` after job status is DONE.

        Request body is required and should be in JSON:API format.

        1. `barcodes` is optional. If provided, only the containers corresponding to the specified barcodes will be considered for export.

        If no barcodes are provided, all containers that match the specified filters will be included in the export.
        Any barcodes that do not correspond to existing containers will be ignored.

        2. `filters` is optional. If provided, all containers that match the specified filters will be exported.

        Supports filtering by 'Container Type', 'Status', 'Location', 'Content Entity Type' and 'Material Library'.
        All of these filters are optional, and any combination of them can be used to narrow down the export results.
        Filters are also applied to any barcodes provided in the request. If a barcode is specified but the corresponding container does not match the filters, that barcode will be ignored.
        - 'Container Type': Accepts a list of container type names. Examples: Bag, Can, Tube, Vial.
        - 'Status': Accepts a list of container status names. Examples: AVAILABLE, IN_USE, EXHAUSTED, DISPOSED, FINAL_DISPOSED.
        - 'Location': Accepts a list of location paths. Examples: /location0001, /location0002/sub1.
        'includeSublocations' determines whether containers in sub-locations of the specified locations are included. Defaults to false.
        For grid locations, grid coordinate information must not be included in the path. For example, if the location is "Grid4x5 (A5)/SubLoc", the effective path is "Grid4x5/SubLoc". The "(A5)" portion represents only the grid coordinates and should be excluded from the path.
        - 'Content Entity Type': Filters containers by the type of entity from which they were created. Examples: sample, asset, batch.
        - 'Material Library': Filters containers by material library. Accepts one or more material library names (case-insensitive). Only containers associated with assets or batches belonging to the specified material libraries will be included. Examples: Compounds, Antibodies.

        3. `fields` is required. Only the fields listed in this parameter will be included in the exported output. At least one field must be specified.

        The name property in a field definition is required and specifies the name of the field to be included in the export.
        The source property in a field definition is required and specifies the entity from which the field value is retrieved.

        Supported values for source are:  
        - container, the field is sourced from the container entity.
        - material, the field is sourced from the material entity.
        - sample, the field is sourced from the sample entity.

        Notes:
        - The maximum number of containers allowed in a single export job is 600,000.
        If the total number of containers matching the export criteria exceeds this limit, the export request will be rejected.
        To proceed, apply additional filters or provide a narrower barcode list to reduce the number of containers included in the export.

      operationId: 'postContainerBulkExport'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/ExportBulkContainerRequest'
            examples:
              BulkExportContainers:
                $ref: '#/components/examples/bulkExportContainersRequestExample'
              ExportAllAvailableContainers:
                $ref: '#/components/examples/exportAllAvailableContainersRequestExample'
      parameters:
        - $ref: '#/components/parameters/bulkExportContainerFileTypeParam'
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ExportBulkContainerJobResponse'
              examples:
                ExportContainers:
                  $ref: '#/components/examples/exportBulkContainerJobDetailsExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '415':
          description: 'Unsupported media type'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '445':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false

