  /inventory/containers:
    post:
      tags:
        - Inventory
      summary: 'Create a new container'
      description: |
        Create a new container.

        - typeId, the id of a container type. The definition of container type can be fetched by /inventory/types.
          All the fields which marked as 'required' in the type, must be provided.
        - To get select options of attributeList type fields, please refer to /attributes/{attributeEid}.
        - To get IDs of ontologyList type fields, please refer to /attributes/{attributeEid}/ontology/options.
        - The related content entity can be one of Sample, Batch or Unique-Asset(asset without batch).

        Here are some example values for different property types,
        - number {"value": 3.0 }
        - date  {"value":"2019-09-06T15:22:47.309Z"}
        - text  {"value":"text1"}
        - list  {"value": "list1"}
        - multiSelectList {"values": ["select1", "select2"]}
        - ontologyList(single select) {"value": {"id": 1234}}
        - ontologyList(multiple select) {"values": [{"id": 1234}, {"id": 5678}]}
        - boolean {"value": true}
        - unit {"value": 3.1415926, "user": "3.14 g"} or {"value": "3.14 g"}
        - unit(var measure) {"value": "2 g"}
        - link {"value": "experiment:a2f9bba9-a4c7-9999-a676-251de965c234"}
        - link(multiple option) {"values": [
            {"eid": "asset:a2f9bba9-a4c7-9999-a676-251de965c234"},
            {"eid": "asset:9528e408-939e-4902-ad5e-f7a085f627ce"}
          ]}
        - externalLink {"user": "Google", "value": "http://www.google.com"}
        - user {"user" : "101"}
        - supplierList (name and country) {"user": {"name": "APIchem", "country": "China"}}
        - supplierList (supplier id) {"user": {"supplierId" : "09428b63-f726-4202-b347-6da39874a3bf"}}

      operationId: 'postNewInventoryContainer'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
