      summary: 'Move location'
      description: |
        This asynchronous API allows relocation of sub-locations with the “movable” property set to true, along with their sub-locations and containers, to a new parent location.
        Upon request acceptance, a background job starts, and a jobId is returned for status tracking. Use the jobId to monitor progress and download a report via API once complete.
        - The job status can be checked with API "/inventory/locations/jobs/movement/{jobId}".
        - The job report can be download with API "/inventory/locations/jobs/movement/{jobId}/report" after job finished.

        The "sourceLocationId", "destinationLocationId" are needed in the request body.


        The "gridPosition" is needed in the body only if the destination location type is `Grid Layout`, you can input such as "A1" or "C4".

