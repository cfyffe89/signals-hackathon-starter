openapi: 3.0.1
info:
  title: 'Signals Notebook APIs Document'
  version: v1.0
servers:
  - url: '/api/rest/v1.0'
    description: 'Signals Notebook'
security:
  - api_key: [ ]

paths:
  /inventory/locations:
    post:
      tags:
        - Inventory
      summary: 'Create a new location'
      description: |
        Create a new location.

        - name, the unique name of the location.
        - typeId, the id of a location type. The definition of location type can be fetched by /inventory/types.
          All the fields which marked as 'required' in the type, must be provided.
        - ancestors, the ids of parent location. Example value,
          [{"id":"0e62e931-c33d-4688-af54-5ed5fd85b147"}].
        - To get select options of attributeList type fields, please refer to /attributes/{attributeEid}.
        - To get IDs of ontologyList type fields, please refer to /attributes/{attributeEid}/ontology/options.

        Here are some example values for different property types,
        - number {"value": 3.0 }
        - date  {"value":"2019-09-06T15:22:47.309Z"}
        - text  {"value":"text1"}
        - list  {"value": "list1"}
        - multiSelectList {"values": ["select1", "select2"]}
        - ontologyList(single select) {"value": {"id": 1234}}
        - ontologyList(multiple select) {"values": [{"id": 1234}, {"id": 5678}]}
        - boolean {"value": true}
        - unit {"value": 3.1415926} or {"value": "3.14 g"}
        - unit(var measure) {"value": "2 g"}
        - link {"value": "experiment:a2f9bba9-a4c7-9999-a676-251de965c234"}
        - link(multiple option) {"values": [
            {"eid": "asset:a2f9bba9-a4c7-9999-a676-251de965c234"},
            {"eid": "asset:9528e408-939e-4902-ad5e-f7a085f627ce"}
          ]}
        - externalLink {"user": "Google", "value": "http://www.google.com"}

      operationId: 'postNewInventoryLocation'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/AddLocationRequest'
            examples:
              NewLocation:
                $ref: '#/components/examples/addLocationExample'
      responses:
        '201':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/IvtLocationApiResponse'
              examples:
                Location:
                  $ref: '#/components/examples/getLocationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '435':
          $ref: '#/components/responses/UnknownException'
        '436':
          $ref: '#/components/responses/MissingOrInvalidInput'
        '437':
          $ref: '#/components/responses/NoSuchEntity'
        '438':
          $ref: '#/components/responses/EntityTrashed'
        '439':
          $ref: '#/components/responses/MissingPrivilege'
        '440':
          $ref: '#/components/responses/MissingPermission'
        '441':
          $ref: '#/components/responses/InvalidAction'
        '442':
