components:
  securitySchemes:
    api_key:
      type: apiKey
      in: header
      name: 'x-api-key'
  parameters:
    locationId:
      name: 'locationId'
      in: path
      description: |
        ID of location. Format: {uuid}.

        Example value: "fc87f321-6b74-4046-bde0-0e1cf18bd8ce".
      required: true
      allowEmptyValue: false
      schema:
        type: string
        description: ''
        format: ''
        pattern: '^.+$'
        maxLength: 1000
        deprecated: false
    orderIdParam:
      name: 'orderId'
      in: path
      description: |
        Unique order identifier. Format: EID.

        Example value: "order:fc87f321-6b74-4046-bde0-0e1cf18bd8ce".
      required: true
      allowEmptyValue: false
      schema:
        type: string
        description: ''
        format: ''
        maxLength: 1000
        deprecated: false
    containerId:
      name: 'containerId'
      in: path
      description: |
        ID of container. Format: EID.

        Example value: "fc87f321-6b74-4046-bde0-0e1cf18bd8ce".
      required: true
      allowEmptyValue: false
      schema:
        type: string
        description: ''
        format: ''
        pattern: '^.+$'
        maxLength: 1000
        deprecated: false
    attachmentFieldId:
      name: 'fieldId'
      in: path
      description: |
        ID of attachment field. Format: {uuid}.

        Example value: "fc87f321-6b74-4046-bde0-0e1cf18bd8ce".
      required: true
      allowEmptyValue: false
      schema:
        type: string
        description: ''
        format: ''
        pattern: '^.+$'
        maxLength: 1000
        deprecated: false
    attachmentFileNameParam:
      name: 'filename'
      in: query
      description: 'Indicate file name of attachment'
      required: true
      schema:
        type: string
        description: ''
        format: ''
        maxLength: 1000
        deprecated: false
    plateContainerId:
      name: 'plateContainerId'
      in: path
      description: |
        Unique Plate Container identifier. Format: EID.

        Accepted entity types: plateContainer.

        Example value: "plateContainer:fc87f321-6b74-4046-bde0-0e1cf18bd8ce".
      required: true
      allowEmptyValue: false
      schema:
        type: string
        description: ''
        format: ''
        maxLength: 1000
        deprecated: false
    plateIdParam:
      name: 'id'
      in: path
      description: |
        Name of the plate.

        Example value: "Plate-1",  "Plate-2",  "Plate-4".
      required: true
      allowEmptyValue: false
      schema:
        type: string
        description: ''
        format: ''
        maxLength: 1000
        deprecated: false
    digestParam:
      name: 'digest'
      in: query
      description: >
        Indicate digest of entity.
        It is used to avoid conflict while concurrent editing.
        If the parameter 'force' is true, this parameter is optional.
        If the parameter 'force' is false, this parameter is required.
      schema:
        type: string
        deprecated: false
    forceParam:
      name: 'force'
      in: query
      description: >
        Force to update without checking the provided digest.
        If true, the system will get and use the latest digest from server, ignoring the provided digest.
      schema:
        type: boolean
        deprecated: false
    offsetParam:
      name: page[offset]
      in: query
      description: Number of items to skip before returning the results.
      required: false
      schema:
        type: integer
        format: int64
        minimum: 0
        default: 0
    limitParam:
      name: page[limit]
      in: query
      description: Maximum number of items to return(max 100, default 20).
      required: false
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 100
        default: 20
    statusActionParam:
      name: action
      in: path
      description: |
        The action to change the status of Container.
        The available values are "dispose", "finalDispose", "restore", "checkout" and "checkin".
      required: true
      allowEmptyValue: false
      schema:
        type: string
        enum: ["dispose", "finalDispose", "restore", "checkout", "checkin"]
        deprecated: false
    jobId:
      name: 'jobId'
      in: path
      description: |
        Id of move location job.

