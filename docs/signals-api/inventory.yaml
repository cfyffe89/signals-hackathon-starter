      description: |
        Download the report of the material orders exports job after the job is completed.
        Please note that a report will only be generated when the "state" returned by "GET /inventory/materialOrders/exports/{jobId}/status" is "DONE".
        - The generated report is in "CSV"/"SDF" format.

