  /inventory/containers/bulkUpdateStatus/jobs:
    post:
      tags:
        - Inventory
      summary: 'Update the status of a group of containers'
      description: |
        Create a new job to update the status of a group of containers asynchronously.

        This is an asynchronous API.

        Server will start a job to update the status of the containers if the request is accepted.
        Client can check the status of the job with API "/inventory/containers/bulkUpdateStatus/jobs/jobId/status" timely.

        And client can download a report of that job with API "/inventory/containers/bulkUpdateStatus/jobs/jobId/report" while the job is completed.

        Here are the acceptable update actions and its state transition,
        - dispose, from AVAILABLE to DISPOSED.
        - finalDispose, from DISPOSED to FINAL_DISPOSED
        - checkout, from AVAILABLE to IN_USE
        - checkin, from IN_USE to AVAILABLE
        - delete, from AVAILABLE/ IN_USE to DELETED

        Notes:
        - The 'CheckOutContainers' option allows the user to update the container status to 'IN_USE' by assigning it to a specified user.
          The 'CheckInContainers' option allows the user to change the status to 'Available' by unassigning it from the current user,
          but only if the container is currently in 'IN_USE' status and assigned to that user.
        - The downloaded report files will be in CSV (.csv) format.

      operationId: 'bulkUpdateInventoryContainerStatusAsync'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/CreateUpdateBulkContainerStatusJobRequest'
            examples:
              DisposeContainers:
                $ref: '#/components/examples/bulkDisposeContainerJobExample'
              FinalDisposeContainers:
                $ref: '#/components/examples/bulkFinalDisposeContainerJobExample'
              CheckoutContainers:
                $ref: '#/components/examples/bulkCheckOutContainerJobExample'
              CheckinContainers:
                $ref: '#/components/examples/bulkCheckinContainerJobExample'
              DeleteContainers:
                $ref: '#/components/examples/bulkDeleteContainerJobExample'
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/CreateBulkUpdateStatusJobResponse'
              examples:
