  /inventory/locations/jobs/moveContents:
    post:
      tags:
        - Inventory
      summary: 'Transfer contents from one location to another'
      description: |
        This asynchronous API facilitates the transfer of contents from one location to another.
        The contents include all containers and sub-locations within the source location.
  
        Once the request is accepted, a background job is initiated, and a jobId is returned for tracking the status and retrieving the final report.
        
        Job Tracking and Reporting

        - Check job status:

          `GET /inventory/locations/jobs/moveContents/{jobId}`

          Use this endpoint to monitor the progress of the move operation.
        
        - Download job report:

          `GET /inventory/locations/jobs/moveContents/{jobId}/report`

          Available once the job is completed.
        
        There are 3 main attributes in the request body.
        - sourceLocationId: Id of the source location. This attribute is required.
        - destinationLocationId: Id of the destination location. The attribute is required.
        - duplicateHandling: Defines how to handle name conflicts when content already exists in the destination. Default is `cancel`.
        
        Duplicate Handling Options
        - cancel: Cancel the move request - Stop the move and revert the request. This is the default value.
        - delete: Delete the destination sub-location if possible, otherwise cancel the move request.
        - merge: Merge the containers and sub-locations.
        - skip: Skip moving the sub-locations and their contents.

      operationId: 'moveLocationContentsFromOneToAnother'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/MoveLocationContentsRequest'
            examples:
              moveLocationContents:
                $ref: '#/components/examples/moveLocationContentsExample'
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/MoveLocationContentsResponse'
              examples:
                moveLocationContents:
                  $ref: '#/components/examples/moveLocationContentsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '435':
          $ref: '#/components/responses/UnknownException'
        '436':
          $ref: '#/components/responses/MissingOrInvalidInput'
        '437':
          $ref: '#/components/responses/NoSuchEntity'
        '438':
          $ref: '#/components/responses/EntityTrashed'
        '439':
          $ref: '#/components/responses/MissingPrivilege'
        '440':
