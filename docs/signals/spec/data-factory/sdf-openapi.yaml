info:
  title: Signals Data Factory Public API Documentation
  version: 25.8.0-dev.0
  description: |-
    Signals Data Factory (SDF) Public API. Store and retrieve assay/screening **results** (rows) attached to **entities** (compounds, batches) within **projects**; result rows are typed by a **measurement type** (a result schema). Writes go through a **map** and are asynchronous. Authenticate with the `x-api-key` header on every request.

    Cleaned, hand-maintained edition: duplicate error models collapsed to named schemas, auto-generated `ModelNN` names replaced, MongoDB ObjectId leaks removed, and real examples added from live testing. See the companion SDF-API-GUIDE.md.
  contact:
    name: SDF API
security:
- x-api-key: []
openapi: 3.0.0
servers:
- url: https://{tenant}/datafactory
  description: Per-tenant base URL (ends in /datafactory).
  variables:
    tenant:
      default: your-tenant.revvitycloud.com
      description: Tenant host.
