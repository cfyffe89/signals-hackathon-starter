- name: search
  description: 'Query indexed project data: all results in a project, results scoped to one measurement
    type, results scoped to one entity record, or a cross-project search by measurement type. Uses cursor
    pagination (search-id / last-doc-id, links.next) rather than offset pagination.'
- name: projects
  description: Create, list, and manage projects (v1) and their datasets/datasources, including loading
    working copies into numbered revisions.
- name: v2
  description: Second-generation project, map, and results endpoints. Not all v1 functionality has a v2
    equivalent yet, and vice versa.
- name: data map
  description: 'v2 data maps: named field-mapping definitions used when loading or interpreting project
    data.'
- name: maps
  description: 'v1 data maps: named field-mapping definitions used when loading or interpreting project
    data.'
- name: information design
  description: Measurement types and entity/attribute definitions that describe the shape of data indexed
    for search.
