  /api/v1/projects/{projectId}/{entityName}/{entityId}/results:
    get:
      summary: Retrieves all results for a specific project by its project id and for a specific entity
        id.
      operationId: getApiV1ProjectsProjectidEntitynameEntityidResults
      description: |-
        Retrieves all results for a specific project by its project id and for a specific entity id.

        The first request to this API gets a 'search-id', this 'search-id' is used in following requests so the consequent results are from that point in time, to avoid issues if data is indexed after the first request.

        When getting following pages, the users must provide this 'search-id' as a query parameter along with the last document's id (as last-doc-id) so API knows what's the next document to return.

        The next url which includes the applicable search-id and last-doc-id is included in the responses links.next field. Users only have to follow that link to get the next page of results.

        **Paging:** follow `links.next` (or build it from `meta.search-id` + `meta.last-doc-id`) until a page returns no rows. Resend the same request body and any `publication-*-date` params on every page: filters are not remembered between pages, and `links.next` omits the date params. Compare the rows you collect with `meta.count`, because some page sizes have been observed to skip rows.
      parameters:
      - name: projectId
        in: path
        schema:
          type: string
          description: ID of the project to get
          example: 7c49ca25-43dd-4d76-b4c4-e08685193bd6
        description: ID of the project to get
        required: true
      - name: entityName
        in: path
        schema:
          type: string
          description: Name of the entity
          example: Compound
        description: Name of the entity
        required: true
      - name: entityId
        in: path
        schema:
          type: string
          description: ID of the entity
          example: '12345'
        description: ID of the entity
        required: true
      - name: page-size
        in: query
        schema:
          type: number
          description: Number of results to return
          example: 100
          default: 10000
          minimum: 1
          maximum: 10000
        description: Number of results to return
      - name: search-id
        in: query
        schema:
          type: string
          description: '`meta.search-id` from the first page. Send it with `last-doc-id` to fetch the
            next page. It does not store the query: resend the same request body and date params on every
            page, or later pages come back unfiltered.'
          example: '12345'
        description: '`meta.search-id` from the first page. Send it with `last-doc-id` to fetch the next
          page. It does not store the query: resend the same request body and date params on every page,
          or later pages come back unfiltered.'
      - name: last-doc-id
        in: query
        schema:
          type: string
          description: '`meta.last-doc-id` from the previous page (also embedded in `links.next`).'
          example: '67890'
        description: '`meta.last-doc-id` from the previous page (also embedded in `links.next`).'
      - name: publication-from-date
        in: query
        schema:
          type: string
          description: 'Only rows whose `timeStamp` (publication time) is **on or after** this instant
            (inclusive). ISO 8601 only: a date (`2026-03-26`, meaning midnight UTC) or a date-time (`2026-03-26T10:47:58.406Z`;
            offsets such as `+01:00` are applied). Compared at millisecond precision; other formats return
            400. 2.0 projects only: legacy projects return 400 "Search criteria is not compatible with
            legacy projects". **Not included in `links.next`, so send it again on every page.**'
          x-format:
            isoDate: true
          example: '2026-03-26'
        description: 'Only rows whose `timeStamp` (publication time) is **on or after** this instant (inclusive).
          ISO 8601 only: a date (`2026-03-26`, meaning midnight UTC) or a date-time (`2026-03-26T10:47:58.406Z`;
          offsets such as `+01:00` are applied). Compared at millisecond precision; other formats return
          400. 2.0 projects only: legacy projects return 400 "Search criteria is not compatible with legacy
          projects". **Not included in `links.next`, so send it again on every page.**'
      - name: publication-to-date
        in: query
        schema:
          type: string
          description: Only rows whose `timeStamp` (publication time) is **on or before** this instant
            (inclusive). A date-only value means midnight UTC, so it excludes rows published later that
            day; use `2026-03-26T23:59:59.999Z` to include the whole day. Combine with `publication-from-date`
            for a range (both ends inclusive; a reversed range returns 0 rows). Same format, precision,
            and 2.0-only rules as `publication-from-date`. **Not included in `links.next`, so send it
            again on every page.**
          x-format:
            isoDate: true
          example: '2026-03-26T23:59:59.999Z'
        description: Only rows whose `timeStamp` (publication time) is **on or before** this instant (inclusive).
          A date-only value means midnight UTC, so it excludes rows published later that day; use `2026-03-26T23:59:59.999Z`
          to include the whole day. Combine with `publication-from-date` for a range (both ends inclusive;
          a reversed range returns 0 rows). Same format, precision, and 2.0-only rules as `publication-from-date`.
          **Not included in `links.next`, so send it again on every page.**
      tags:
      - search
