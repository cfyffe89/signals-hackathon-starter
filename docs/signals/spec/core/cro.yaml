components:
  securitySchemes:
    api_key:
      type: apiKey
      in: header
      name: 'x-api-key'
  parameters:
    entityIdParam:
      name: 'eid'
      in: path
      description: |
        Unique entity identifier. Format: EID.
        Example value: "synergyExperiment:fc87f321-6b74-4046-bde0-0e1cf18bd8ce".
      required: true
      allowEmptyValue: false
      schema:
        type: string
        description: ''
        format: ''
        maxLength: 1000
        deprecated: false
    chemicalDrawingEntityIdParam:
      name: 'eid'
      in: path
      description: |
        Unique entity identifier. Format: EID.
        Example value: "chemicalDrawing:fc87f321-6b74-4046-bde0-0e1cf18bd8ce".
      required: true
      allowEmptyValue: false
      schema:
        type: string
        description: ''
        format: ''
        maxLength: 1000
        deprecated: false
    idQueryParam:
      name: 'eid'
      in: query
      description: |
        Unique entity identifier. Format: EID.

        Example value: "synergyExperiment:fc87f321-6b74-4046-bde0-0e1cf18bd8ce".
      required: true
      allowEmptyValue: false
      schema:
        type: string
        description: ''
        format: ''
        maxLength: 1000
        deprecated: false
    tokenParam:
      name: 'token'
      in: path
      required: true
      allowEmptyValue: false
      schema:
        type: string
        description: ''
        format: ''
        maxLength: 400
        deprecated: false
    digestParam:
      name: 'digest'
      in: query
      description: >
        Indicate digest of entity.
        It is used to avoid conflict while concurrent editing.
        If the parameter 'force' is true, this parameter is optional.
        If the parameter 'force' is false, this parameter is required.
      schema:
        type: string
        deprecated: false
    parentDigestParam:
      name: 'digest'
      in: query
      description: >
        Indicate digest of entity's parent.
        It is used to avoid conflict while concurrent editing.
        If the parameter 'force' is true, this parameter is optional.
        If the parameter 'force' is false, this parameter is required.
      schema:
        type: string
        deprecated: false
    forceParam:
      name: 'force'
      in: query
      description: >
        Force to update properties without doing digest check.
      schema:
        type: boolean
        deprecated: false
    sampleIdParam:
      name: 'sampleId'
      in: path
      description: |
        Unique sample identifier. Format: EID.

        Example value: "sample:fc87f321-6b74-4046-bde0-0e1cf18bd8ce".
      required: true
      allowEmptyValue: false
      schema:
        type: string
        description: ''
        format: ''
        maxLength: 1000
        deprecated: false
    sampleIdsParam:
      name: 'sampleIds'
      in: query
      description: |
        Comma separated sample IDs to return.

        Example value,

        - sample:53a36276-a337-467c-a58d-da45faa206ca,sample:7bc20d09-852f-4844-a4bc-8a324e0eda61
      required: false
      schema:
        type: string
      deprecated: false
    sampleColumnsParam:
      name: fields[samplesTableColumn]
      in: query
      description: >
        Specific columns(by key) to return.

        Example value,

        - fields[samplesTableColumn]=sampleId&fields[samplesTableColumn]=2

      required: false
      explode: true
      schema:
        type: array
        items:
          type: string
          description: ""
          default: ""
          maxLength: 200
    samplesTableIdParam:
      name: 'samplesTableId'
      in: path
      description: |
        Unique samples table identifier.
        It could be a samplesContainer or a paraSamplesGrid.

        Format: EID.

        Example values:
        - "samplesContainer:fc87f321-6b74-4046-bde0-0e1cf18bd8ce".
        - "paraSamplesGrid:2d0cda50-23a8-4ea5-b2c2-eca8ab83c4dc".

      required: true
      allowEmptyValue: false
      schema:
        type: string
        description: ''
        format: ''
        maxLength: 1000
        deprecated: false
    sampleSummaryIdParam:
      name: 'sampleSummaryId'
      in: path
      description: |
        Unique sample summary identifier. Format: EID.

        Example value: "paraSamplesGrid:fc87f321-6b74-4046-bde0-0e1cf18bd8ce".
      required: true
      allowEmptyValue: false
      schema:
        type: string
        description: ''
        format: ''
        maxLength: 1000
        deprecated: false
    includeParam:
      name: 'include'
      in: query
      description: |
        The related resources to be shown in "included" field.

        Example value: "owner".
        
        Available values: "createdBy", "editedBy", "owner".
      required: false
      allowEmptyValue: true
      schema:
        type: string
        description: ''
        format: ''
        maxLength: 200
        deprecated: false
    offsetForChemSearchParam:
      name: page[offset]
      in: query
      description: Number of items to skip before returning the results.
      required: false
      schema:
        type: integer
        format: int64
        minimum: 0
        maximum: 5000
        default: 0
    limitParam:
      name: page[limit]
      in: query
      description: Maximum number of items to return(max 100, default 20).
      required: false
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 100
        default: 20
    offsetParam:
      name: page[offset]
      in: query
      description: Number of items to skip before returning the results.
      required: false
      schema:
        type: integer
        format: int64
        minimum: 0
        default: 0
    aromaticRepresentationParam:
      name: 'aromaticRepresentation'
      in: query
      description: |
        Aromatic representation. Valid values are:
          - aromatic, Aromatic Circles.
          - alternating, Alternating Double/Single Bonds.

        The structure will keep the original representation if no value is specified.

        Supported entity types: sample, chemicalDrawing.

      schema:
        type: string
        enum: ['aromatic', 'alternating']
        description: ''
        format: ''
        maxLength: 1000
        deprecated: false
    valueFormatParam:
      name: 'value'
      in: query
      description: |
        Format of field values.
        1. Display.

          Will return value without units.
          Example value: mf : {value: "198.3189 g/mol"}
        2. Normalized.

          Will return composite field value with units.
          Example value: mf : {value: 198.3189, units:"g/mol", display: "198.3189 g/mol"}
      required: false
      allowEmptyValue: true
      schema:
        type: string
        enum: [ 'display', 'normalized' ]
        default: 'display'
        deprecated: false
    adtIdParam:
      name: 'eid'
      in: path
      description: |
        Unique Admin Defined Table identifier. Format: EID.
        Accepted entity types: grid.

        Example value: "grid:fc87f321-6b74-4046-bde0-0e1cf18bd8ce".
      required: true
      allowEmptyValue: false
      schema:
        type: string
        description: ''
        format: ''
        maxLength: 1000
        deprecated: false
    syncDataParam:
      name: 'syncData'
      in: query
      description: >
        Populate data from external data source if this is a table connected to an external data source
        and the external data reference ID is provided.
      schema:
        type: boolean
        deprecated: false
    worksheetIdParam:
      name: 'eid'
      in: path
      description: |
        Unique Worksheet identifier. Format: EID.
        Accepted entity types: worksheet.

        Example value: "worksheet:fc87f321-6b74-4046-bde0-0e1cf18bd8ce".
      required: true
      allowEmptyValue: false
      schema:
        type: string
        description: ''
        format: ''
        maxLength: 1000
        deprecated: false
    idParam:
      name: 'eid'
      in: path
      description: |
        Unique entity identifier. Format: EID.
        Accepted entity types: synergyExperiment, chemicalDrawing.

        Example value: "synergyExperiment:0d48f133-0a71-46df-a2f0-45a8cb107c88".
      required: true
      allowEmptyValue: false
      schema:
        type: string
        description: ''
        format: ''
        maxLength: 1000
        deprecated: false
    chemicalDrawingIdParam:
      name: 'eid'
      in: path
      description: |
