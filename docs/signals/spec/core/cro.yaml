        - name: 'include'
          in: query
          description: |
            The related resources to be shown in "included" field.
            
            Example value: "source, link".
            
            Available values: "source", "link".
          required: false
          allowEmptyValue: true
          schema:
            type: string
            description: ''
            format: ''
            maxLength: 200
            deprecated: false
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/EntityRelationshipsResponse'
              examples:
                Relationships:
                  $ref: '#/components/examples/entityRelationshipsApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
