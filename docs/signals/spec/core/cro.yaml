  /cro/entities/{eid}/export:
    get:
      tags:
        - CRO
      summary: 'Fetch entity content for CRO user'
      description: |
        Can refer to the standard API endpoint GET /entities/{eid}/export for reference.
      operationId: 'downloadEntityContentForCROUser'
      parameters:
        - $ref: '#/components/parameters/chemicalDrawingEntityIdParam'
        - name: 'format'
          in: query
          description: 'Export resource format (see description for available options for each entity type)'
          schema:
            type: string
            enum: [cdxml, inchi, mol, mol-v3000, smiles, svg, csv, sdf, gb, fa]
            description: ''
            format: ''
            maxLength: 99
            deprecated: false
        - $ref: '#/components/parameters/aromaticRepresentationParam'
      responses:
        '200':
          description: 'OK'
          content:
            application/octet-stream:
              schema:
                description: 'Return entity content as binary stream'
                type: string
                format: binary
              example: '(no example available)'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
  /cro/entities/{eid}/compliance:
    get:
      tags:
        - CRO
      summary: 'Get compliance of specified entity for CRO user'
      description: |
        Can refer to the standard API endpoint GET /entities/{eid}/compliance for reference.
      operationId: 'fetchEntityComplianceByIdForCROUser'
      parameters:
