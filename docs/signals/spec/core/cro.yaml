        - name: 'include'
          in: query
          description: |
            The related resources to be shown in "included" field.
            
            Example value: "entity".
            
            Available values: "entity".
          required: false
          allowEmptyValue: true
          schema:
            type: string
            description: ''
            format: ''
            maxLength: 200
            deprecated: false
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: './entities.yaml#/components/schemas/EntityComplianceResponse'
              examples:
                EntityCompliance:
                  $ref: '#/components/examples/fetchEntityComplianceApiResponseForCro'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
    patch:
      tags:
        - CRO
      summary: 'Update compliance of specified entity for CRO user'
      description: |
        Can refer to the standard API endpoint PATCH /entities/{eid}/compliance for reference.

        Supported entity type: chemicalDrawing.
      operationId: 'patchEntityComplianceByIdForCROUser'
      parameters:
        - $ref: '#/components/parameters/chemicalDrawingEntityIdParam'
        - $ref: '#/components/parameters/digestParam'
        - name: 'force'
          in: query
          description: >
            Force to update compliance.
            Don't care the digest match if set to true.
          schema:
            type: boolean
            deprecated: false
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              $ref: './entities.yaml#/components/schemas/ExternalCompliance'
            examples:
              ExternalCompliance:
                $ref: '#/components/examples/externalComplianceForCro'
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: './entities.yaml#/components/schemas/ExtEntityCompliance'
              examples:
                EntityCompliance:
                  $ref: '#/components/examples/fetchEntityComplianceApiResponseForCro'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
