openapi: 3.0.1
info:
  title: 'Signals Notebook APIs Document'
  version: v1.0
servers:
  - url: '/api/rest/v1.0'
    description: 'Signals Notebook'
security:
  - api_key: []
paths:
  /cro/entities/{eid}:
    get:
      tags:
        - CRO
      summary: 'Fetch entity by entity ID for CRO user'
      description: |
        Can refer to the standard API endpoint GET /entities/{eid} for reference.
      operationId: 'fetchEntityByIDForCROUser'
      parameters:
        - $ref: '#/components/parameters/entityIdParam'
        - name: 'include'
          in: query
          description: |
            The related resources to be shown in "included" field.
            
            Example value: "children, owner".

            Available values: "createdBy", "editedBy", "children", "owner", "systemTemplate", "template".
          required: false
          allowEmptyValue: true
          schema:
            type: string
            description: ''
            format: ''
            maxLength: 200
            deprecated: false
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/EntityApiResponse'
              examples:
                SynergyExperiment:
                  $ref: '#/components/examples/synergyExpApiResponse'
                SamplesContainer:
                  $ref: '#/components/examples/samplesContainerApiResponse'
                Sample:
                  $ref: '#/components/examples/sampleApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
  /cro/entities/{eid}/properties:
    get:
      tags:
        - CRO
      summary: 'Fetch entity properties for CRO user'
      description: |
        Can refer to the standard API endpoint GET /cro/entities/{eid}/properties for reference.
      operationId: 'fetchAllEntityPropertiesByIdForCROUser'
      parameters:
        - $ref: '#/components/parameters/entityIdParam'
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/EntityPropertiesResponse'
              examples:
                SynergyExperimentProperties:
                  $ref: '#/components/examples/entityPropertiesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
    patch:
      tags:
        - CRO
      summary: 'Update entity properties for CRO user'
      description: |
        Can refer to the standard API endpoint PATCH /cro/entities/{eid}/properties for reference.
      operationId: 'patchEntityPropertiesByIdForCROUser'
      parameters:
        - $ref: '#/components/parameters/entityIdParam'
        - $ref: '#/components/parameters/digestParam'
        - $ref: '#/components/parameters/forceParam'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/EntityPropertiesRequest'
            examples:
              SynergyExperimentProperties:
                $ref: '#/components/examples/entityPropertiesPatchRequest'
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/EntityPropertiesResponse'
              examples:
                SynergyExperimentProperties:
                  $ref: '#/components/examples/entityPropertiesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/DigestMismatch'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
  /cro/entities/{eid}/children:
    get:
      tags:
        - CRO
      summary: 'Fetch children of a specified entity for CRO user'
      description: |
        Can refer to the standard API endpoint GET /entities/{eid}/children for reference.
      operationId: 'fetchAllEntityChildrenByIdForCROUser'
      parameters:
        - $ref: '#/components/parameters/entityIdParam'
        - $ref: '#/components/parameters/offsetParam'
        - $ref: '#/components/parameters/limitParam'
        - name: 'order'
          in: query
          description: 'Sort children according to the layout order in UI page(For Experiment only)'
          schema:
            type: string
            enum: [layout]
            description: ''
            format: ''
            maxLength: 99
            deprecated: false
        - name: 'include'
          in: query
          description: |
            The related resources to be shown in "included" field.
            
            Example value: "ancestors, owner".
            
            Available values: "createdBy", "editedBy", "ancestors, "owner".
          required: false
          allowEmptyValue: true
          schema:
            type: string
            description: ''
            format: ''
            maxLength: 200
            deprecated: false
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/EntityListApiResponse'
              examples:
                Experiment:
                  $ref: '#/components/examples/synergyExperimentChildrenApiResponse'
                SamplesContainer:
                  $ref: '#/components/examples/samplesContainerChildrenApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
  /cro/entities/{eid}/ancestors:
    get:
      tags:
        - CRO
      summary: 'Fetch ancestors of a specified entity for CRO user'
      description: |
        Can refer to the standard API endpoint GET /entities/{eid}/ancestors for reference.
      operationId: 'fetchAllEntityAncestorsByIdForCROUser'
      parameters:
