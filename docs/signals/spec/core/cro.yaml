      description: |
        Can refer to the standard API endpoint POST /entities/{eid}/children/{filename} for reference.
      operationId: 'postAttachmentToEntityForCROUser'
      parameters:
        - $ref: '#/components/parameters/entityIdParam'
        - name: 'filename'
          in: path
          description: 'Indicate file name of attachment'
          required: true
          schema:
            type: string
            description: ''
            format: ''
            maxLength: 1000
            deprecated: false
        - name: 'pageId'
          in: query
          description: |
            The id of the parent page which this attachment will be added to.
            The attachment will be added into the last page if pageId is not provided.
          required: false
          schema:
            type: string
            description: ''
            format: ''
            maxLength: 99
            deprecated: false
        - name: 'pageOffset'
          in: query
          description: |
            The position of this attachment will be added in the specified page.
            - "0", means that add the attachment as the first element of the specified page.
            - "-1", means that add the attachment as the last element of the specified page.
            - If the value is bigger than the last one, it will be put as the last one.
            - The default value for this parameter is "-1".
          required: false
          schema:
            type: integer
            description: ''
            deprecated: false
        - $ref: '#/components/parameters/digestParam'
        - name: 'force'
          in: query
          description: >
            Force to post attachment.
            Don't care the digest match if set to true.
          schema:
            type: boolean
