      summary: 'Fetch related entities of a specified entity for CRO user'
      description: |
        Can refer to the standard API endpoint GET /entities/{eid}/relationships for reference.
      operationId: 'fetchAllEntityRelationshipsByIdForCROUser'
      parameters:
