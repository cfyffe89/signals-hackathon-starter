        - Temperature - °C, °F, K
        - Duration - μs, ms, s, min, hour, day
        - Volume - nL, μL, mL, L, kL
        - Percentage - %

        Note:

        1. For the fields which require reason on change(requiresReasonOnChange=true).

        If the user wishes to modify a value, they must provide a reason.
        The reasonId can be obtained through the "GET /worksheet/settings/unlock/reasons" endpoint.
        Additionally, users may include optional comments along with their reason for the change.
        For more information, please refer to the UpdateWorksheetWithReason example.

        2. For the fields which don't need reason(requiresReasonOnChange=false).

        The provided reason and comment will be disregarded.

        3. If want to clear the value of one field.

        Example for "requiresReasonOnChange" field,
        {
          key: "0cba9c0d-263c-49be-8f9b-a835235b76ac",
          content: {
            "reasonId": 1,
            "value": null
          }
        }

        Example for other fields,
        {
          key: "0cba9c0d-263c-49be-8f9b-a835235b76ac",
          content: null
        }

        4. For timestamp fields(whose type is datetime and autoCreated is ture), the accepted actions are as follows:
        - now: set/reset the value to the current time.
        - clear: remove the current value.

