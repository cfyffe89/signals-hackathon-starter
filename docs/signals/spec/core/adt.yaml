openapi: 3.0.1
info:
  title: 'Signals Notebook APIs Document'
  version: v1.0
servers:
  - url: '/api/rest/v1.0'
    description: 'Signals Notebook'
security:
  - api_key: []
paths:
  /adt/{eid}:
    get:
      tags:
        - AdminDefinedTables
      summary: 'Fetch content of Admin Defined Tables'
      description: |
        Fetch content of Admin Defined Tables.
        
        Accepted entity types: grid.
        
        Example usages:

          /adt/grid:abcd

      operationId: 'fetchAdtContentById'
      parameters:
        - $ref: '#/components/parameters/adtIdParam'
        - $ref: '#/components/parameters/valueFormatParam'
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AdtResponse'
              examples:
                adminDefinedTable:
                  $ref: '#/components/examples/fetchingAdtResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
    patch:
      tags:
        - AdminDefinedTables
      summary: 'Bulk update content of Admin Defined Table'
      description: |
        Bulk update content of Admin Defined Table.
        Adding new rows, updating existing rows and deleting existing rows are allowed.
        Updating column definition is NOT supported.

        Specify expected 'action' values in request body while adding/updating/deleting rows.

        There are 3 actions are accepted,
        - create, Add a new row.
        - update, Update existing row.
        - delete, Delete existing row.
        
        For ADTs embedded in worksheets, put the reason in the meta field if the reason-for-change is required.
        The reasonId can be obtained through the "GET /worksheet/settings/unlock/reasons" endpoint.
        Additionally, users may include optional comments along with their reason for the change.
        The reason and comment will be ignored for other cases.
        Refer to the examples for details if necessary.

        Accepted entity types: grid.

        Example usages:

          /adt/grid:abcd

        To get IDs of ontologyList type fields, please refer to /attributes/{attributeEid}/ontology/options.

        Here are some example values for different property types,
        - number {"value": 3.0 }
        - date  {"value":"2019-09-06T15:22:47.309Z"}
        - text  {"value":"text1"}
        - list  {"value": "list1"}
        - multiSelect {"value": "select1, select2"}
        - attributeList(multiple option) {"values": ["select1", "select2"]}
        - ontologyList(single select) {"value": {"id": 1234}}
        - ontologyList(multiple select) {"values": [{"id": 1234}, {"id": 5678}]}
        - boolean {"value": true}
        - unit {"display": "3.14 g"}
        
          Note: If using the "value" field to make changes, please remember "value" is stored in the system's base unit 
          (e.g. mol for Amount, g/mL for Density, mmol/g for Loading, g for Mass,
          molar for Molarity, g/mol for Molecular Weight, atm for Pressure, °C for Temperature, min for Duration, mL for Volume).
        
          Suggestion: Use "display" or "user" to specify a value with an explicit unit.
        - unit(var measure) {"display": "3.14 g"}
        - link {"value": "experiment:a2f9bba9-a4c7-9999-a676-251de965c234"}
        - link(multiple option) {"values": [
            {"eid": "experiment:a2f9bba9-a4c7-9999-a676-251de965c234"},
            {"eid": "experiment:9528e408-939e-4902-ad5e-f7a085f627ce"}
          ]}
        - externalLink {"display": "Google", "value": "http://www.google.com"}
        
        For inventory decrement:
        - The row can be switched to another container when Inventory Columns amounts are present, 
          the amount will not be returned to the container automatically.  
          User needs to update the amount to 0 first if he want to return the amount to the container.
        - The row can be deleted when Inventory Columns amounts are present, 
          the amount will not be returned to the container automatically.  
          User needs to update the amount to 0 first if he want to return the amount to the container.

        If want to remove the value of one cell, set the content to null.
        Example,

        {
          key: "0cba9c0d-263c-49be-8f9b-a835235b76ac",
          content: null
        }
        
        The automatically calculated formula columns can also be modified through this API.
        If a specified value is given, it is no longer calculated automatically.
        Add "formulationAction=recalculate" in the body of the request to make the value calculate automatically again.
        For details, see examples.

      operationId: 'patchAdtContentById'
      parameters:
        - $ref: '#/components/parameters/adtIdParam'
        - $ref: '#/components/parameters/digestParam'
        - $ref: '#/components/parameters/forceParam'
        - $ref: '#/components/parameters/syncDataParam'
        - $ref: '#/components/parameters/valueFormatParam'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/UpdateRowRequest'
            examples:
              UpdateRows:
                $ref: '#/components/examples/updateRowRequest'
              UpdateRowsWithReason:
                $ref: '#/components/examples/updateRowWithReasonRequest'
              UpdateFormulationValue:
                $ref: '#/components/examples/updateRowWithFormulationRequest'
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AdtResponse'
              examples:
                adminDefinedTable:
                  $ref: '#/components/examples/fetchingAdtResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
    post:
      tags:
        - AdminDefinedTables
      summary: 'Add a new row to Admin Defined Table'
      description: |
        Append a new row to the end of Admin Defined Table.

        For ADTs embedded in worksheets, put the reason in the meta field if the reason-for-change is required.
        The reasonId can be obtained through the "GET /worksheet/settings/unlock/reasons" endpoint.
        Additionally, users may include optional comments along with their reason for the change.
        The reason and comment will be ignored for other cases.
        Refer to the examples for details if necessary.

        Accepted entity types: grid.

        Example usages:

          /adt/grid:abcd

        To get IDs of ontologyList type fields, please refer to /attributes/{attributeEid}/ontology/options.

        Here are some example values for different property types,
        - number {"value": 3.0 }
        - date  {"value":"2019-09-06T15:22:47.309Z"}
        - text  {"value":"text1"}
        - list  {"value": "list1"}
        - multiSelect {"value": "select1, select2"}
        - ontologyList(single select) {"value": {"id": 1234}}
        - ontologyList(multiple select) {"values": [{"id": 1234}, {"id": 5678}]}
        - boolean {"value": true}
        - unit {"display": "3.14 g"}
        
          Note: If using the "value" field to make changes, please remember "value" is stored in the system's base unit 
          (e.g. mol for Amount, g/mL for Density, mmol/g for Loading, g for Mass,
          molar for Molarity, g/mol for Molecular Weight, atm for Pressure, °C for Temperature, min for Duration, mL for Volume).
        
          Suggestion: Use "display" or "user" to specify a value with an explicit unit.
        - unit(var measure) {"display": "3.14 g"}
        - link {"value": "experiment:a2f9bba9-a4c7-9999-a676-251de965c234"}
        - link(multiple option) {"values": [
            {"eid": "experiment:a2f9bba9-a4c7-9999-a676-251de965c234"},
            {"eid": "experiment:9528e408-939e-4902-ad5e-f7a085f627ce"}
          ]}
        - externalLink {"display": "Google", "value": "http://www.google.com"}

      operationId: 'postNewRowToAdt'
      parameters:
        - $ref: '#/components/parameters/adtIdParam'
        - $ref: '#/components/parameters/digestParam'
        - $ref: '#/components/parameters/forceParam'
        - $ref: '#/components/parameters/syncDataParam'
        - $ref: '#/components/parameters/valueFormatParam'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/AddRowRequest'
            examples:
              AddNewRow:
                $ref: '#/components/examples/addRowRequest'
              AddNewRowWithReason:
                $ref: '#/components/examples/addRowWithReasonRequest'
      responses:
        '201':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AdtRowResponse'
              examples:
                adminDefinedTable:
                  $ref: '#/components/examples/fetchingAdtRowResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
  /adt/{eid}/_column:
    get:
      tags:
        - AdminDefinedTables
      summary: 'Fetch column definitions of Admin Defined Tables'
      description: |
        Fetch column definitions of Admin Defined Tables.

        Accepted entity types: grid.

        Example usages:

          GET /adt/grid:abcd/_column

      operationId: 'fetchAdtColumnDefinitionsById'
      parameters:
        - $ref: '#/components/parameters/adtIdParam'
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AdtColumnDefinitionResponse'
              examples:
                columnDefinitions:
                  $ref: '#/components/examples/fetchingAdtColumnDefinitionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
    patch:
      tags:
        - AdminDefinedTables
      summary: 'Update column definitions of Admin Defined Table'
      description: |
        Update column definitions of Admin Defined Table.

        The `action` field must be one of:
        - `hide`, set the specified columns as hidden
        - `unhide`, set the specified columns as visible

        The `columns` field is a non-empty list of column IDs to apply the action to.

        Accepted entity types: grid.

        Example usages:

          PATCH /adt/grid:abcd/_column

      operationId: 'patchAdtColumnVisibility'
      parameters:
        - $ref: '#/components/parameters/adtIdParam'
        - $ref: '#/components/parameters/digestParam'
        - $ref: '#/components/parameters/forceParam'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/UpdateTableColumnRequest'
            examples:
              hideColumn:
                $ref: '#/components/examples/hideAdtColumnVisibilityRequest'
              unhideColumn:
                $ref: '#/components/examples/unhideAdtColumnVisibilityRequest'
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AdtColumnDefinitionResponse'
              examples:
                columnDefinitions:
                  $ref: '#/components/examples/fetchingAdtColumnDefinitionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
  /adt/{eid}/{rowid}:
    get:
      tags:
        - AdminDefinedTables
      summary: 'Fetch specified row of Admin Defined Table'
      description: |
        Fetch specified row of Admin Defined Table.
        
        Accepted entity types: grid.
        
        Example usages:

          /adt/grid:abcd/123

      operationId: 'fetchAdtRowByRowId'
      parameters:
        - $ref: '#/components/parameters/adtIdParam'
        - name: 'rowid'
          in: path
          required: true
          description: row id of table.
          schema:
            type: string
        - $ref: '#/components/parameters/valueFormatParam'
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AdtRowResponse'
              examples:
                adminDefinedTableRow:
                  $ref: '#/components/examples/fetchingAdtRowResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
    patch:
      tags:
        - AdminDefinedTables
      summary: 'Update specified row of Admin Defined Table'
      description: |
        Update specified row of Admin Defined Table.

        For ADTs embedded in worksheets, put the reason in the meta field if the reason-for-change is required.
        The reasonId can be obtained through the "GET /worksheet/settings/unlock/reasons" endpoint.
        Additionally, users may include optional comments along with their reason for the change.
        The reason and comment will be ignored for other cases.
        Refer to the examples for details if necessary.
        
        Accepted entity types: grid.
        
        Example usages:

          /adt/grid:abcd/123

        To get IDs of ontologyList type fields, please refer to /attributes/{attributeEid}/ontology/options.

        Here are some example values for different property types,
        - number {"value": 3.0 }
        - date  {"value":"2019-09-06T15:22:47.309Z"}
        - text  {"value":"text1"}
        - list  {"value": "list1"}
        - multiSelect {"value": "select1, select2"}
        - attributeList(multiple option) {"values": ["select1", "select2"]}
        - ontologyList(single select) {"value": {"id": 1234}}
        - ontologyList(multiple select) {"values": [{"id": 1234}, {"id": 5678}]}
        - boolean {"value": true}
        - unit {"display": "3.14 g"}
        
          Note: If using the "value" field to make changes, please remember "value" is stored in the system's base unit 
          (e.g. mol for Amount, g/mL for Density, mmol/g for Loading, g for Mass,
          molar for Molarity, g/mol for Molecular Weight, atm for Pressure, °C for Temperature, min for Duration, mL for Volume).
        
          Suggestion: Use "display" or "user" to specify a value with an explicit unit.
        - unit(var measure) {"display": "3.14 g"}
        - link {"value": "experiment:a2f9bba9-a4c7-9999-a676-251de965c234"}
        - link(multiple option) {"values": [
            {"eid": "experiment:a2f9bba9-a4c7-9999-a676-251de965c234"},
            {"eid": "experiment:9528e408-939e-4902-ad5e-f7a085f627ce"}
          ]}
        - externalLink {"display": "Google", "value": "http://www.google.com"}
        
        For inventory decrement:
        - The row can be switched to another container when Inventory Columns amounts are present, 
          the amount will not be returned to the container automatically.  
          User needs to update the amount to 0 first if he want to return the amount to the container.

        To clear the value of a cell, set its content to null.
        Example,

        {
          key: "0cba9c0d-263c-49be-8f9b-a835235b76ac",
          content: null
        }
        
        The automatically calculated formula columns can also be modified through this API.
        If a specified value is given, it is no longer calculated automatically.
        Add "formulationAction=recalculate" in the body of the request to make the value calculate automatically again.
        For details, see examples.

      operationId: 'patchAdtRowByRowId'
      parameters:
        - $ref: '#/components/parameters/adtIdParam'
        - name: 'rowid'
          in: path
          required: true
          description: row id of table.
          schema:
            type: string
        - $ref: '#/components/parameters/digestParam'
        - $ref: '#/components/parameters/forceParam'
        - $ref: '#/components/parameters/syncDataParam'
        - $ref: '#/components/parameters/valueFormatParam'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/PatchRowRequest'
            examples:
              UpdateRowValue:
                $ref: '#/components/examples/patchRowRequest'
              UpdateRowValueWithReason:
                $ref: '#/components/examples/patchRowWithReasonRequest'
              UpdateFormulationValue:
                $ref: '#/components/examples/patchFormulationRequest'
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AdtRowResponse'
              examples:
                adminDefinedTableRow:
                  $ref: '#/components/examples/fetchingAdtRowResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
    delete:
      tags:
        - AdminDefinedTables
      summary: 'Delete specified row of Admin Defined Table'
      description: |
        Delete specified row of Admin Defined Table.

        Note: 
        For ADTs embedded in worksheets, this API can be used to remove a row from the table if and only if the reason-for-change is not required.
        Otherwise, use "PATCH /adt/eid" to remove the row from the table.
        
        For inventory decrement:
        - The row can be deleted when Inventory Columns amounts are present, 
          the amount will not be returned to the container automatically.  
          User needs to update the amount to 0 first if he want to return the amount to the container.

        Accepted entity types: grid.
        
        Example usages:

          /adt/grid:abcd/123

      operationId: 'deleteAdtRowByRowId'
      parameters:
        - $ref: '#/components/parameters/adtIdParam'
        - name: 'rowid'
          in: path
          required: true
          description: row id of table.
          schema:
            type: string
        - $ref: '#/components/parameters/digestParam'
        - $ref: '#/components/parameters/forceParam'
      responses:
        '204':
          description: 'No Content'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
  /worksheet/{eid}:
    get:
      tags:
        - Worksheet
      summary: 'Fetch content of specified worksheet'
      description: |
        Fetch the content of specified worksheet.

        The content of the embedded ADTs are not returned in the response, please get them by the ADT APIs.

        Accepted entity types: worksheet.

        Example usages:

          /worksheet/worksheet:7c1dab82-5c09-47b2-be4f-fa04a383f620

      operationId: 'fetchWorksheetContentById'
      parameters:
        - $ref: '#/components/parameters/worksheetIdParam'
        - $ref: '#/components/parameters/includeParam'
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/WorksheetResponse'
              examples:
                worksheet:
                  $ref: '#/components/examples/fetchingWorksheetResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
    patch:
      tags:
        - Worksheet
      summary: 'Update specified worksheet'
      description: |
        Update specified worksheet.

        The content of the embedded ADTs are not editable here, please update them by the ADT APIs.

        Accepted entity types: worksheet.

        Example usages:

          /worksheet/worksheet:7c1dab82-5c09-47b2-be4f-fa04a383f620

        To get IDs of ontologyList type fields, please refer to /attributes/{attributeEid}/ontology/options.

        Here are some example values for different property types,
        - number {"value": 3.0 }
        - datetime  {"value":"2019-09-06T15:22:47.309Z"}
        - timestamp(autoCreated datetime)  {"action":"now|clear"}
        - text  {"value":"text1"}
        - list  {"value": "list1"}
        - multiSelect {"value": "select1, select2"}
        - attributeList(multiple option) {"values": ["select1", "select2"]}
        - ontologyList(single select) {"value": {"id": 1234}}
        - ontologyList(multiple select) {"values": [{"id": 1234}, {"id": 5678}]}
        - boolean {"value": true}
        - unit {"value": "3.1415926 g|ml|g/ml|mol"}
        - link {"value": "experiment:a2f9bba9-a4c7-9999-a676-251de965c234"}
        - link(multiple option) {"values": [
            {"eid": "experiment:a2f9bba9-a4c7-9999-a676-251de965c234"},
            {"eid": "experiment:9528e408-939e-4902-ad5e-f7a085f627ce"}
          ]}
        - externalLink {"display": "Google", "value": "http://www.google.com"}

        Available units for different measurements.
        - Amount - μmol, mmol, mol
