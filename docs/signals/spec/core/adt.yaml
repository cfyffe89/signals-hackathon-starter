components:
  securitySchemes:
    api_key:
      type: apiKey
      in: header
      name: 'x-api-key'
  parameters:
    adtIdParam:
      name: 'eid'
      in: path
      description: |
        Unique Admin Defined Table identifier. Format: EID.
        Accepted entity types: grid.

        Example value: "grid:fc87f321-6b74-4046-bde0-0e1cf18bd8ce".
      required: true
      allowEmptyValue: false
      schema:
        type: string
        description: ''
        format: ''
        maxLength: 1000
        deprecated: false
    variationsTableIdParam:
      name: 'eid'
      in: path
      description: |
        Unique variations table identifier. Format: EID.

        Accepted entity types: variationsGrid.

        Example value: "variationsGrid:fc87f321-6b74-4046-bde0-0e1cf18bd8ce".
      required: true
      allowEmptyValue: false
      schema:
        type: string
        description: ''
        format: ''
        maxLength: 1000
        deprecated: false
    variantIdParam:
      name: 'variantId'
      in: path
      description: |
        Unique variant identifier. Format: UUID.

        Example value: "fc87f321-6b74-4046-bde0-0e1cf18bd8ce".
      required: true
      allowEmptyValue: false
      schema:
        type: string
        description: ''
        format: ''
        maxLength: 1000
        deprecated: false
    rowIdParam:
      name: 'rowId'
      in: path
      description: |
        Unique row identifier. Format: UUID.
        
        Example value: "fc87f321-6b74-4046-bde0-0e1cf18bd8ce".
      required: true
      allowEmptyValue: false
      schema:
        type: string
        description: ''
        format: ''
        maxLength: 1000
        deprecated: false
    worksheetIdParam:
      name: 'eid'
      in: path
      description: |
        Unique Worksheet identifier. Format: EID.
        Accepted entity types: worksheet.

        Example value: "worksheet:fc87f321-6b74-4046-bde0-0e1cf18bd8ce".
      required: true
      allowEmptyValue: false
      schema:
        type: string
        description: ''
        format: ''
        maxLength: 1000
        deprecated: false
    includeParam:
      name: 'include'
      in: query
      description: |
        The related resources to be shown in "included" field.

        Example value: "entity,fieldsDefinition".
      required: false
      allowEmptyValue: true
      schema:
        type: string
        description: ''
        format: ''
        maxLength: 200
        deprecated: false
    valueFormatParam:
      name: 'value'
      in: query
      description: |
        Format of field values.
        1. Display.

          Will return value without units.
          Example value: mf : {value: 198.3189, display: "198.3189 g/mol"}
        2. Normalized.

          Will return composite field value with units.
          Example value: mf : {value: 198.3189, units:"g/mol", display: "198.3189 g/mol"}
      required: false
      allowEmptyValue: true
      schema:
        type: string
        enum: [ 'display', 'normalized' ]
        default: 'display'
        deprecated: false
    digestParam:
        name: 'digest'
        in: query
        description: >
          Indicate digest of entity.
          It is used to avoid conflict while concurrent editing.
          If the parameter 'force' is true, this parameter is optional.
          If the parameter 'force' is false, this parameter is required.
        schema:
          type: string
          deprecated: false
    forceParam:
        name: 'force'
        in: query
        description: >
          Force to update properties without digest check.
        schema:
          type: boolean
          deprecated: false
    syncDataParam:
      name: 'syncData'
      in: query
      description: >
        Populate data from external data source if this is a table connected to an external data source
        and the external data reference ID is provided.
      schema:
        type: boolean
        deprecated: false
  schemas:
    ErrorResponse:
      type: object
      required: [errors]
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              status:
                type: string
              code:
                type: string
              title:
                type: string
              detail:
                type: string
    JsonApiResponse:
      title: 'JsonApiResponse'
      type: object
      properties:
        data:
          oneOf:
            - $ref: '#/components/schemas/JsonApiData'
            - type: array
              items:
                $ref: '#/components/schemas/JsonApiData'
        included:
          type: array
          items:
            $ref: '#/components/schemas/JsonApiData'
        links:
          $ref: '#/components/schemas/JsonApiLinks'
    JsonApiRelationship:
      title: 'JsonApiRelationship'
      type: object
      properties:
        data:
          oneOf:
            - $ref: '#/components/schemas/JsonApiDataIdentifier'
            - type: array
              items:
                $ref: '#/components/schemas/JsonApiDataIdentifier'
        links:
          $ref: '#/components/schemas/JsonApiLinks'
    JsonApiData:
      title: 'JsonApiData'
      type: object
      properties:
        type:
          type: string
        id:
          type: string
        meta:
          $ref: '#/components/schemas/JsonApiMeta'
        attributes:
          type: object
        relationships:
          type: object
        links:
          $ref: '#/components/schemas/JsonApiLinks'
    JsonApiDataIdentifier:
      title: 'JsonApiDataIdentifier'
      type: object
      properties:
        meta:
          $ref: '#/components/schemas/JsonApiMeta'
        type:
          type: string
        id:
          type: string
    JsonApiLinks:
      title: 'JsonApiLinks'
      type: object
      properties:
        self:
          type: string
    JsonApiMeta:
      title: 'JsonApiMeta'
      type: object
      additionalProperties: true
    JsonApiIncluded:
      title: 'JsonApiIncluded'
      type: array
      items:
        $ref: '#/components/schemas/JsonApiData'
    JsonApiPagingLinks:
      title: 'JsonApiPagingLinks'
      type: object
      properties:
        self:
          type: string
        prev:
          type: string
        first:
          type: string
        next:
          type: string

    ExtAdtRowCell:
      type: object
      title: 'ExtAdtRowCell'
      properties:
        key:
          type: string
          description: Unique identifier for the cell.
        type:
          type: string
          description: Data type of the cell.
        name:
          type: string
          description: Name of the cell.
        content:
          type: object
          description: Content of the cell.
          additionalProperties: true

    ExtAdtRow:
      type: object
      title: 'ExtAdtRow'
      properties:
        links:
          $ref: '#/components/schemas/JsonApiLinks'
        type:
          type: string
        id:
          type: string
