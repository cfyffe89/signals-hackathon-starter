    patch:
      tags:
        - Users
      summary: 'Update user'
      description: |
        Update user attributes/roles/systemGroups or activate/deactivate a user's licenses.
  
        You can only update a user's attributes/roles/systemGroups OR a user's licenses. They cannot be done simultaneously.

        To bulk update a user's systemGroups, two associateTypes are accepted:  
        - ADD, add the user to the specified system group.  
        - REMOVE, remove the user from the specified system group.

        To update a user licenses:
        - Set active = true/false to activate/deactivate a user's licenses.
  
        Available licenses can be viewed using GET /users/licenses
  
        See example for details.

      operationId: 'patchUserById'
      parameters:
        - $ref: '#/components/parameters/userIdParam'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
