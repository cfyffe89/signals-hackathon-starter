openapi: 3.0.1
info:
  title: 'Signals Notebook APIs Document'
  version: v1.0
servers:
  - url: '/api/rest/v1.0'
    description: 'Signals Notebook'
security:
  - api_key: []
paths:
  /users:
    get:
      tags:
        - Users
      summary: 'List users'
      description: |
        List users.

        Parameter 'q' is a String and it is used to filter users.
        Example usage: Input 'foo' as value of 'q', will return
         - Users whose first name starts with 'foo'.
         - Users whose last name starts with 'foo'.
         - Users whose email address starts with 'foo'.
         - Users who has role name (except "Standard User") contains 'foo'.

        All of above are case insensitive.

      operationId: 'fetchAllUsers'
      parameters:
        - name: 'q'
          in: query
          description: 'Query string for list users'
          required: false
          schema:
            type: string
            description: ''
            format: ''
            maxLength: 99
          deprecated: false
        - name: 'enabled'
          in: query
          description: 'Filter activated and deactivated users'
          required: false
          schema:
            type: boolean
            default: true
          deprecated: false
        - $ref: '#/components/parameters/offsetParam'
        - $ref: '#/components/parameters/limitParam'
        - name: 'userType'
          in: query
          description: 'Filter users by type. Use "cro" to list CRO users, "systemStd" for standard users. Defaults to standard users when not provided.'
          required: false
          schema:
            type: string
            enum: [cro, systemStd]
          deprecated: false
        - name: 'cro'
          in: query
          description: 'Filter CRO users by a specific CRO eid. Only applicable when userType=cro. If not provided, users from all CROs are returned.'
          required: false
          schema:
            type: string
          deprecated: false
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UserListApiResponse'
              examples:
                UserList:
                  $ref: '#/components/examples/userListApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
    post:
      tags:
        - Users
      summary: 'Create user'
      description: |
        Create user.

        Notes:
        - The emailAddress "email@[your_domain]" should be a real email address.

      operationId: 'postNewUser'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/UserRequest'
            examples:
              User:
                $ref: '#/components/examples/userApiRequest'
      responses:
        '201':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UserApiResponse'
              examples:
                User:
                  $ref: '#/components/examples/usersApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
