openapi: 3.0.1
info:
  title: 'Signals Notebook APIs Document'
  version: v1.0
servers:
  - url: '/api/rest/v1.0'
    description: 'Signals Notebook'
security:
  - api_key: [ ]

paths:
  /plates:
    post:
      tags:
        - Plates
      summary: 'Create a new plate container'
      description: |
        Create a new plate container.

        Accepted entity types: plate container.

        #### Ancestors
        Ancestors of the entity to be created. Only needs to set parent entity in the ancestors section.
        Possible parent entities of plate container are experiment, parallel experiment and custom admin defined object.

        #### Template
        No template is required for plate container.

        #### Attributes
        There are 3 attributes are required for plate container.
        - numberOfRows, number of rows of each plate, integer, min value is 1, max value is 48.
        - numberOfColumns, number of columns of each plate, integer, min value is 1, max value is 48.
        - numberOfPlates, number of plates to be created, integer, min value is 1, max value is 500.

      operationId: 'postNewPlateContainer'
      parameters:
        - name: 'digest'
          in: query
          description: >
            Digest of parent entity.
            It is used to avoid conflict while concurrent editing.
            If the parameter 'force' is true, this parameter is optional.
            If the parameter 'force' is false, this parameter is required.
          schema:
            type: string
            deprecated: false
        - name: 'force'
          in: query
          description: >
            Force to create ignoring the provided digest.
            If true, the system will get and use the latest digest before updating parent, ignoring the provided one.
          schema:
            type: boolean
            deprecated: false
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/CreateEntityRequest'
            examples:
              CreatePlateContainer:
                $ref: '#/components/examples/createNewPlateContainerRequest'
      responses:
        '201':
          description: 'Created'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/PlateContainerApiResponse'
              examples:
                PlateContainer:
                  $ref: '#/components/examples/createNewPlateContainerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
  /plates/{plateContainerId}:
    get:
      tags:
        - Plates
      summary: 'Fetch plate container by ID'
      description: |
        Fetch plate container by ID.

      operationId: 'fetchPlateContainerContentById'
      parameters:
        - $ref: '#/components/parameters/plateContainerId'
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/PlateContainerApiResponse'
              examples:
                PlateContainer:
                  $ref: '#/components/examples/fetchDataOfPlateContainerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
  /plates/{plateContainerId}/plates:
    get:
      tags:
        - Plates
      summary: 'Retrieve all plates from a specified container'
      description: |
        Retrieve all plates from a specified container.

      operationId: 'fetchAllPlatesFromPlateContainer'
      parameters:
        - $ref: '#/components/parameters/plateContainerId'
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/PlateListApiResponse'
              examples:
                Plates:
                  $ref: '#/components/examples/fetchAllPlatesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
    post:
      tags:
        - Plates
      summary: 'Create a new plate in a specified container'
      description: |
        Create a new plate in a specified container.
        
        No request body is needed.

      operationId: 'postNewPlateToPlateContainer'
      parameters:
        - $ref: '#/components/parameters/plateContainerId'
        - $ref: '#/components/parameters/digestParam'
        - name: 'force'
          in: query
          description: >
            Force to create ignoring the provided digest.
            If true, the system will get and use the latest digest before updating, ignoring the provided one.
          schema:
            type: boolean
            deprecated: false
      responses:
        '201':
          description: 'Created'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/PlateApiResponse'
              examples:
                NewPlate:
                  $ref: '#/components/examples/createNewPlateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
  /plates/{plateContainerId}/plates/{id}:
    get:
      tags:
        - Plates
      summary: 'Retrieve data of an existing plate'
      description: |
        Retrieve data of an existing plate.

      operationId: 'fetchInventoryPlateById'
      parameters:
        - $ref: '#/components/parameters/plateContainerId'
        - $ref: '#/components/parameters/plateIdParam'
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/PlateApiResponse'
              examples:
                Plate:
                  $ref: '#/components/examples/fetchPlateByNameResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
    patch:
      tags:
        - Plates
      summary: 'Update an existing plate'
      description: |
        Update an existing plate.

        **Well-level annotation layers** (concentration, material, amount, etc.) use the `wells` array:
        - wellformat: {"value": "text"}
        - concentration: {"value": "123 pmolar|nmolar|μmolar|mmolar|molar|%|cell count|pg/mL|ng/mL|μg/mL|mg/mL"}
        - material: {"type":"experiment", "user":"exp-1-1", "value":"experiment:a2f9bba9-a4c7-9999-a676-251de965c234"}
        - amount: {"value": "123 pL|nL|μL|mL"}
        - replicate: {"value": 123}
        - deviation: {"value": "text"}
        - integer: {"value": 123}
        - number:  {"value": 1.23}
        - text: {"value": "text"}

        **Property-class annotation layers** (plate-level values) use the `value` field directly:
        - text: "My text value"
        - attribute: "Attribute value"
        - ontology_list: "{\"id\": 123}" (JSON string containing the ontology item ID)

        Note:
        - Only one annotation layer is allowed per request.
        - The units must be same in one annotation layer.
        - For ONTOLOGY_LIST type, the value must be a JSON string containing a valid ontology item ID from the associated attribute list.

        **Note:** In responses, ONTOLOGY_LIST values are returned as objects (e.g., `{"id": 123, "preferredName": "Option A", "iri": "http://example.org/option-a"}`), not as JSON strings.

      operationId: 'patchInventoryPlateById'
      parameters:
        - $ref: '#/components/parameters/plateContainerId'
        - $ref: '#/components/parameters/plateIdParam'
        - $ref: '#/components/parameters/plateDigestParam'
        - $ref: '#/components/parameters/forceParam'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/UpdatePlateRequest'
            examples:
              UpdatePlateWells:
                $ref: '#/components/examples/updatePlateExample'
              UpdateOntologyListProperty:
                $ref: '#/components/examples/updatePlatePropertyAnnotationLayerExample'
              UpdateTextProperty:
                $ref: '#/components/examples/updatePlateTextPropertyExample'
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/PlateApiResponse'
              examples:
                Plate:
                  $ref: '#/components/examples/fetchPlateByNameResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
    put:
      tags:
        - Plates
      summary: 'Replace an existing plate'
      description: |
        Replace an existing plate.

        The specified plate will be replaced with the new wells data.

        **Well-level annotation layers** (concentration, material, amount, etc.) use the `wells` array:
        - wellformat: {"value": "text"}
        - concentration: {"value": "123 pmolar|nmolar|μmolar|mmolar|molar|%|cell count|pg/mL|ng/mL|μg/mL|mg/mL"}
        - material: {"type":"experiment", "user":"exp-1-1", "value":"experiment:a2f9bba9-a4c7-9999-a676-251de965c234"}
        - amount: {"value": "123 pL|nL|μL|mL"}
        - replicate: {"value": 123}
        - deviation: {"value": "text"}
        - integer: {"value": 123}
        - number:  {"value": 1.23}
        - text: {"value": "text"}

        **Property-class annotation layers** (plate-level values) use the `value` field directly:
        - text: "My text value"
        - attribute: "Attribute value"
        - ontology_list: "{\"id\": 123}" (JSON string containing the ontology item ID)

        Note:
        - Only one annotation layer is allowed per request.
        - The units must be same in one annotation layer.
        - For ONTOLOGY_LIST type, the value must be a JSON string containing a valid ontology item ID from the associated attribute list.

        **Note:** In responses, ONTOLOGY_LIST values are returned as objects (e.g., `{"id": 123, "preferredName": "Option A", "iri": "http://example.org/option-a"}`), not as JSON strings.

      operationId: 'putPlaceInPlateContainerById'
      parameters:
        - $ref: '#/components/parameters/plateContainerId'
        - $ref: '#/components/parameters/plateIdParam'
        - $ref: '#/components/parameters/plateDigestParam'
        - $ref: '#/components/parameters/forceParam'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/UpdatePlateRequest'
            examples:
              ReplacePlateWells:
                $ref: '#/components/examples/updatePlateExample'
              UpdateOntologyListProperty:
                $ref: '#/components/examples/updatePlatePropertyAnnotationLayerExample'
              UpdateTextProperty:
                $ref: '#/components/examples/updatePlateTextPropertyExample'
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/PlateApiResponse'
              examples:
                Plate:
                  $ref: '#/components/examples/fetchPlateByNameResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
    delete:
      tags:
        - Plates
      summary: 'Remove an existing plate'
      description: |
        Remove an existing plate from container.

      operationId: 'deletePlateFromPlateContainerById'
      parameters:
        - $ref: '#/components/parameters/plateContainerId'
        - $ref: '#/components/parameters/plateIdParam'
        - $ref: '#/components/parameters/digestParam'
        - name: 'force'
          in: query
          description: >
            Force to delete ignoring the provided digest.
            If true, the system will get and use the latest digest before deleting, ignoring the provided one.
          schema:
            type: boolean
            deprecated: false
      responses:
        '204':
          description: 'Deleted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
  /plates/{plateContainerId}/settings/annotationLayers:
    get:
      tags:
        - Plates
      summary: 'Get annotation layers of a specified container'
      description: |
        Get annotation layers of a specified container.

      operationId: 'fetchAnnotationLayersOfPlateContainer'
      parameters:
        - $ref: '#/components/parameters/plateContainerId'
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AnnotationLayerListApiResponse'
              examples:
                AnnotationLayers:
                  $ref: '#/components/examples/fetchAllAnnotationLayersResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
    post:
      tags:
        - Plates
      summary: 'Add a new annotation layer to a specified container'
      description: |
        Add a new annotation layer to a specified container.

        Here are the acceptable annotationClasses for the new annotation layer.
        - wellformat
        - concentration
        - material
        - amount
        - replicate
        - deviation
        - other
        - property

        If select "other" annotationClass, the data type is required. Here are the acceptable data types for "other" annotationClass,
        - INTEGER
        - DECIMAL
        - TEXT
        
        If select "property" annotationClass, the data type is required. Here are the acceptable data types for "property" annotationClass,
        - INTEGER
        - DECIMAL
        - TEXT
        - ATTRIBUTE
        - ONTOLOGY_LIST

        If select "ATTRIBUTE" or "ONTOLOGY_LIST" data type for "property" annotationClass, the attributeList is required.
        The attributeList must be an attribute EID (e.g., "attribute:123"). 

        For other annotation classes other than "other" and "property". Data type is set by the default. Do not need to be provided.

      operationId: 'postNewAnnotationLayerToPlateContainer'
      parameters:
        - $ref: '#/components/parameters/plateContainerId'
        - $ref: '#/components/parameters/digestParam'
        - name: 'force'
          in: query
          description: >
            Force to create ignoring the provided digest.
            If true, the system will get and use the latest digest from server, ignoring the provided digest.
          schema:
            type: boolean
            deprecated: false
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/CreateAnnotationLayerRequest'
            examples:
              AddNewAnnotationLayer:
                $ref: '#/components/examples/createAnnotationLayerRequest'
              AddOntologyListAnnotationLayer:
                $ref: '#/components/examples/createOntologyListAnnotationLayerRequest'
      responses:
        '201':
          description: 'Created'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AnnotationLayerApiResponse'
              examples:
                NewAnnotationLayer:
                  $ref: '#/components/examples/addNewAnnotationLayerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
  /plates/{plateContainerId}/settings/annotationLayers/{annotationLayerId}:
    get:
      tags:
        - Plates
      summary: 'Get annotation layer by ID'
      description: |
        Get annotation layer by annotation layer ID.

      operationId: 'fetchAnnotationLayerById'
      parameters:
        - $ref: '#/components/parameters/plateContainerId'
        - $ref: '#/components/parameters/annotationLayerIdParam'
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AnnotationLayerApiResponse'
              examples:
                AnnotationLayer:
                  $ref: '#/components/examples/getAnnotationLayerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
    patch:
      tags:
        - Plates
      summary: 'Update an existing annotation layer'
      description: |
        Update an existing annotation layer.

        Only the name of the not predefined annotation layer can be updated.

      operationId: 'patchAnnotationById'
      parameters:
        - $ref: '#/components/parameters/plateContainerId'
        - $ref: '#/components/parameters/annotationLayerIdParam'
        - $ref: '#/components/parameters/plateDigestParam'
        - $ref: '#/components/parameters/forceParam'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/UpdateAnnotationLayerRequest'
            examples:
              UpdateAnnotationLayer:
                $ref: '#/components/examples/updateAnnotationLayerRequest'
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AnnotationLayerApiResponse'
              examples:
                AnnotationLayer:
                  $ref: '#/components/examples/getAnnotationLayerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
    delete:
      tags:
        - Plates
      summary: 'Delete an existing annotation layer'
      description: |
        Delete an existing annotation layer from specified container.
        
        Only the custom annotation layer can be deleted. Predefined annotation layer is not deletable.

      operationId: 'deleteAnnotationLayerById'
      parameters:
        - $ref: '#/components/parameters/plateContainerId'
        - $ref: '#/components/parameters/annotationLayerIdParam'
        - $ref: '#/components/parameters/plateDigestParam'
        - name: 'force'
          in: query
          description: >
            Force to delete ignoring the provided digest.
            If true, the system will get and use the latest digest from server, ignoring the provided digest.
          schema:
            type: boolean
            deprecated: false
      responses:
        '204':
          description: 'Deleted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false
  /plates/{plateContainerId}/summary:
    get:
      tags:
        - Plates
      summary: 'Retrieve the summary table of an existing plate container'
      description: |
        Retrieve the summary table of an existing plate container.

      operationId: 'fetchPlateSummaryTableContentById'
      parameters:
        - $ref: '#/components/parameters/plateContainerId'
        - $ref: '#/components/parameters/splitUnitsParam'
        - $ref: '#/components/parameters/includeParam'
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/PlateSummaryApiResponse'
              examples:
                PlateContainerSummary:
                  $ref: '#/components/examples/getPlateContainerSummaryExample'
        '400':
          $ref: '#/components/responses/BadRequest'
