    plateContainerId:
      name: 'plateContainerId'
      in: path
      description: |
        Unique Plate Container identifier. Format: EID.

        Accepted entity types: plateContainer.

        Example value: "plateContainer:fc87f321-6b74-4046-bde0-0e1cf18bd8ce".
      required: true
      allowEmptyValue: false
      schema:
        type: string
        description: ''
        format: ''
        maxLength: 1000
        deprecated: false
    plateIdParam:
      name: 'id'
      in: path
      description: |
        Name of the plate.

        Example value: "Plate-1",  "Plate-2",  "Plate-4".
      required: true
      allowEmptyValue: false
      schema:
        type: string
        description: ''
        format: ''
        maxLength: 1000
        deprecated: false
    annotationLayerIdParam:
      name: 'annotationLayerId'
      in: path
      description: |
        The unique annotation layer identifier. 

        Example value: "a28ba89f-90f0-492f-b448-015876a4518c".
      required: true
      allowEmptyValue: false
      schema:
        type: string
        description: ''
        format: ''
        maxLength: 1000
        deprecated: false
    digestParam:
      name: 'digest'
      in: query
      description: >
        Indicate digest of entity.
        It is used to avoid conflict while concurrent editing.
        If the parameter 'force' is true, this parameter is optional.
        If the parameter 'force' is false, this parameter is required.
      schema:
        type: string
        deprecated: false
    plateDigestParam:
      name: 'digest'
      in: query
      description: >
        Digest of plate container.
        It is used to avoid conflict while concurrent editing.
        If the parameter 'force' is true, this parameter is optional.
        If the parameter 'force' is false, this parameter is required.
      schema:
        type: string
        deprecated: false
    forceParam:
      name: 'force'
      in: query
      description: >
        Force to update without checking the provided digest.
        If true, the system will get and use the latest digest from server, ignoring the provided digest.
      schema:
        type: boolean
        deprecated: false
    splitUnitsParam:
      name: 'splitUnits'
      in: query
      description: >
        Split units column into 2 columns, units and value.

        For example, column "Amount" is a unit column, if request with "splitUnits=true", this column will be split into 2 columns.

        - One column is "Amount", which contains the value of the amount.

        - Another column is "Amount Unit", which contains the units of the amount.

        - If using this option, please make sure there is no custom annotation layer with the same name as the unit column to be created, in this case "Amount Unit".

      schema:
        type: boolean
        deprecated: false
    includeParam:
      name: 'include'
      in: query
      description: |
        The related resources to be shown in "included" field.

        Example value: "entity".
      required: false
      allowEmptyValue: true
      schema:
        type: string
        description: ''
        format: ''
        maxLength: 200
        deprecated: false

