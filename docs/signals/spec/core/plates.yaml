    UpdatePlateRequest:
      type: object
      required: [ data ]
      properties:
        data:
          type: object
          required: [ type, id, attributes ]
          properties:
            type:
              type: string
              enum: [ plate ]
            id:
              type: string
            attributes:
              type: object
              properties:
                plateId:
                  type: string
                annotationLayers:
                  type: array
                  items:
                    $ref: '#/components/schemas/AnnotationLayerAttributes'
    AnnotationLayerAttributes:
      type: object
      required: [ id ]
      properties:
        id:
          type: string
          description: ID of the annotation layer to update
        value:
          type: string
          description: |
            Value for property annotation layers. For ONTOLOGY_LIST data type, this must be a
            JSON-encoded string with an 'id' field (e.g., "{\"id\":123}"). To clear a value,
            send an empty string (""). Empty objects like "{}" are rejected as invalid.
        wells:
          type: array
          items:
            $ref: '#/components/schemas/AnnotationLayerWellAttributes'
    AnnotationLayerWellAttributes:
      type: object
      required: [ wellId ]
      properties:
        wellId:
          type: string
        content:
          type: object
          nullable: true
    CreateEntityRequest:
      title: 'EntityCreationRequestPayload'
      type: object
      required: [ data ]
      properties:
        data:
          type: object
          required: [ type, attributes ]
          properties:
            type:
              type: string
            meta:
              type: object
              title: 'meta'
              properties:
                adoTypeName:
                  type: string
            attributes:
              type: object
              title: 'attributes'
              additionalProperties: true
              properties:
                name:
                  type: string
                stoicRef:
                  type: object
                  title: 'stoicRef'
                  required: [ eid, rowId ]
                  properties:
                    eid:
                      type: string
                      pattern: '^(chemicalDrawing)(:|(%3A)|(%3a)).+$'
                    rowId:
                      type: string
                fields:
                  type: array
                  items:
                    type: object
                    required: [ id, content ]
                    properties:
                      id:
                        type: string
                      content:
                        type: object
                        additionalProperties: true
            relationships:
              type: object
              properties:
                ancestors:
                  type: object
                  title: 'ancestors'
                  required: [ data ]
                  properties:
                    data:
                      type: array
                      items:
                        type: object
                        required: [ type,id ]
                        properties:
                          type:
                            type: string
                          id:
                            type: string
                template:
                  type: object
                  title: 'template'
                  required: [ data ]
                  properties:
                    data:
                      type: object
                      required: [ type,id ]
                      properties:
                        type:
                          type: string
                        id:
                          type: string
    CreateAnnotationLayerRequest:
      type: object
      required: [ data ]
      properties:
        data:
          type: object
          required: [ type, attributes ]
          properties:
            type:
              type: string
              enum: [ annotationLayer ]
            attributes:
              type: object
              required: [ name, annotationClass ]
              properties:
                name:
                  type: string
                annotationClass:
                  type: string
                  enum: [ wellformat, concentration, material, amount, replicate, deviation, other, property ]
                dataType:
                  type: string
                  description: |
                    Data type for the annotation layer value. Required for 'other' and 'property' annotationClass.
                    ONTOLOGY_LIST is only valid for 'property' annotationClass and requires attributeList to be set.
                  enum: [ INTEGER, DECIMAL, TEXT, ATTRIBUTE, ONTOLOGY_LIST ]
                attributeList:
                  type: string
                  description: |
                    EID of the attribute list (e.g., "attribute:123"). Required when dataType is ATTRIBUTE or ONTOLOGY_LIST.
    UpdateAnnotationLayerRequest:
      type: object
      required: [ data ]
      properties:
        data:
          type: object
          required: [ type, attributes ]
          properties:
            type:
              type: string
              enum: [ annotationLayer ]
            attributes:
              type: object
              required: [ name ]
              properties:
                name:
                  type: string

