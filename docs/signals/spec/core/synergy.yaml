      in: query
      description: |
        Chemical format of design structure.
      required: false
      schema:
        type: string
        enum:
          - cdxml
          - mol
          - smiles
          - inchi
        description: ''
        format: ''
        maxLength: 1000
        deprecated: false
    referenceTableEidParam:
      name: 'referenceTableId'
      in: path
      description: |
        Unique reference table identifier. Format: EID.
        
        Accepted entity types: referenceTable.

        Example value: "referenceTable:b9c9d706-e22b-45c0-9017-08452be49fca".
      required: true
      allowEmptyValue: false
      schema:
        type: string
        description: ''
        format: ''
        maxLength: 1000
        deprecated: false
    libraryNameParam:
      name: 'libraryName'
      in: query
      description: |
        Library name.
      required: false
      allowEmptyValue: true
      schema:
        type: string
        maxLength: 1000
    includeParam:
      name: 'include'
      in: query
      description: |
        The related resources to be shown in "included" field.

        Example value: "entity,creator".
      required: false
      allowEmptyValue: true
      schema:
        type: string
        description: ''
        format: ''
        maxLength: 200
        deprecated: false
    digestParam:
        name: 'digest'
        in: query
        description: >
          Indicate digest of entity.
          It is used to avoid conflict while concurrent editing.
          If the parameter 'force' is true, this parameter is optional.
          If the parameter 'force' is false, this parameter is required.
        schema:
          type: string
          deprecated: false
    forceParam:
        name: 'force'
        in: query
        description: >
          Force to update without checking the provided digest.
          If true, the system will get and use the latest digest from server, ignoring the provided digest.
        schema:
          type: boolean
          deprecated: false
  schemas:
    DataExchangeDownload:
      type: object
