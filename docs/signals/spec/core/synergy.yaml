            links:
              type: object
              required:
                - self
              properties:
                self:
                  type: string
                  description: Self link for the resource.
                  example: /api/rest/v1.0/synergy/dataExchange/dataExchange:19041bb2-304c-4376-93ce-6c9be1e84d7a/files
            attributes:
              type: object
              required:
