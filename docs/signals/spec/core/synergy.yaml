        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /synergy/dataExchange/{dataExchangeEid}/resultTable/{tableName}:
    get:
      tags:
        - Synergy
      summary: 'Download a Data Exchange result table file by table name'
      deprecated: false
      operationId: 'downloadDataExchangeResultFile'
      description: |
        Download a result table file.
        The `tableName` path parameter must match the `name` field of one of the entries in `data.tables`.
      parameters:
        - name: 'dataExchangeEid'
          in: path
          description: 'EID of the Data Exchange entity.'
          required: true
          schema:
            type: string
            description: ''
            format: ''
            maxLength: 199
            deprecated: false
        - name: 'tableName'
          in: path
          description: 'Name of the result table to download (must match the `name` field in `data.tables`).'
          required: true
          schema:
            type: string
            deprecated: false
      responses:
        '200':
          description: 'OK'
          content:
            application/octet-stream:
              schema:
                description: 'Return file content as binary stream'
                type: string
                format: binary
        '400':
