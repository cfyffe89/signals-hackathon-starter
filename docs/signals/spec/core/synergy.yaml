  /synergy/cros/{croId}/bulkUpdateUsers:
    post:
      tags:
        - Synergy
      summary: 'Bulk update CRO users.'
      description: |
        Bulk update CRO users by importing a CSV file.
        
        If the request is accepted, the server will start a job to import the file asynchronously.
        
        Request Body:
        
            The CSV file should contain the users data to be updated.
            The first row should contain the column headers, and subsequent rows should contain the user data.
            The columns should match the user fields in the system.
        
            Example columns: "User ID", "Email", "First Name", "Last Name", "Country", "Alias", "Departments", etc.
            Example of CSV content: Bulk export users from CRO and modify the data in the Excel.
        
            Note: User ID, Email, Alias are unique across users.
        
        The status of the job can be checked with the API 'GET /synergy/cros/{croId}/bulkUpdateUsersStatus'.
      operationId: 'bulkUpdateCroUsers'
      parameters:
        - $ref: '#/components/parameters/croIdParam'
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
              format: binary
      responses:
        '202':
          description: 'Accepted'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/JsonApiResponse'
              examples:
                BulkUpdateUsers:
                  $ref: '#/components/examples/bulkUpdateUsersResponse'
