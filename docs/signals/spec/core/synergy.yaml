  /synergy/synergyExperiment/{synergyExperimentId}/status:
    put:
      tags:
        - Synergy
      summary: 'Update synergyExperiment status.'
      description: |
        Update synergy experiment status.

        Accepted action values:
          - "skip_to_submitted"
          - "close_without_signing"
          - "reopen"
          - "reopen_for_sponsor"

        Possible synergy experiment state transition:
          - "Active" -> "Submitted"(action = "skip_to_submitted")
          - "Submitted" -> "Closed"(action = "close_without_signing")
          - "Submitted" -> "Active"(action = "reopen")
          - "Close" -> "Submitted"(action = "reopen_for_sponsor")

      operationId: 'putSynergyExperimentStatusById'
      parameters:
        - $ref: '#/components/parameters/synergyExperimentEidParam'
        - $ref: '#/components/parameters/digestParam'
        - $ref: '#/components/parameters/forceParam'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/UpdateSynergyExperimentStatusRequest'
            examples:
              SynergyExperimentSkipToSubmittedRequest:
                $ref: '#/components/examples/synergyExperimentSkipToSubmittedRequest'
              SynergyExperimentCloseWithoutSigningRequest:
                $ref: '#/components/examples/synergyExperimentCloseWithoutSigningRequest'
              ReopenSynergyExperimentRequest:
                $ref: '#/components/examples/reopenSynergyExperimentRequest'
              SynergyExperimentReopenForSponsorRequest:
                $ref: '#/components/examples/synergyExperimentReopenForSponsorRequest'
      responses:
