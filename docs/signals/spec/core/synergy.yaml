openapi: 3.0.1
info:
  title: 'Signals Notebook APIs Document'
  version: v1.0
servers:
  - url: '/api/rest/v1.0'
    description: 'Signals Notebook'
security:
  - api_key: []
paths:
  /synergy/dataExchange/{dataExchangeEid}/files:
    get:
      tags:
        - Synergy
      summary: 'List downloadable Data Exchange files'
      deprecated: false
      operationId: 'listDataExchangeDownloads'
      description: |
        Fetch the downloadable external API file links referenced in the Data Exchange results table files and report file.
      parameters:
        - name: 'dataExchangeEid'
          in: path
          description: 'EID of the Data Exchange entity.'
          required: true
          schema:
            type: string
            description: ''
            format: ''
            maxLength: 199
            deprecated: false
      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/DataExchangeDownloadsResponse'
              examples:
                AldehydeOxidaseStability3:
                  value:
                    links:
                      self: https://snb.example.com/api/rest/v1.0/synergy/dataExchange/dataExchange:19041bb2-304c-4376-93ce-6c9be1e84d7a/files
                    data:
                      type: dataExchangeFiles
                      id: dataExchange:19041bb2-304c-4376-93ce-6c9be1e84d7a
                      links:
                        self: https://snb.example.com/api/rest/v1.0/synergy/dataExchange/dataExchange:19041bb2-304c-4376-93ce-6c9be1e84d7a/files
                      attributes:
                        dataExchangeEid: dataExchange:19041bb2-304c-4376-93ce-6c9be1e84d7a
                        downloads:
                          - downloadUrl: https://snb.example.com/api/rest/v1.0/synergy/dataExchange/dataExchange:19041bb2-304c-4376-93ce-6c9be1e84d7a/report
                          - tableName: Summary
                            summary: 60 rows, 37 columns
                            downloadUrl: https://snb.example.com/api/rest/v1.0/synergy/dataExchange/dataExchange:19041bb2-304c-4376-93ce-6c9be1e84d7a/resultTable/Summary
                          - tableName: Well Details
                            summary: 360 rows, 20 columns
                            downloadUrl: https://snb.example.com/api/rest/v1.0/synergy/dataExchange/dataExchange:19041bb2-304c-4376-93ce-6c9be1e84d7a/resultTable/Well%20Details
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /synergy/dataExchange/{dataExchangeEid}/report:
    get:
      tags:
        - Synergy
      summary: 'Download the Data Exchange report file'
      deprecated: false
      operationId: 'downloadDataExchangeReportFile'
      description: |
        Download the dataExchange report file.
      parameters:
        - name: 'dataExchangeEid'
          in: path
          description: 'EID of the Data Exchange entity.'
          required: true
          schema:
            type: string
            description: ''
            format: ''
            maxLength: 199
            deprecated: false
      responses:
        '200':
          description: 'OK'
          content:
            application/octet-stream:
              schema:
                description: 'Return file content as binary stream'
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
