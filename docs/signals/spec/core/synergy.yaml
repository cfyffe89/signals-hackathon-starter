      summary: 'Create a new work order.'
      description: |
        Create a new work order.

        1. System defined attributes:

        Fields definition:
        - name, auto-generated. Type : string.
        - description: optional. Type: string.
        - workType, required. Type : string. Refer to "/synergy/workTypes" to get all options. 
        - priority, optional. Type : string, Available options, Low, Medium and High.
        - dueDate. optional. Type : date. GMT date time.
        - assignedCroDepartment, optional. Type: link.
        - assignedUser, optional. Type, link.
        - collaboration, required. Type, link.
        - idea, optional. Type, link.
        - references. optional. Type : link array. Reference designs.
        The designs which provided here will be inserted into a reference table of the new work order.
        The designs which provided here must be from the same design table of the provided Idea.

        2. Customer defined attributes:

        The definition of customer defined attributes can be found by invoking "/entities/templates/templateId/fields".
        Templates can be found by invoking "/entities?includeTypes=workOrder&includeOptions=systemTemplate".

        To get IDs of ontologyList type fields, please refer to /attributes/{attributeEid}/ontology/options.

