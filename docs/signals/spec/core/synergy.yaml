  /synergy/designTables/{designTableId}/design/bulkImport:
    post:
      tags:
        - Synergy
      summary: 'Bulk import designs'
      deprecated: false
      operationId: 'bulkImportDesigns'
      description: |
        Bulk import designs into a specified design table. Currently, this API supports importing files in SDF or CSV format.

        The column name in each records of sdf/csv file should be match the design field name. In sdf file, it doesn't support character '-', '.', '<', '>', '=', '%', ' ', please replace them to '_' in records. For example, '% active' field in Design should be mapped to ‘__active’ column in sdf file which prepare to import.

        For multi select fields, we will separate values in "\n", please add values as "val1\nval2\nval3".

        Notes:

        1. This is an asynchronous API.
          If the request is accepted, the server will start a job to import the design asynchronously.
          Clients can check the status of the job with the API 'GET /synergy/designTables/{designTableId}/design/bulkImport'. The response will include a report file link if reportFormat is needed. Clients can download the report file with the API 'GET /synergy/designTables/design/bulkImport/reportFile/{fileId}'.

        2. Rules of import:
          - 'TREAT_AS_UNIQUE', each item will be treated as a new design. Please note that this option is selected by default.
          - 'NO_DUPLICATED', server will check the item with uniqueness check, duplicates are skipped and not imported.
        
        3. Report Format options:
          - 'ALL_RESULTS', will report all the result.
          - 'FAILURES_ONLY', only report the failures result. Please note that this option is selected by default.
          - 'DUPLICATES_AND_FAILURES', both duplicates and failures result will be reported.
    
        4. Import designs by a CSV file:
    
        The chemical drawing format will be auto-detected by the column name:
          - Chemical Structure (SMILES): SMILES
          - Chemical Structure (InChI): InChI
    
        If more than one chemical structure column is found, the priority is placed in the above order. The column with the highest priority will be selected.
    
        5. Max request upload file size: 50 MiB.
    
        6. Max record of designs: 100.

      parameters:
        - $ref: '#/components/parameters/designTableEidParam'
        - name: 'filename'
          in: query
          description: 'Name of the import file.'
          required: true
          schema:
            type: string
            description: ''
            format: ''
            maxLength: 99
            deprecated: false
        - name: 'rule'
          in: query
          description: 'Rule of import'
          required: true
          schema:
            type: string
            enum: [ 'TREAT_AS_UNIQUE', 'NO_DUPLICATED' ]
            description: ''
            default: 'TREAT_AS_UNIQUE'
            format: ''
            maxLength: 99
            deprecated: false
        - name: 'reportFormat'
          in: query
          description: 'can select the report result format of download file which include all results, failures only, duplicated and failures'
          required: true
          schema:
            type: string
            enum: [ 'ALL_RESULTS', 'FAILURES_ONLY', 'DUPLICATES_AND_FAILURES' ]
            default: 'FAILURES_ONLY'
            description: 'Indicate the report format'
            format: ''
            maxLength: 99
            deprecated: false
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
            example: '(refer download the design table file)'
      responses:
        '200':
          description: 'accepted'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/BulkImportDesignJobReportResponse'
              examples:
                Report:
                  $ref: '#/components/examples/designBulkUpdateInProgressResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
