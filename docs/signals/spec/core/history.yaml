      value:
        users:
          - '100'
        actions:
          - 'Edited'
        types:
          - 'Experiment'
        name: 'exp-0001'
        from: '2020-07-01T00:00:00.000Z'
        to: '2020-08-01T00:00:00.000Z'
        offset: 0
        limit: 100
    historySearchResponse:
      value:
        meta:
          offset: 0
          limit: 2
          count: 2
          hasMore: true
        data:
          - id: '5f17d64428bb4c48c4422b74'
