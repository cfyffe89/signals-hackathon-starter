              ancestors:
                data:
                  - type: 'entity'
                    id: 'experiment:b015d50f-4af4-4183-9906-f72fe4551f28'
              entities:
                data:
                  - type: 'revision'
                    id: '5f17d64428bb4c48c4422b74'
                    meta:
                      links:
                        self: 'https://snb.example.com/api/rest/v1.0/history/revisions/5f17d64428bb4c48c4422b74/entities/text:b015d50f-4af4-4183-9906-f72fe4551f28'
          - type: 'history'
            id: '5efee827713c090007a21b47'
            attributes:
