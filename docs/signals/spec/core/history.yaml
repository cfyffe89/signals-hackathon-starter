            relationships:
              entities:
                data:
                  - type: 'entity'
                    id: '5efee827713c090007a21b47'
                    meta:
                      links:
                        self: 'https://snb.example.com/api/rest/v1.0/history/revisions/5efee827713c090007a21b47/entities/text:b015d50f-4af4-4183-9906-f72fe4551f28'
