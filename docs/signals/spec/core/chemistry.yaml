openapi: 3.0.1
info:
  title: 'Signals Notebook APIs Document'
  version: v1.0
servers:
  - url: '/api/rest/v1.0'
    description: 'Signals Notebook'
security:
  - api_key: []
paths:
  /chemistry/pairedSequence:
    post:
      tags:
        - Chemistry
      summary: 'Add a child paired sequence chemicalDrawing from two single oligonucleotide sequences'
      description: |
        This API takes two chemical drawings that contain single oligonucleotide sequences. 
        
        If pairing is successful, a chemical drawing representing the paired sequence will be added to the specified parent entity.

      operationId: 'postEntityWithPairedSequence'
      parameters:
        - name: 'eid'
          in: query
          description: |
            Unique entity identifier which will hold the paired sequence in a chemical drawing. Format: EID.

            Example value: "experiment:fc87f321-6b74-4046-bde0-0e1cf18bd8ce".
          required: true
          allowEmptyValue: false
          schema:
            type: string
            description: ''
            format: ''
            maxLength: 1000
            deprecated: false
        - name: 'pageId'
          in: query
          description: |
            The id of the parent page in which this paired sequence drawing will be added.
            The content will be added into the last page if pageId is not provided.
          required: false
          schema:
            type: string
            description: ''
            format: ''
            maxLength: 99
            deprecated: false
        - name: 'pageOffset'
          in: query
          description: |
            The position of this paired sequence drawing will be added in the specified page.
            - "0", means that add the new ChemDraw content as the first element of the specified page.
            - "-1", means that add the new ChemDraw content as the last element of the specified page.
            - If the value is bigger than the last one, it will be put as the last one.
            - The default value for this parameter is "-1".
          required: false
          schema:
            type: integer
            description: ''
            deprecated: false
        - $ref: '#/components/parameters/digestParam'
        - $ref: '#/components/parameters/forceParam'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/PairedSequenceRequest'
            examples:
              PairSequenceRequest:
                $ref: '#/components/examples/pairedSequenceRequestExample'
      responses:
        '201':
          description: 'Created'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/EntityApiResponse'
              examples:
                PairedSequenceResponse:
                  $ref: '#/components/examples/pairedSequenceResponseExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '415':
          description: 'Unsupported media type'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '445':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false

  /chemistry/{eid}/pairedSequence:
    put:
      tags:
        - Chemistry
      summary: 'Update the chemical drawing with a paired sequence'
      description: |
        Update the chemical drawing with a paired sequence chemicalDrawing from two single oligonucleotide sequences.

        This API takes two chemical drawings that contain single oligonucleotide sequences.

        If pairing is successful, a chemical drawing representing the paired sequence will be used for that entity.

        When the entity is a reaction, you may optionally specify the position parameter.

        Available positions include:
        - (null): The reaction is treated as a whole, and the paired sequence replaces the entire reaction.
        - reactants: The paired sequence is inserted into the reactants section of the reaction.
        - reagents: The paired sequence is inserted into the reagents section of the reaction.
        - products: The paired sequence is inserted into the products section of the reaction.
        - grid: The paired sequence is inserted into the grid section of the reaction as a reactant. The paired sequence is not displayed in the reaction drawing.

        Accepted entity types: chemicalDrawing.

      operationId: 'replaceStructureWithPairedSequence'
      parameters:
        - $ref: '#/components/parameters/chemicalDrawingIdParam'
        - name: 'position'
          in: query
          description: Position of the reaction. One of "reactants, reagents, products, grid".
          schema:
            type: string
            enum: [ 'reactants', 'reagents', 'products', 'grid']
        - $ref: '#/components/parameters/digestParam'
        - $ref: '#/components/parameters/forceParam'

      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/PairedSequenceRequestV2'
            examples:
              PairSequenceRequest:
                $ref: '#/components/examples/pairedSequenceRequestExampleV2'

      responses:
        '200':
          description: 'OK'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/EntityApiResponse'
              examples:
                ChemicalDrawing:
                  $ref: '#/components/examples/pairedSequenceResponseExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '447':
          $ref: '#/components/responses/AutoPairFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      deprecated: false

components:
  securitySchemes:
    api_key:
      type: apiKey
      in: header
      name: 'x-api-key'
  parameters:
    digestParam:
      name: 'digest'
      in: query
      description: >
        Indicate digest of entity.
        It is used to avoid conflict while concurrent editing.
        If the parameter 'force' is true, this parameter is optional.
        If the parameter 'force' is false, this parameter is required.
      schema:
        type: string
        deprecated: false
    forceParam:
      name: 'force'
      in: query
      description: >
        Force to update properties without doing digest check.
      schema:
        type: boolean
        deprecated: false
    chemicalDrawingIdParam:
      name: 'eid'
      in: path
      description: |
        Unique chemicalDrawing identifier. Format: EID.

        Accepted entity types: chemicalDrawing.

        Example value: "chemicalDrawing:fc87f321-6b74-4046-bde0-0e1cf18bd8ce".
      required: true
      allowEmptyValue: false
      schema:
        type: string
        description: ''
        format: ''
        maxLength: 1000
        deprecated: false


  schemas:
    JsonApiResponse:
      title: 'JsonApiResponse'
      type: object
      properties:
        data:
