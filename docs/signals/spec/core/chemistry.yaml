      type: object
      properties:
        type:
          type: string
        id:
          type: string
        meta:
          $ref: '#/components/schemas/JsonApiMeta'
        attributes:
          type: object
        relationships:
          type: object
        links:
          $ref: '#/components/schemas/JsonApiLinks'
    JsonApiDataIdentifier:
      title: 'JsonApiDataIdentifier'
      type: object
      properties:
        meta:
          $ref: '#/components/schemas/JsonApiMeta'
        type:
          type: string
        id:
          type: string
    JsonApiLinks:
      title: 'JsonApiLinks'
      type: object
      properties:
        self:
          type: string
    JsonApiMeta:
      title: 'JsonApiMeta'
      type: object
      additionalProperties: true
    JsonApiIncluded:
      title: 'JsonApiIncluded'
      type: array
      items:
        $ref: '#/components/schemas/JsonApiData'
    JsonApiPagingLinks:
      title: 'JsonApiPagingLinks'
      type: object
      properties:
        self:
          type: string
        prev:
          type: string
        first:
          type: string
        next:
          type: string
    EntityApiResponse:
      type: object
      title: 'EntityApiResponse'
      properties:
        links:
          $ref: '#/components/schemas/JsonApiLinks'
        meta:
          $ref: '#/components/schemas/JsonApiMeta'
        data:
          $ref: '#/components/schemas/ExtEntity'
        included:
          $ref: '#/components/schemas/JsonApiIncluded'
    ExtEntity:
      type: object
      title: 'ExtEntity'
      properties:
        links:
          $ref: '#/components/schemas/JsonApiLinks'
        type:
          type: string
        id:
          type: string
        attributes:
          type: object
          title: 'ExtEntityAttributes'
          properties:
            id:
              type: string
            eid:
              type: string
            name:
              type: string
            synonyms:
              type: array
              items:
                type: string
            description:
              type: string
            type:
              type: string
            createdAt:
              type: string
            editedAt:
              type: string
            digest:
              type: string
            fields:
              title: 'fields'
              type: object
              additionalProperties:
                type: object
            state:
              type: string
            flags:
              type: object
            signedAt:
              type: string
            acceptedAt:
              type: string
            rejectedAt:
              type: string
            fragments:
              type: array
              items:
                type: object
                additionalProperties: true
            data:
              type: object
              additionalProperties: true
          additionalProperties: true
        relationships:
          type: object
          title: 'ExtEntityRelationships'
          properties:
            createdBy:
              $ref: '#/components/schemas/JsonApiRelationship'
            editedBy:
              $ref: '#/components/schemas/JsonApiRelationship'
            owner:
              $ref: '#/components/schemas/JsonApiRelationship'
            ancestors:
              $ref: '#/components/schemas/JsonApiRelationship'
            children:
              $ref: '#/components/schemas/JsonApiRelationship'
            systemTemplate:
              $ref: '#/components/schemas/JsonApiRelationship'
            template:
              $ref: '#/components/schemas/JsonApiRelationship'
            pdf:
              $ref: '#/components/schemas/JsonApiRelationship'
            signedBy:
              $ref: '#/components/schemas/JsonApiRelationship'
            acceptedBy:
              $ref: '#/components/schemas/JsonApiRelationship'
            rejectedBy:
              $ref: '#/components/schemas/JsonApiRelationship'
            source:
              $ref: '#/components/schemas/JsonApiRelationship'
            drawing:
              $ref: '#/components/schemas/JsonApiRelationship'
          additionalProperties: true

    PairedSequenceRequest:
      title: 'PairedSequenceRequest'
      type: object
      required: [ data ]
      properties:
        data:
          type: object
          required: [ type, attributes, relationships ]
          properties:
            type:
              type: string
            attributes:
                type: object
                required: [ name ]
                properties:
                  name:
                    type: string
                  description:
                    type: string
            relationships:
              type: object
              required: [ sequences ]
              properties:
                sequences:
                  type: object
                  required: [ data ]
                  properties:
                    data:
                      type: array
                      items:
                        type: object
                        required: [ type, id ]
                        properties:
                          type:
                            type: string
                          id:
                            type: string
    PairedSequenceRequestV2:
      title: 'PairedSequenceRequest'
      type: object
      required: [ data ]
      properties:
        data:
          type: object
          required: [ type, attributes ]
          properties:
            type:
              type: string
              enum: [ 'pairedSequence']
            attributes:
              type: object
              required: [ sequences ]
              properties:
                sequences:
                  type: array
                  items:
                    type: object
                    required: [ eid ]
                    properties:
                      eid:
                        type: string

    ErrorResponse:
      type: object
      required: [errors]
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              status:
                type: string
              code:
                type: string
              title:
                type: string
              detail:
                type: string

